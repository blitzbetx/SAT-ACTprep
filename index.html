<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAT/ACT Prep Lab</title>
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface2:#f0f2f8; --ink:#1b2133; --muted:#5d667b; --line:#e2e5ee;
  --accent:#3b5bdb; --accent-ink:#ffffff; --accent-soft:#e7ecff;
  --good:#2b8a3e; --good-soft:#e5f5e9; --bad:#c92a2a; --bad-soft:#fdeaea; --warn:#e67700;
  --eng:#6741d9; --eng-soft:#efe9ff; --math:#0b7285; --math-soft:#e3f6f9;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 16px rgba(20,30,60,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1320; --surface:#171c2b; --surface2:#1e2436; --ink:#e7eaf3; --muted:#9aa3b8; --line:#2a3146;
    --accent:#7b93ff; --accent-ink:#0f1320; --accent-soft:#232c4d;
    --good:#5fd47a; --good-soft:#163020; --bad:#ff7b7b; --bad-soft:#3a1c20; --warn:#ffb347;
    --eng:#a98bff; --eng-soft:#2a2347; --math:#4fd1e3; --math-soft:#14313a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1320; --surface:#171c2b; --surface2:#1e2436; --ink:#e7eaf3; --muted:#9aa3b8; --line:#2a3146;
  --accent:#7b93ff; --accent-ink:#0f1320; --accent-soft:#232c4d;
  --good:#5fd47a; --good-soft:#163020; --bad:#ff7b7b; --bad-soft:#3a1c20; --warn:#ffb347;
  --eng:#a98bff; --eng-soft:#2a2347; --math:#4fd1e3; --math-soft:#14313a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{line-height:1.25;margin:0 0 .5rem}
h2{font-size:1.45rem} h3{font-size:1.05rem;margin-top:1.4rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
p{margin:.4rem 0}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:1.08rem;white-space:nowrap}
.brand small{font-weight:600;color:var(--muted);font-size:.75rem;letter-spacing:.05em}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--eng));display:grid;place-items:center;color:#fff;font-weight:800}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;padding:8px 12px;border-radius:9px;color:var(--muted);font-weight:600;font-size:.93rem;white-space:nowrap;position:relative}
nav button:hover{background:var(--surface2);color:var(--ink)}
nav button.on{background:var(--accent-soft);color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.7rem;line-height:18px;text-align:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;flex:none}
main{padding:24px 16px 60px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:11px;font-weight:650;transition:transform .05s,background .15s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:.88rem;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.ghost{background:none;border:0;color:var(--muted);font-weight:600;padding:6px 4px}
.ghost:hover{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.tile .k{font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-size:1.9rem;font-weight:780;margin-top:2px}
.tile .s{font-size:.85rem;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:6px}
.qk{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.qk:hover{border-color:var(--accent)}
.qk b{display:block;font-size:1.02rem;margin-bottom:3px}
.qk span{color:var(--muted);font-size:.9rem}
.mixrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.topic{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;border-left:4px solid var(--eng)}
.topic.m{border-left-color:var(--math)}
.topic:hover{background:var(--surface2)}
.topic b{display:block;font-size:.97rem}
.topic .meta{font-size:.8rem;color:var(--muted)}
.bar{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar i.g{background:var(--good)} .bar i.w{background:var(--warn)} .bar i.r{background:var(--bad)}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.score{font-weight:650;color:var(--muted);font-size:.93rem}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--eng-soft);color:var(--eng)}
.tag.m{background:var(--math-soft);color:var(--math)}
.tag.soft{background:var(--surface2);color:var(--muted)}
.passage{background:var(--surface2);border-radius:12px;padding:16px 18px;margin-bottom:16px;font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-size:1.05rem;line-height:1.65}
.passage ul{margin:.3rem 0;padding-left:1.2rem}
.passage table{border-collapse:collapse;font-family:inherit;font-size:.95rem;margin:.3rem 0}
.passage th,.passage td{border:1px solid var(--line);padding:5px 12px;text-align:center}
.passage th{background:var(--surface)}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink);margin:0 2px}
.stem{font-weight:620;font-size:1.04rem;margin:0 0 14px}
.choices{display:grid;gap:9px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;transition:border-color .12s,background .12s}
.choice:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.choice:disabled{cursor:default}
.letter{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--muted)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .letter{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice.correct{border-color:var(--good);background:var(--good-soft)}
.choice.correct .letter{background:var(--good);border-color:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .letter{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface2)}
.fb .res{font-weight:780;margin-bottom:4px}
.fb .res.ok{color:var(--good)} .fb .res.no{color:var(--bad)}
.hint{color:var(--muted);font-size:.83rem;margin-top:14px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.testbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--shadow);position:sticky;top:70px;z-index:5}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.25rem}
.timer.low{color:var(--bad)}
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.qnav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:650}
.qnav button.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.qnav button.cur{outline:2px solid var(--accent);outline-offset:1px}
.qnav button.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.qnav button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.seg{display:inline-flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;border-radius:9px;font-weight:650;color:var(--muted);font-size:.92rem}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{margin:14px 0}
.field label{display:block;font-weight:650;margin-bottom:6px;font-size:.92rem}
.big{font-size:2.6rem;font-weight:800}
details.rv{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;background:var(--surface)}
details.rv summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
details.rv summary::-webkit-details-marker{display:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--good)} .dot.no{background:var(--bad)} .dot.skip{background:var(--muted)}
.rv .body{margin-top:10px}
.mini{font-size:.9rem}
/* flashcards */
.fcwrap{max-width:640px;margin:0 auto}
.card3d{perspective:1400px;height:330px;margin:14px 0;cursor:pointer;outline:none}
.card3d .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card3d.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--surface)}
.face .word{font-size:2.2rem;font-weight:800;letter-spacing:-.01em}
.face .pos{color:var(--muted);font-style:italic;margin-top:4px}
.face .lbl{position:absolute;top:14px;left:18px;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.face .st{position:absolute;top:12px;right:16px}
.face .def{font-size:1.15rem;font-weight:600}
.face .ex{color:var(--muted);font-style:italic;margin-top:10px;font-family:Georgia,serif}
.face .fml{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:1.12rem;background:var(--surface2);padding:10px 14px;border-radius:10px;margin-top:6px}
.fcctl{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.pillst{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px}
.pillst.know{background:var(--good-soft);color:var(--good)} .pillst.learn{background:#fff3e0;color:#b35c00}
:root[data-theme="dark"] .pillst.learn{background:#3a2a12;color:var(--warn)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pillst.learn{background:#3a2a12;color:var(--warn)}}
table.prog{width:100%;border-collapse:collapse;font-size:.94rem}
table.prog td,table.prog th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
table.prog th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
table.prog td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.prog .bar{margin:0;min-width:80px}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .c i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.chart .c span{font-size:.68rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tip{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:10px}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:0 16px 30px}
kbd{font-family:inherit;font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
@media (max-width:720px){
  .grid2{grid-template-columns:1fr}
  .qcard,.panel{padding:16px;border-radius:14px}
  .brand small{display:none}
  .card3d{height:300px}
  .face .word{font-size:1.8rem}
  header.top{position:static}
  .topin{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:6px;gap:8px}
  .brand{flex:1}
  nav{order:3;flex-basis:100%;margin:0 -6px;flex-wrap:wrap;overflow:visible}
  nav button{padding:7px 10px;font-size:.88rem}
  .testbar{top:8px}
  main{padding:16px 16px 50px}
  .hint,footer{display:none}
  .big{font-size:2rem}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap topin">
    <div class="brand"><span class="logo">P</span>Prep Lab <small>SAT · ACT</small></div>
    <nav id="nav" aria-label="Main"></nav>
    <button class="iconbtn" id="themeBtn" title="Toggle light/dark" aria-label="Toggle theme">◐</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer>Progress is saved in this browser only. Keyboard: <kbd>1</kbd>–<kbd>4</kbd> or <kbd>A</kbd>–<kbd>D</kbd> to answer, <kbd>Enter</kbd> for next; flashcards: <kbd>Space</kbd> flip, <kbd>←</kbd>/<kbd>→</kbd> move, <kbd>K</kbd> know it, <kbd>L</kbd> still learning.</footer>

<script>
"use strict";
/* =====================================================================
   TOPICS
   ===================================================================== */
const TOPICS = {
  punc:{n:"Punctuation & Boundaries",s:"E"}, sva:{n:"Subject–Verb Agreement",s:"E"}, pron:{n:"Pronouns",s:"E"},
  mod:{n:"Modifiers",s:"E"}, para:{n:"Parallel Structure",s:"E"}, tense:{n:"Verb Tense",s:"E"},
  trans:{n:"Transitions",s:"E"}, wic:{n:"Words in Context",s:"E"}, synth:{n:"Rhetorical Synthesis",s:"E"},
  read:{n:"Main Idea & Inference",s:"E"}, conc:{n:"Concision & Style",s:"E"}, evid:{n:"Command of Evidence",s:"E"},
  lin:{n:"Linear Equations",s:"M"}, sys:{n:"Systems of Equations",s:"M"}, quad:{n:"Quadratics",s:"M"},
  func:{n:"Functions",s:"M"}, expo:{n:"Exponentials",s:"M"}, poly:{n:"Polynomials",s:"M"},
  pct:{n:"Ratios & Percents",s:"M"}, stat:{n:"Statistics",s:"M"}, prob:{n:"Probability",s:"M"},
  geo:{n:"Geometry",s:"M"}, trig:{n:"Trigonometry",s:"M"}, word:{n:"Word Problems",s:"M"}
};
const ETOP = Object.keys(TOPICS).filter(k=>TOPICS[k].s==="E");
const MTOP = Object.keys(TOPICS).filter(k=>TOPICS[k].s==="M");
const BL = '<span class="blank"></span>';
const STD = "Which choice completes the text so that it conforms to the conventions of Standard English?";
const WIC = "Which choice completes the text with the most logical and precise word or phrase?";
const TRN = "Which choice completes the text with the most logical transition?";
const SYN = "Which choice most effectively uses relevant information from the notes to accomplish this goal?";

/* =====================================================================
   HAND-WRITTEN QUESTION BANK  (correct answer is always listed first;
   choices are shuffled when shown)
   ===================================================================== */
const BANK = [];
function add(t,q,c,e,p){ BANK.push({id:"b"+BANK.length,t,s:TOPICS[t].s,q,c,a:0,e,p:p||""}); }
function gq(t,sent,c,e){ add(t,STD,c,e,sent.replace("___",BL)); }

/* ---- Punctuation & boundaries ---- */
gq("punc","The Mariana Trench is the deepest known point in Earth’s ___ lowest region, the Challenger Deep, lies nearly 11,000 meters below sea level.",
 ["oceans; its","oceans, its","oceans its","oceans, and, its"],
 "Both halves are independent clauses (each could stand alone). A semicolon can join two independent clauses. A comma alone creates a comma splice, and no punctuation creates a run-on.");
gq("punc","The recipe calls for three essential ___ coriander, and turmeric.",
 ["spices: cumin,","spices; cumin,","spices, such as: cumin,","spices which cumin,"],
 "A colon can follow a complete independent clause to introduce a list. A semicolon must be followed by an independent clause, and a colon should not come directly after “such as.”");
gq("punc","Rosalind ___ produced the X-ray image that revealed the helical structure of DNA.",
 ["Franklin, a British chemist,","Franklin, a British chemist","Franklin a British chemist,","Franklin; a British chemist,"],
 "“A British chemist” is a nonessential appositive, so it needs a matching pair of commas around it—one before and one after.");
gq("punc","After the flood, volunteers rebuilt all of the ___ along the riverbank.",
 ["herons’ nests","heron’s nests","herons nests","herons’s nests"],
 "“All of the” nests belong to many herons, so the plural possessive is needed: herons + apostrophe → herons’.");
gq("punc","The novel that won this year’s ___ a family across four generations of change.",
 ["prize follows","prize, follows","prize—follows","prize; follows"],
 "The subject is “The novel that won this year’s prize” and the verb is “follows.” Never separate a subject from its verb with a single punctuation mark.");
gq("punc","The city’s oldest bridge—built in 1874 and restored twice ___ open to pedestrians today.",
 ["since—remains","since, remains","since; remains","since remains"],
 "The interrupting phrase opened with a dash, so it must close with a dash. Mixing a dash with a comma is incorrect.");
gq("punc","Jazz pianist Mary Lou Williams composed hundreds of ___ also mentored younger artists such as Thelonious Monk.",
 ["pieces, and she","pieces and, she","pieces, she","pieces, and, she"],
 "To join two independent clauses with a coordinating conjunction (FANBOYS), put a comma before the conjunction: “pieces, and she.” A comma alone is a comma splice.");
gq("punc","The experiment’s first trial ___ the second trial produced the expected results.",
 ["failed; however,","failed, however,","failed; however","failed however,"],
 "“However” here links two independent clauses, so it needs a semicolon before it and a comma after it.");
gq("punc","Many historians argue that the printing ___ European society more than any other invention of its era.",
 ["press transformed","press, transformed","press—transformed","press; transformed"],
 "“The printing press” is the subject of the clause and “transformed” is its verb; no punctuation should separate them.");
gq("punc","The team’s goal was ___ the regional championship for the first time in school history.",
 ["simple: win","simple; win","simple, win","simple: to, win"],
 "A colon can follow an independent clause to introduce an explanation. A semicolon would require an independent clause after it, and a comma here creates an awkward splice.");
gq("punc","Octavia Butler’s novel ___ published in 1979, blends science fiction with historical fiction.",
 ["Kindred,","Kindred","Kindred;","Kindred:"],
 "“Published in 1979” is a nonessential phrase. It is already closed by the comma after “1979,” so it must be opened by a comma after “Kindred.” (No comma goes between “novel” and “Kindred” because Butler wrote several novels, so the title is essential.)");
gq("punc","The museum’s new exhibit ___ which opened last month, features artifacts from ancient Mesopotamia.",
 ["hall,","hall","hall;","hall:"],
 "“Which opened last month” is a nonessential clause. It is closed by a comma after “month,” so it must be opened by a comma after “hall.”");

/* ---- Subject–verb agreement ---- */
gq("sva","The collection of rare manuscripts, some dating to the twelfth century, ___ in a climate-controlled vault.",
 ["is housed","are housed","were housed","have been housed"],
 "The subject is the singular “collection,” not “manuscripts” (which is inside a prepositional phrase). A singular subject takes the singular verb “is.”");
gq("sva","Neither the coach nor the players ___ satisfied with the referee’s decision.",
 ["were","was","is","has been"],
 "With “neither…nor,” the verb agrees with the subject closer to it. “Players” is plural, so the verb is “were.”");
gq("sva","Each of the twenty volunteers ___ responsible for cleaning a single section of the trail.",
 ["is","are","were","have been"],
 "“Each” is the subject and is always singular. “Of the twenty volunteers” is a prepositional phrase and does not change the number.");
gq("sva","Along the outer edge of the reef ___ several species of brightly colored fish.",
 ["live","lives","is living","has lived"],
 "This sentence is inverted: the subject “several species” comes after the verb. “Several species” is plural, so the verb is “live.”");
gq("sva","The agency’s report, along with two independent studies, ___ that the new policy reduced traffic deaths.",
 ["suggests","suggest","are suggesting","have suggested"],
 "Phrases like “along with,” “as well as,” and “together with” do not make a subject plural. The subject is the singular “report.”");
gq("sva","The number of students taking advanced math courses ___ risen steadily over the past decade.",
 ["has","have","are","were"],
 "“The number” is singular (while “a number of” is plural). The singular subject takes “has.”");
gq("sva","Mathematics, despite its reputation for difficulty, ___ often the favorite subject of students who enjoy puzzles.",
 ["is","are","were","have been"],
 "“Mathematics” ends in -s but is a singular noun (like “physics” and “news”), so it takes “is.”");

/* ---- Pronouns ---- */
gq("pron","After customers raised concerns, the company updated ___ privacy policy.",
 ["its","it’s","their","its’"],
 "“Company” is singular, so the possessive pronoun is “its” (no apostrophe). “It’s” means “it is,” and “its’” is never correct.");
gq("pron","When Maya and ___ finished the experiment, we recorded our results in a shared notebook.",
 ["I","me","myself","us"],
 "Drop “Maya and” to test: “When I finished” is correct, not “When me finished.” Subject pronouns (I, he, she, we, they) are used as subjects.");
gq("pron","The jury delivered ___ verdict after three days of deliberation.",
 ["its","their","it’s","they’re"],
 "A collective noun acting as one unit (“jury”) is singular and takes the singular possessive “its.”");
gq("pron","The award was presented to Dr. Chen and ___ at the end of the ceremony.",
 ["me","I","myself","mine"],
 "Drop “Dr. Chen and”: “presented to me.” After a preposition, use an object pronoun (me, him, her, us, them).");
gq("pron","The scientist ___ the committee honored has published more than forty papers on coral ecology.",
 ["whom","who","which","whose"],
 "The committee honored HIM/HER, an object, so use “whom.” (Use “who” where you would say he/she.)");
gq("pron","Before the debate, each of the candidates submitted ___ opening statement to the moderator.",
 ["his or her","their","its","they’re"],
 "“Each” is singular, and the candidates are people, so formal Standard English uses “his or her.” (“Its” is for things.)");
gq("pron","The researchers compared the new vaccine with older versions and found that ___ produced a stronger immune response.",
 ["the new vaccine","it","they","this"],
 "“It” could refer to the new vaccine or an older one, and “they” could refer to the researchers. Naming the noun removes the ambiguity.");

 "Not all deserts are hot. "+BL+", the Gobi Desert in Mongolia regularly sees winter temperatures below −30°C.");

   ===================================================================== */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nz=(a,b)=>{let v;do{v=ri(a,b)}while(v===0);return v;};
const MN="−";
function fmt(n){ n=Math.round(n*100)/100; if(Object.is(n,-0)) n=0; return n<0? MN+Math.abs(n) : String(n); }
function paren(n){ return n<0? "("+fmt(n)+")" : fmt(n); }
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t;}return a||1;}
function frac(n,d){ if(d<0){n=-n;d=-d;} const g=gcd(n,d); n/=g; d/=g; return d===1? fmt(n) : (n<0?MN:"")+Math.abs(n)+"/"+d; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function poly(cs,v){ v=v||"x"; const deg=cs.length-1; let s="";
  cs.forEach((c,i)=>{ const p=deg-i; if(!c) return; const ab=Math.abs(c);
    const coef=(ab===1&&p>0)?"":String(ab); const vp=p===0?"":p===1?v:v+(p===2?"²":p===3?"³":"^"+p);
    const term=coef+vp; if(!s) s=(c<0?MN:"")+term; else s+=(c<0?" "+MN+" ":" + ")+term; });
  return s||"0"; }
function lin2(a,b,c){ // ax + by = c
  let s=""; const t=(k,v)=>Math.abs(k)===1?v:Math.abs(k)+v;
  if(a) s=(a<0?MN:"")+t(a,"x");
  if(b) s+= s? (b<0?" "+MN+" ":" + ")+t(b,"y") : (b<0?MN:"")+t(b,"y");
  return s+" = "+fmt(c); }
function fac(r){ return r<0? `(x + ${-r})` : `(x ${MN} ${r})`; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
let gid=0;
function mk(t,q,correct,wrongs,e,p){
  const out=[String(correct)];
  for(const w of wrongs){ const s=String(w); if(!out.includes(s)) out.push(s); if(out.length===4) break; }
  const cs=String(correct).replace(MN,"-");
  const num=Number(cs), fm=cs.match(/^(-?\d+)\/(\d+)$/), pm=cs.match(/^(-?\d+(?:\.\d+)?)π$/);
  let k=1;
  while(out.length<4 && k<40){
    const dlt=k%2? Math.ceil(k/2) : -Math.ceil(k/2); let cand=null;
    if(isFinite(num)) cand=fmt(num+dlt);
    else if(fm) cand=frac(Number(fm[1])+dlt,Number(fm[2]));
    else if(pm && Number(pm[1])+dlt>0) cand=fmt(Number(pm[1])+dlt)+"π";
    if(cand && !out.includes(cand)) out.push(cand);
    k++;
  }
  while(out.length<4) out.push("None of these");  // safety only
  return {id:"g"+(Date.now().toString(36))+(gid++), t, s:TOPICS[t].s, q, c:out, a:0, e, p:p||"", gen:true};
}

const KEY="prepLab.v1";
function DEF(){ return {stats:{},days:{},streak:{cur:0,best:0},missed:[],cards:{},tests:[],theme:""}; }
function load(){ try{ const raw=localStorage.getItem(KEY); if(!raw) return DEF(); const o=JSON.parse(raw); const d=DEF(); return Object.assign(d,o&&typeof o==="object"?o:{}); }catch(e){ return DEF(); } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
let S=load();
function dkey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return dkey(new Date()); }
function dayStreak(){ let n=0; const d=new Date(); if(!S.days[dkey(d)]) d.setDate(d.getDate()-1); while(S.days[dkey(d)]){ n++; d.setDate(d.getDate()-1); } return n; }
function rec(q,ok,fromReview){
  const st=S.stats[q.t]||(S.stats[q.t]={n:0,c:0}); st.n++; if(ok) st.c++;
  const d=today(); S.days[d]=(S.days[d]||0)+1;
  S.streak.cur= ok? S.streak.cur+1 : 0; S.streak.best=Math.max(S.streak.best,S.streak.cur);
  if(!ok) addMissed(q); else if(fromReview) removeMissed(q.id);
  save();
}
function addMissed(q){ S.missed=S.missed.filter(m=>m.id!==q.id); S.missed.push({id:q.id,t:q.t,s:q.s,q:q.q,c:q.c,a:q.a,e:q.e,p:q.p}); if(S.missed.length>200) S.missed.shift(); }
function removeMissed(id){ S.missed=S.missed.filter(m=>m.id!==id); }
function acc(t){ const s=S.stats[t]; return s&&s.n? Math.round(100*s.c/s.n) : null; }
function totals(sec){ let n=0,c=0; for(const k in S.stats){ if(TOPICS[k] && (!sec||TOPICS[k].s===sec)){ n+=S.stats[k].n; c+=S.stats[k].c; } } return {n,c,p:n?Math.round(100*c/n):0}; }
function barCls(p){ return p===null?"":p>=80?"g":p>=60?"":p>=40?"w":"r"; }

/* =====================================================================
   QUESTION SELECTION
   ===================================================================== */
function prep(q){ const idx=shuffle([0,1,2,3].slice(0,q.c.length)); return Object.assign({},q,{c:idx.map(i=>q.c[i]),a:idx.indexOf(q.a)}); }
function wpick(keys,ws){ let s=ws.reduce((a,b)=>a+b,0), r=Math.random()*s; for(let i=0;i<keys.length;i++){ r-=ws[i]; if(r<=0) return keys[i]; } return keys[keys.length-1]; }
function smartTopic(){ const ks=Object.keys(TOPICS); return wpick(ks,ks.map(k=>{ const s=S.stats[k]; let w= !s||s.n<4? 2 : 1+4*(1-s.c/s.n); return TOPICS[k].s==="E"? w*1.4 : w; })); }
function topicFor(mode){
  if(mode.kind==="topic") return mode.topic;
  if(mode.kind==="E") return pick(ETOP);
  if(mode.kind==="M") return pick(MTOP);
  if(mode.kind==="smart") return smartTopic();
  return Math.random()<.6? pick(ETOP) : pick(MTOP);
}
function drawQuestion(mode,seen){
  const t=topicFor(mode);
  const bank=BANK.filter(q=>q.t===t), avail=bank.filter(q=>!seen.has(q.id)), gens=GEN[t]||[];
  let q;
  if(avail.length && (!gens.length || Math.random()<.5)) q=pick(avail);
  else if(gens.length){ try{ q=pick(gens)(); }catch(e){ q=null; } if(!q) q=pick(bank); }
  else { bank.forEach(b=>seen.delete(b.id)); q=pick(bank); }
  seen.add(q.id);
  return prep(q);
}

function startPractice(kind,topic){
  sess={mode:{kind,topic},seen:new Set(),n:0,c:0,q:null,picked:null,answered:false,queue:null};
  if(kind==="review"){ sess.queue=shuffle(S.missed.slice()); if(!sess.queue.length){ sess=null; go("review"); return; } }
  nextQ(); view= kind==="review"?"review":"practice"; renderNav(); render(); window.scrollTo(0,0);
}
function nextQ(){
  if(sess.mode.kind==="review"){ const q=sess.queue.shift(); sess.q=q? prep(Object.assign({},q,{c:q.c.slice()})) : null; }
  else sess.q=drawQuestion(sess.mode,sess.seen);
  sess.picked=null; sess.answered=false;
}
function modeLabel(m){ return m.kind==="topic"?TOPICS[m.topic].n : {E:"All English",M:"All Math",X:"Mixed (60% English)",smart:"Smart Mix",review:"Review missed"}[m.kind]; }

  if(!sess||sess.answered) return; sess.picked=i; sess.answered=true; const ok=i===sess.q.a;

/* ---------- Timed test ---------- */
let testCfg={n:20,mix:"X"};
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function startTest(){
  const seen=new Set(), qs=[]; const n=testCfg.n;
  if(testCfg.mix==="X"){ const ne=Math.round(n*.6); for(let i=0;i<ne;i++) qs.push(drawQuestion({kind:"E"},seen)); for(let i=ne;i<n;i++) qs.push(drawQuestion({kind:"M"},seen)); }
  else for(let i=0;i<n;i++) qs.push(drawQuestion({kind:testCfg.mix},seen));
  const secs=qs.reduce((s,q)=>s+(q.s==="E"?71:95),0);
  T={qs,ans:qs.map(()=>null),idx:0,secs,end:Date.now()+secs*1000,start:Date.now(),done:false};
  stopTimer(); timerId=setInterval(tick,500); render();
}
function fmtTime(s){ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function tick(){ if(!T||T.done){ stopTimer(); return; } const left=(T.end-Date.now())/1000; const el=document.getElementById("timer");
  if(el){ el.textContent=fmtTime(left); el.classList.toggle("low",left<60); } if(left<=0) submitTest(true); }
function tAnswer(i){ if(!T||T.done) return; T.ans[T.idx]=i; render(); }
function tGo(i){ if(!T) return; T.idx=Math.max(0,Math.min(T.qs.length-1,i)); render(); }
function submitTest(auto){
  if(!T||T.done) return;
  if(!auto){ const un=T.ans.filter(a=>a===null).length; if(un && !confirm(`You have ${un} unanswered question${un>1?"s":""}. Submit anyway?`)) return; }
  stopTimer(); T.done=true; T.used=Math.round((Date.now()-T.start)/1000);
  T.qs.forEach((q,i)=>rec(q,T.ans[i]===q.a,false));
  const c=T.qs.filter((q,i)=>T.ans[i]===q.a).length;
  S.tests.push({d:today(),c,n:T.qs.length,mix:testCfg.mix}); if(S.tests.length>50) S.tests.shift(); save();
  renderNav(); render(); window.scrollTo(0,0);
}
function rTest(){
  if(!T){
    const est=testCfg.mix==="E"?testCfg.n*71:testCfg.mix==="M"?testCfg.n*95:Math.round(testCfg.n*.6)*71+(testCfg.n-Math.round(testCfg.n*.6))*95;
    const last=S.tests.slice(-5).reverse();
    app.innerHTML=`<section class="panel"><h2>Timed Test</h2><p class="muted">Simulates test pressure: about 71 seconds per Reading &amp; Writing question and 95 seconds per Math question (the real SAT pacing). You can skip around and change answers until you submit. Explanations appear at the end.</p>
      <div class="field"><label>Number of questions</label><div class="seg">${[10,20,30,44].map(n=>`<button class="${testCfg.n===n?"on":""}" onclick="testCfg.n=${n};rTest()">${n}</button>`).join("")}</div></div>
      <div class="field"><label>Content</label><div class="seg">${[["X","Mixed (60% English)"],["E","English only"],["M","Math only"]].map(([k,l])=>`<button class="${testCfg.mix===k?"on":""}" onclick="testCfg.mix='${k}';rTest()">${l}</button>`).join("")}</div></div>
      <p>Time limit: <b>${fmtTime(est)}</b></p>
      <div class="row" style="margin-top:12px"><button class="btn pri" onclick="startTest()">Start test</button></div></section>
      ${last.length?`<section class="panel"><h3 style="margin-top:0">Recent tests</h3>${last.map(t=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0"><span>${t.d} · ${{X:"Mixed",E:"English",M:"Math"}[t.mix]}</span><b>${t.c}/${t.n} (${Math.round(100*t.c/t.n)}%)</b></div>`).join("")}</section>`:""}`;
    return;
  }
  if(!T.done){
    const q=T.qs[T.idx], left=(T.end-Date.now())/1000, answered=T.ans.filter(a=>a!==null).length;
    app.innerHTML=`<div class="testbar"><div><b>Question ${T.idx+1}</b> <span class="muted">of ${T.qs.length} · ${answered} answered</span></div>
      <div id="timer" class="timer ${left<60?"low":""}">${fmtTime(left)}</div><button class="btn pri sm" onclick="submitTest()">Submit</button></div>
      <div class="qnav">${T.qs.map((x,i)=>`<button class="${T.ans[i]!==null?"ans":""} ${i===T.idx?"cur":""}" onclick="tGo(${i})">${i+1}</button>`).join("")}</div>
      <article class="qcard"><div class="tags">${secTag(q)}</div>${qBody(q)}${choicesHTML(q,T.ans[T.idx],false,"tAnswer")}
      <div class="actions"><button class="btn" onclick="tGo(${T.idx-1})" ${T.idx===0?"disabled":""}>← Previous</button>
      ${T.idx<T.qs.length-1?`<button class="btn pri" onclick="tGo(${T.idx+1})">Next →</button>`:`<button class="btn pri" onclick="submitTest()">Submit test</button>`}</div></article>`;
    return;
  }
  const c=T.qs.filter((q,i)=>T.ans[i]===q.a).length, n=T.qs.length;
  const part=s=>{ const idx=T.qs.map((q,i)=>i).filter(i=>T.qs[i].s===s); const k=idx.filter(i=>T.ans[i]===T.qs[i].a).length; return idx.length?`${k}/${idx.length}`:"—"; };
  app.innerHTML=`<section class="panel"><h2>Test results</h2>
    <div class="row" style="gap:28px;align-items:flex-end"><div><div class="big">${Math.round(100*c/n)}%</div><div class="muted">${c} of ${n} correct</div></div>
    <div><b>English</b><br>${part("E")}</div><div><b>Math</b><br>${part("M")}</div><div><b>Time used</b><br>${fmtTime(T.used)} of ${fmtTime(T.secs)}</div></div>
    <div class="row" style="margin-top:16px"><button class="btn pri" onclick="T=null;startTest()">New test</button><button class="btn" onclick="T=null;rTest()">Change settings</button>${S.missed.length?`<button class="btn" onclick="T=null;go('review')">Review missed (${S.missed.length})</button>`:""}</div></section>
    <section class="panel"><h3 style="margin-top:0">Question by question</h3>
    ${T.qs.map((q,i)=>{ const a=T.ans[i], ok=a===q.a; return `<details class="rv"><summary><span class="dot ${a===null?"skip":ok?"":"no"}"></span>${i+1}. ${TOPICS[q.t].n} <span class="muted mini">— ${a===null?"skipped":ok?"correct":"incorrect"}</span></summary>
      <div class="body">${qBody(q)}${choicesHTML(q,a,true,"void")}<div class="fb">${q.e}</div></div></details>`; }).join("")}</section>`;
}

/* ---------- Review ---------- */
function rReview(){
  if(sess && sess.mode.kind==="review"){ if(!sess.q){ sess=null; } else { app.innerHTML=practiceScreen(); return; } }
  const by={}; S.missed.forEach(m=>{ by[m.t]=(by[m.t]||0)+1; });
  app.innerHTML=`<section class="panel"><h2>Review missed questions</h2>
  ${S.missed.length?`<p class="muted">You have <b>${S.missed.length}</b> question${S.missed.length>1?"s":""} to review. Answer one correctly and it leaves the list; miss it again and it stays.</p>
    <div class="row" style="margin:14px 0"><button class="btn pri" onclick="startPractice('review')">Start review</button><button class="btn bad" onclick="if(confirm('Clear all missed questions?')){S.missed=[];save();renderNav();rReview();}">Clear list</button></div>
    <table class="prog"><tr><th>Topic</th><th style="text-align:right">Missed</th></tr>${Object.keys(by).sort((a,b)=>by[b]-by[a]).map(k=>`<tr><td>${TOPICS[k].n}</td><td class="n">${by[k]}</td></tr>`).join("")}</table>`
  :`<p class="muted">Nothing to review — questions you miss in Practice or a Timed Test will show up here.</p><div class="row" style="margin-top:12px"><button class="btn pri" onclick="startPractice('smart')">Practice now</button></div>`}
  </section>`;
}

/* ---------- Flashcards ---------- */
const FC={deck:"vocab",filter:"all",order:[],i:0};
function fcState(id){ return (S.cards[FC.deck]||{})[id]; }
function fcBuild(shuf){ const d=DECKS[FC.deck], m=S.cards[FC.deck]||{};
  let list=d.filter(c=> FC.filter==="all" || (FC.filter==="learn"&&m[c.id]==="learn") || (FC.filter==="notknown"&&m[c.id]!=="know"));
  FC.order=(shuf?shuffle(list):list).map(c=>c.id); FC.i=0; }
function fcSet(deck){ FC.deck=deck; FC.filter="all"; fcBuild(false); rCards(); }
function fcFilter(f){ FC.filter=f; fcBuild(false); rCards(); }
function fcFlip(){ const el=document.getElementById("card3d"); if(el) el.classList.toggle("flipped"); }
function fcMove(d){ if(!FC.order.length) return; FC.i=(FC.i+d+FC.order.length)%FC.order.length; rCards(); }
function fcMark(v){ if(!FC.order.length) return; const id=FC.order[FC.i]; (S.cards[FC.deck]=S.cards[FC.deck]||{})[id]=v; save(); fcMove(1); }
function fcReset(){ if(confirm(`Reset “know it / still learning” marks for ${DECK_NAMES[FC.deck]}?`)){ S.cards[FC.deck]={}; save(); fcBuild(false); rCards(); } }
function rCards(){
  if(!FC.order.length && FC.filter==="all") fcBuild(false);
  const d=DECKS[FC.deck], m=S.cards[FC.deck]||{}; const know=d.filter(c=>m[c.id]==="know").length, learn=d.filter(c=>m[c.id]==="learn").length;
  const card=FC.order.length? d.find(c=>c.id===FC.order[FC.i]) : null; const st=card?m[card.id]:null;
  const stp=st?`<span class="pillst ${st}">${st==="know"?"Know it":"Still learning"}</span>`:"";
  app.innerHTML=`<div class="fcwrap"><section class="panel">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">Flashcards</h2><span class="muted mini">${know} known · ${learn} learning · ${d.length} total</span></div>
    <div class="bar" style="margin:10px 0 14px"><i class="g" style="width:${Math.round(100*know/d.length)}%"></i></div>
    <div class="seg" style="margin-bottom:8px">${Object.keys(DECKS).map(k=>`<button class="${FC.deck===k?"on":""}" onclick="fcSet('${k}')">${DECK_NAMES[k]}</button>`).join("")}</div>
    <div class="seg">${[["all","All cards"],["notknown","Not known yet"],["learn","Still learning"]].map(([k,l])=>`<button class="${FC.filter===k?"on":""}" onclick="fcFilter('${k}')">${l}</button>`).join("")}</div>
    ${card?`<div class="card3d" id="card3d" tabindex="0" onclick="fcFlip()" role="button" aria-label="Flip card">
      <div class="inner"><div class="face front"><span class="lbl">${DECK_NAMES[FC.deck]}</span><span class="st">${stp}</span>${card.front}<div class="muted mini" style="margin-top:18px">Click or press Space to flip</div></div>
      <div class="face back"><span class="lbl">Answer</span><span class="st">${stp}</span>${card.back}</div></div></div>
      <div class="fcctl"><button class="btn" onclick="fcMove(-1)">← Prev</button><button class="btn" onclick="fcFlip()">Flip</button><button class="btn" onclick="fcMove(1)">Next →</button></div>
      <div class="fcctl" style="margin-top:10px"><button class="btn bad" onclick="fcMark('learn')">Still learning <kbd>L</kbd></button><button class="btn good" onclick="fcMark('know')">Know it <kbd>K</kbd></button></div>
      <div class="row" style="justify-content:space-between;margin-top:16px"><span class="muted mini">Card ${FC.i+1} of ${FC.order.length}</span>
      <span class="row"><button class="btn sm" onclick="fcBuild(true);rCards()">Shuffle</button><button class="btn sm" onclick="fcReset()">Reset marks</button></span></div>`
    :`<p class="muted" style="margin-top:20px">No cards match this filter. ${FC.filter==="learn"?"Mark cards as “still learning” to build a focused review pile.":"You know every card in this deck — nice work!"}</p>`}
  </section></div>`;
}

/* ---------- Progress ---------- */
function rProgress(){
  const t=totals(), te=totals("E"), tm=totals("M");
  const days=[]; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push([d,S.days[dkey(d)]||0]); }
  const mx=Math.max(5,...days.map(x=>x[1]));
  const row=k=>{ const s=S.stats[k], a=acc(k); return `<tr><td>${TOPICS[k].n}</td><td style="width:40%"><div class="bar"><i class="${barCls(a)}" style="width:${a||0}%"></i></div></td><td class="n">${s&&s.n?a+"%":"—"}</td><td class="n muted">${s?s.c+"/"+s.n:"0/0"}</td><td class="n"><button class="btn sm" onclick="startPractice('topic','${k}')">Practice</button></td></tr>`; };
  const tested=Object.keys(TOPICS).filter(k=>S.stats[k]&&S.stats[k].n>=3).sort((a,b)=>acc(a)-acc(b));
  const cardsKnown=Object.keys(DECKS).map(k=>{ const m=S.cards[k]||{}; return `${DECK_NAMES[k]}: ${DECKS[k].filter(c=>m[c.id]==="know").length}/${DECKS[k].length}`; }).join(" · ");
  app.innerHTML=`<div class="tiles">
    <div class="tile"><div class="k">Total answered</div><div class="v">${t.n}</div><div class="s">${t.p}% accuracy</div></div>
    <div class="tile"><div class="k">Day streak</div><div class="v">${dayStreak()}</div><div class="s">consecutive days practiced</div></div>
    <div class="tile"><div class="k">Answer streak</div><div class="v">${S.streak.cur}</div><div class="s">Best ever: ${S.streak.best}</div></div>
    <div class="tile"><div class="k">Tests taken</div><div class="v">${S.tests.length}</div><div class="s">${S.tests.length?"Last: "+Math.round(100*S.tests[S.tests.length-1].c/S.tests[S.tests.length-1].n)+"%":"None yet"}</div></div>
  </div>
  <section class="panel" style="margin-top:18px"><div class="grid2"><div><h3 style="margin-top:0">Last 14 days</h3>
    <div class="chart">${days.map(([d,n])=>`<div class="c" title="${dkey(d)}: ${n} questions"><i style="height:${Math.round(100*n/mx)}%"></i><span>${d.getDate()}</span></div>`).join("")}</div></div>
    <div><h3 style="margin-top:0">Focus next</h3>${tested.length?tested.slice(0,3).map(k=>`<p>• <b>${TOPICS[k].n}</b> <span class="muted">(${acc(k)}%)</span></p>`).join(""):`<p class="muted">Answer at least 3 questions in a topic to see suggestions.</p>`}
    <p class="muted mini" style="margin-top:10px">Flashcards known — ${cardsKnown}</p></div></div></section>
  <section class="panel"><h3 style="margin-top:0">English — ${te.n?te.p+"%":"no data"} <span class="muted mini">(${te.n} answered)</span></h3>
    <table class="prog">${ETOP.map(row).join("")}</table>
    <h3>Math — ${tm.n?tm.p+"%":"no data"} <span class="muted mini">(${tm.n} answered)</span></h3>
    <table class="prog">${MTOP.map(row).join("")}</table>
    <div class="row" style="margin-top:18px"><button class="btn bad sm" onclick="if(confirm('Erase ALL progress, missed questions, and flashcard marks? This cannot be undone.')){const th=S.theme;S=DEF();S.theme=th;save();renderNav();rProgress();}">Reset all progress</button></div></section>`;
}

/* =====================================================================
   THEME + KEYBOARD + INIT
   ===================================================================== */
function applyTheme(){ const r=document.documentElement; if(S.theme) r.setAttribute("data-theme",S.theme); else r.removeAttribute("data-theme"); }
document.getElementById("themeBtn").onclick=()=>{
  const dark= S.theme? S.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  S.theme= dark?"light":"dark"; save(); applyTheme();
};
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea"||tag==="select") return;
  const k=e.key.toLowerCase(); const idx="1234".indexOf(k)>=0?"1234".indexOf(k):"abcd".indexOf(k);
  if((view==="practice"||view==="review") && sess && sess.q){
    if(!sess.answered && idx>=0 && idx<sess.q.c.length){ e.preventDefault(); pAnswer(idx); }
    else if(sess.answered && k==="enter"){ e.preventDefault(); if(sess.mode.kind==="review"&&!sess.queue.length) endPractice(); else pNext(); }
  } else if(view==="test" && T && !T.done){
    if(idx>=0 && idx<T.qs[T.idx].c.length){ e.preventDefault(); tAnswer(idx); }
    else if(k==="arrowright"){ tGo(T.idx+1); } else if(k==="arrowleft"){ tGo(T.idx-1); }
  } else if(view==="cards"){
    if(k===" "||k==="enter"){ e.preventDefault(); fcFlip(); }
    else if(k==="arrowright") fcMove(1); else if(k==="arrowleft") fcMove(-1);
    else if(k==="k") fcMark("know"); else if(k==="l") fcMark("learn");
  }
});
applyTheme(); renderNav(); render();
</script>
</body>
