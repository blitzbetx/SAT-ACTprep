add("lin","What is the sum of all solutions to |2x − 5| = 9?",["5","7","−2","9"],
 "Split it into two equations: 2x − 5 = 9 gives x = 7, and 2x − 5 = −9 gives x = −2. Sum: 7 + (−2) = 5.");
add("lin","A line has slope 3 and passes through (2, −1). What is its y-intercept?",["−7","−1","5","7"],
 "Use y = mx + b: −1 = 3(2) + b → −1 = 6 + b → b = −7.");
add("lin","The equation y = 12x + 40 gives the total cost y, in dollars, of renting a kayak for x hours. What does 12 represent?",
 ["The cost per hour of renting the kayak","The fixed fee charged for any rental","The total cost of a 1-hour rental","The number of hours the kayak is rented"],
 "In y = mx + b, the slope m is the rate of change: the cost goes up $12 for each additional hour. The 40 is the fixed fee.");
add("lin","What is the x-intercept of the graph of 4x − 3y = 24?",["6","−8","8","4"],
 "At the x-intercept, y = 0: 4x = 24 → x = 6. (−8 is the y-intercept.)");
add("lin","How many solutions does 3(2x − 1) = 6x + 5 have?",["Zero","Exactly one","Exactly two","Infinitely many"],
 "Distribute: 6x − 3 = 6x + 5. Subtract 6x: −3 = 5, which is never true. Same slope with different constants means no solution.");
add("sys","At a bake sale, cookies cost $2 each and brownies cost $3 each. Maya sold 40 items for a total of $95. How many brownies did she sell?",["15","25","20","35"],
 "Let c + b = 40 and 2c + 3b = 95. Substitute c = 40 − b: 2(40 − b) + 3b = 95 → 80 + b = 95 → b = 15.");
add("sys","The system y = 2x + 1 and y = −x + 10 has solution (x, y). What is y?",["7","3","10","4"],
 "Set them equal: 2x + 1 = −x + 10 → 3x = 9 → x = 3. Then y = 2(3) + 1 = 7.");
add("sys","For what value of k does the system 3x + 2y = 7 and 6x + ky = 10 have no solution?",["4","2","−4","6"],
 "No solution means parallel lines: the coefficients are proportional but the constants aren’t. 6/3 = 2, so k = 2·2 = 4. The constants 10/7 ≠ 2, so the lines are parallel but different.");
add("sys","If x + y = 12 and x − y = 4, what is the value of xy?",["32","48","12","16"],
 "Add the equations: 2x = 16 → x = 8, so y = 4. Then xy = 32.");
add("sys","How many solutions does the system y = x² and y = 2x + 3 have?",["2","0","1","Infinitely many"],
 "Set equal: x² = 2x + 3 → x² − 2x − 3 = 0 → (x − 3)(x + 1) = 0. Two x-values, so two intersection points.");
add("quad","What are the solutions of x² − 5x − 14 = 0?",["x = 7 and x = −2","x = −7 and x = 2","x = 7 and x = 2","x = −7 and x = −2"],
 "Find two numbers that multiply to −14 and add to −5: −7 and 2. So (x − 7)(x + 2) = 0 → x = 7 or x = −2.");
add("quad","What is the minimum value of f(x) = (x − 3)² + 5?",["5","3","−3","−5"],
 "In vertex form a(x − h)² + k with a > 0, the minimum value is k. Here the vertex is (3, 5), so the minimum is 5.");
add("quad","How many real solutions does 2x² + 3x + 5 = 0 have?",["Zero","One","Two","Infinitely many"],
 "Discriminant: b² − 4ac = 9 − 40 = −31. A negative discriminant means no real solutions.");
add("quad","What is the vertex of the parabola y = x² − 6x + 11?",["(3, 2)","(−3, 2)","(3, 11)","(6, 11)"],
 "x = −b/(2a) = 6/2 = 3. Then y = 9 − 18 + 11 = 2. Vertex: (3, 2).");
add("quad","A ball’s height, in feet, t seconds after it is kicked is h(t) = −16t² + 64t. After how many seconds does it hit the ground?",["4","2","8","16"],
 "Set h = 0: −16t(t − 4) = 0 → t = 0 (the kick) or t = 4. It lands at t = 4. (t = 2 is when it reaches its highest point.)");
add("quad","If x² + kx + 25 is a perfect square trinomial and k > 0, what is k?",["10","5","25","50"],
 "(x + 5)² = x² + 10x + 25, so k = 2·5 = 10.");
add("quad","What is the sum of the solutions of 3x² − 12x + 7 = 0?",["4","−4","7/3","12"],
 "For ax² + bx + c = 0, the sum of the roots is −b/a = 12/3 = 4.");
add("func","If f(x) = 2x² − 3x, what is f(−2)?",["14","2","−2","−14"],
 "f(−2) = 2(4) − 3(−2) = 8 + 6 = 14. Square first, and watch the negative signs.");
add("func","If f(x) = x + 4 and g(x) = 3x, what is f(g(2))?",["10","18","6","12"],
 "Work from the inside out: g(2) = 6, then f(6) = 10. (18 is g(f(2)), the other order.)");
add("func","The graph of y = f(x) is shifted 3 units right and 2 units up. Which equation describes the new graph?",["y = f(x − 3) + 2","y = f(x + 3) + 2","y = f(x − 2) + 3","y = f(x + 3) − 2"],
 "A shift right by h replaces x with (x − h). A shift up by k adds k outside. So y = f(x − 3) + 2.");
add("func","What is the average rate of change of f(x) = x² from x = 1 to x = 4?",["5","15","3","8"],
 "(f(4) − f(1))/(4 − 1) = (16 − 1)/3 = 15/3 = 5.");
add("func","If f(x) = 3x − 5, what is the value of f⁻¹(7)?",["4","16","2","12"],
 "f⁻¹(7) is the input that gives an output of 7: 3x − 5 = 7 → x = 4. (16 is f(7).)");
add("func","The function f is defined by f(x) = |x − 4|. For how many values of x does f(x) = 3?",["2","1","0","3"],
 "|x − 4| = 3 means x − 4 = 3 or x − 4 = −3, so x = 7 or x = 1. That is two values.");
add("expo","A town of 20,000 people grows by 3% each year. Which expression gives the population after t years?",["20,000(1.03)ᵗ","20,000(0.03)ᵗ","20,000(1.3)ᵗ","20,000 + 0.03t"],
 "Growth of r% per year multiplies by (1 + r) each year: 1 + 0.03 = 1.03. So P = 20,000(1.03)ᵗ.");
add("expo","A car worth $30,000 loses 15% of its value each year. What is it worth after 2 years?",["$21,675","$21,000","$25,500","$22,500"],
 "Each year it keeps 85%: 30,000 × 0.85² = 30,000 × 0.7225 = $21,675. ($21,000 wrongly subtracts 15% of the original twice.)");
add("expo","What is the value of 8^(2/3)?",["4","2","16","12"],
 "8^(2/3) = (∛8)² = 2² = 4.");
add("expo","Which expression is equivalent to (x³y²)⁴ ÷ (x²y)³?",["x⁶y⁵","x⁹y⁵","xy⁵","x⁶y⁶"],
 "(x³y²)⁴ = x¹²y⁸ and (x²y)³ = x⁶y³. Dividing subtracts exponents: x¹²⁻⁶y⁸⁻³ = x⁶y⁵.");
add("expo","A bacteria population doubles every 5 hours. If it starts at 300, how many bacteria are there after 20 hours?",["4,800","2,400","1,200","12,000"],
 "20 hours is 4 doubling periods: 300 × 2⁴ = 300 × 16 = 4,800.");
add("expo","If 3^(x + 1) = 81, what is x?",["3","4","27","2"],
 "81 = 3⁴, so x + 1 = 4 and x = 3.");
add("poly","What is the remainder when p(x) = x³ − 2x² + 4x − 5 is divided by x − 2?",["3","−5","11","0"],
 "Remainder theorem: the remainder is p(2) = 8 − 8 + 8 − 5 = 3.");
add("poly","Which expression is equivalent to (2x − 3)(x² + x − 4)?",["2x³ − x² − 11x + 12","2x³ + 5x² − 5x + 12","2x³ − x² − 5x − 12","2x³ + x² − 11x + 12"],
 "2x(x² + x − 4) = 2x³ + 2x² − 8x and −3(x² + x − 4) = −3x² − 3x + 12. Combine: 2x³ − x² − 11x + 12.");
add("poly","If (x + 4) is a factor of x² + kx − 12, what is k?",["1","−1","4","−4"],
 "If (x + 4) is a factor, then x = −4 is a zero: 16 − 4k − 12 = 0 → 4 = 4k → k = 1. Check: (x + 4)(x − 3) = x² + x − 12. ✓");
add("poly","What are the zeros of f(x) = x(x − 5)(2x + 3)?",["0, 5, and −3/2","0, −5, and 3/2","5 and −3/2 only","0, 5, and −3"],
 "Set each factor to 0: x = 0, x − 5 = 0 → x = 5, and 2x + 3 = 0 → x = −3/2.");
add("poly","Which expression is equivalent to 9x² − 49?",["(3x + 7)(3x − 7)","(3x − 7)²","(9x + 7)(x − 7)","(3x + 49)(3x − 1)"],
 "This is a difference of squares: (3x)² − 7² = (3x + 7)(3x − 7).");
add("poly","For x ≠ −2 and x ≠ −3, which expression is equivalent to (x² − 9)/(x² + 5x + 6)?",["(x − 3)/(x + 2)","(x + 3)/(x + 2)","(x − 3)/(x − 2)","−9/(5x + 6)"],
 "Factor: (x − 3)(x + 3) / ((x + 2)(x + 3)). Cancel (x + 3): (x − 3)/(x + 2). You can only cancel factors, never individual terms.");
add("pct","A jacket costs $80. It is discounted 25%, and then 8% sales tax is added to the sale price. What is the final price?",["$64.80","$66.40","$60.00","$86.40"],
 "Sale price: 80 × 0.75 = $60. With tax: 60 × 1.08 = $64.80.");
add("pct","The ratio of boys to girls in a club is 3 : 5. If the club has 40 members, how many are girls?",["25","15","24","8"],
 "There are 3 + 5 = 8 parts, so each part is 40/8 = 5 members. Girls: 5 × 5 = 25.");
add("pct","A price increased from $50 to $65. By what percent did it increase?",["30%","15%","23%","65%"],
 "Percent change = (65 − 50)/50 = 15/50 = 0.30 = 30%. Always divide by the ORIGINAL value.");
add("pct","If 40% of a number is 18, what is 75% of the number?",["33.75","30","13.5","24"],
 "0.4n = 18 → n = 45. Then 0.75 × 45 = 33.75.");
add("pct","A map uses a scale of 1 inch : 12 miles. Two towns are 4.5 inches apart on the map. How many miles apart are they?",["54","48","16.5","60"],
 "4.5 × 12 = 54 miles.");
add("pct","A recipe uses 3 cups of flour for every 2 cups of sugar. How many cups of flour are needed with 5 cups of sugar?",["7.5","6","10","8"],
 "Set up the proportion 3/2 = f/5 → f = 15/2 = 7.5 cups.");
add("stat","The mean of five numbers is 12. When a sixth number is added, the mean becomes 13. What is the sixth number?",["18","13","1","15"],
 "The original sum is 5 × 12 = 60 and the new sum is 6 × 13 = 78. The new number is 78 − 60 = 18.");
add("stat","What is the median of the data set 4, 7, 7, 9, 12, 15?",["8","7","9","10.5"],
 "There are six values, so the median is the mean of the 3rd and 4th: (7 + 9)/2 = 8. (9 is the mean of the set.)");
add("stat","In the data set 3, 5, 8, 10, 40, the value 40 is replaced with 100. Which statistic does NOT change?",["The median","The mean","The range","The standard deviation"],
 "The middle value is still 8, so the median doesn’t change. The mean, range, and spread all grow because the largest value grew.");
add("stat","Two classes took the same test. Class A’s scores had a standard deviation of 4 points, and Class B’s had a standard deviation of 11 points. Which statement must be true?",
 ["Class B’s scores were more spread out than Class A’s.","Class B had a higher average score.","Class A’s scores were more spread out than Class B’s.","Class A had more students than Class B."],
 "Standard deviation measures spread, not center. A larger standard deviation means the scores are more spread out. It says nothing about averages or class size.");
add("stat","A researcher randomly selects 500 adults in a city and finds that 62% of them support building a new park. Which conclusion is most appropriate?",
 ["About 62% of all adults in the city likely support the park, with some margin of error.","Exactly 62% of all adults in the country support the park.","Exactly 310 adults in the city support the park.","The park will definitely be built."],
 "A random sample can be generalized to the population it was drawn from (the city, not the country), but only approximately, with a margin of error.");
add("prob","A bag has 4 red, 6 blue, and 5 green marbles. One marble is chosen at random. What is the probability that it is NOT blue?",["3/5","2/5","1/3","4/15"],
 "There are 15 marbles and 9 are not blue: 9/15 = 3/5. (Or: 1 − 6/15 = 9/15.)");
add("prob","A fair coin is flipped three times. What is the probability of getting exactly two heads?",["3/8","1/4","1/2","1/8"],
 "There are 2³ = 8 equally likely outcomes. Exactly two heads: HHT, HTH, THH, which is 3 outcomes. 3/8.");
add("prob","Two fair six-sided dice are rolled. What is the probability that the sum is 7?",["1/6","1/12","7/36","1/36"],
 "Pairs that sum to 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1), which is 6 of 36. 6/36 = 1/6.");
add("prob","Of 200 students surveyed, 120 play a sport. Of those 120, 45 also play an instrument. Of the students who do not play a sport, 35 play an instrument. If a student who plays an instrument is chosen at random, what is the probability that the student plays a sport?",["9/16","3/8","7/16","9/40"],
 "“Given that the student plays an instrument” means the total is only the instrument players: 45 + 35 = 80. Of those, 45 play a sport: 45/80 = 9/16.");
add("prob","A spinner has 8 equal sections numbered 1 through 8. What is the probability of spinning a number greater than 5 on two spins in a row?",["9/64","3/8","3/4","1/64"],
 "P(>5) = 3/8 (6, 7, or 8). The spins are independent, so multiply: (3/8)(3/8) = 9/64.");
add("geo","What are the center and radius of the circle (x − 2)² + (y + 5)² = 49?",["Center (2, −5), radius 7","Center (−2, 5), radius 7","Center (2, −5), radius 49","Center (−2, 5), radius 49"],
 "In (x − h)² + (y − k)² = r², the center is (h, k) and the radius is r. Here y + 5 = y − (−5), so the center is (2, −5), and r = √49 = 7.");
add("geo","The equation x² + y² − 6x + 4y = 12 represents a circle. What is its radius?",["5","12","√12","25"],
 "Complete the square: (x² − 6x + 9) + (y² + 4y + 4) = 12 + 9 + 4 → (x − 3)² + (y + 2)² = 25. Radius = 5.");
add("geo","Triangle ABC is similar to triangle DEF, with AB corresponding to DE and BC corresponding to EF. If AB = 6, DE = 15, and BC = 8, what is EF?",["20","17","3.2","12"],
 "The scale factor is 15/6 = 2.5, so EF = 8 × 2.5 = 20.");
add("geo","A cylinder has a radius of 3 and a height of 10. What is its volume?",["90π","30π","60π","9π"],
 "V = πr²h = π(9)(10) = 90π.");
add("geo","In a circle with radius 9, what is the length of an arc intercepted by a central angle of 120°?",["6π","3π","27π","12π"],
 "Arc length = (120/360) × 2π(9) = (1/3)(18π) = 6π.");
add("geo","Two angles are supplementary, and one is 4 times the other. What is the measure of the larger angle?",["144°","36°","72°","135°"],
 "x + 4x = 180 → x = 36. The larger angle is 4 × 36 = 144°.");
add("geo","What is the measure of each interior angle of a regular octagon?",["135°","120°","140°","1,080°"],
 "Sum of interior angles = (8 − 2) × 180 = 1,080°. Each of the 8 equal angles is 1,080/8 = 135°.");
add("trig","In right triangle ABC, angle C is the right angle, AC = 5, and BC = 12. What is sin A?",["12/13","5/13","5/12","12/5"],
 "Hypotenuse AB = √(25 + 144) = 13. Sine = opposite/hypotenuse. The side opposite angle A is BC = 12, so sin A = 12/13.");
add("trig","If sin x° = 0.6, what is the value of cos(90 − x)°?",["0.6","0.8","0.4","1.6"],
 "Cofunction identity: cos(90° − x) = sin x. So it equals 0.6.");
add("trig","How many degrees are in 3π/4 radians?",["135°","45°","270°","67.5°"],
 "Multiply by 180/π: (3π/4)(180/π) = 3 × 45 = 135°.");
add("trig","In a 30°-60°-90° triangle, the shortest side has length 7. What is the length of the hypotenuse?",["14","7√3","7√2","21"],
 "The sides are in the ratio x : x√3 : 2x, with the shortest side x opposite 30°. The hypotenuse is 2x = 14.");
add("trig","A 20-foot ladder leans against a wall, making a 60° angle with the ground. How high up the wall does the ladder reach?",["10√3 feet","10 feet","20√3 feet","10√2 feet"],
 "The height is opposite the 60° angle: 20 × sin 60° = 20(√3/2) = 10√3 feet.");
add("trig","If tan θ = 3/4 and θ is acute, what is cos θ?",["4/5","3/5","3/4","5/4"],
 "Opposite = 3 and adjacent = 4, so the hypotenuse is 5 (a 3-4-5 triangle). cos θ = adjacent/hypotenuse = 4/5.");
add("word","A train travels 240 miles in 4 hours and then 150 miles in 2 hours. What is its average speed for the whole trip?",["65 mph","62.5 mph","67.5 mph","75 mph"],
 "Average speed = total distance ÷ total time = 390/6 = 65 mph. Averaging the two speeds (60 and 75) gives 67.5, which is wrong because the trip spends more time at 60.");
add("word","Pipe A can fill a tank in 6 hours, and pipe B can fill it in 3 hours. Working together, how long do they take to fill the tank?",["2 hours","4.5 hours","9 hours","1.5 hours"],
 "Rates add: 1/6 + 1/3 = 1/6 + 2/6 = 1/2 tank per hour, so the job takes 2 hours.");
add("word","A phone plan costs $25 per month plus $0.10 per text. Kai’s bill one month was $38.50. How many texts did Kai send?",["135","385","13","150"],
 "25 + 0.10t = 38.50 → 0.10t = 13.50 → t = 135.");
add("word","Maria is 3 times as old as her brother. In 10 years, she will be twice as old as he will be. How old is Maria now?",["30","10","20","40"],
 "Let b be the brother’s age, so Maria is 3b. Then 3b + 10 = 2(b + 10) → 3b + 10 = 2b + 20 → b = 10. Maria is 30.");
add("word","A rectangle’s length is 4 more than its width, and its perimeter is 56. What is its area?",["192","160","208","224"],
 "2(w + w + 4) = 56 → 2w + 4 = 28 → w = 12, so the length is 16. Area = 12 × 16 = 192.");
add("word","A car travels at 72 kilometers per hour. What is its speed in meters per second?",["20","72","1,200","2"],
 "72 km/h = 72,000 m per 3,600 s = 20 m/s. (1,200 is meters per MINUTE.)");

           : mk("conc",STD,"less",["fewer","lesser","fewest"],"The noun is UNCOUNTABLE (you can’t say “one energy, two energies”), so use “less.” “Fewer” is only for countable nouns.",s.replace("___",BL));

reg("lin",()=>{
  const x0=nz(-8,8); let a,c; do{a=nz(-6,6);c=nz(-6,6);}while(a===c);
  const b=ri(-12,12), d=(a-c)*x0+b, op=pick(["<",">","≤","≥"]);
  const flip={"<":">",">":"<","≤":"≥","≥":"≤"}, neg=(a-c)<0, res=neg?flip[op]:op;
  return mk("lin",`Which inequality describes all solutions of ${poly([a,b])} ${op} ${poly([c,d])}?`,`x ${res} ${fmt(x0)}`,
    [`x ${flip[res]} ${fmt(x0)}`,`x ${res} ${fmt(-x0)}`,`x ${flip[res]} ${fmt(-x0)}`],
    `Move the x-terms to the left and the constants to the right: ${fmt(a-c)}x ${op} ${fmt(d-b)}. `+(neg?`Dividing by a NEGATIVE number (${fmt(a-c)}) flips the sign: x ${res} ${fmt(x0)}.`:`Divide by ${fmt(a-c)} (positive, so no flip): x ${res} ${fmt(x0)}.`));
});
reg("lin",()=>{
  const h=nz(-7,7), r=ri(1,9), a=pick([1,1,2,3]);
  const inside=a===1? `x ${h<0?"+ "+(-h):MN+" "+h}` : `${a}x ${h<0?"+ "+(-a*h):MN+" "+(a*h)}`;
  return mk("lin",`What is the sum of all solutions to |${inside}| = ${a*r}?`,fmt(2*h),[fmt(-2*h),fmt(h),fmt(2*r),fmt(a*r)],
    `Split into two cases: ${inside} = ${a*r} or ${inside} = ${MN}${a*r}. The solutions are x = ${fmt(h+r)} and x = ${fmt(h-r)}, and their sum is ${fmt(2*h)}.`);
});
reg("geo",()=>{
  const h=nz(-6,6), k=nz(-6,6), r=ri(2,9), D=-2*h, E=-2*k, F=h*h+k*k-r*r;
  const t=(c,v)=> c===0?"": (c<0?` ${MN} ${-c}${v}`:` + ${c}${v}`);
  const eq=`x² + y²${t(D,"x")}${t(E,"y")} = ${fmt(-F)}`;
  return mk("geo",`The equation ${eq} defines a circle in the xy-plane. What is the radius of the circle?`,fmt(r),[fmt(r*r),fmt(Math.abs(F)),fmt(r+1),fmt(2*r)],
    `Complete the square: (x² ${D<0?MN:"+"} ${Math.abs(D)}x + ${h*h}) + (y² ${E<0?MN:"+"} ${Math.abs(E)}y + ${k*k}) = ${fmt(-F)} + ${h*h} + ${k*k}, so (x ${h<0?"+ "+(-h):MN+" "+h})² + (y ${k<0?"+ "+(-k):MN+" "+k})² = ${r*r}. The radius is √${r*r} = ${r}.`);
});
reg("func",()=>{
  const m=nz(-5,5), b=ri(-9,9), p=nz(-4,4), q=ri(-6,6), a=ri(-4,4);
  const g=p*a+q, ans=m*g+b, other=p*(m*a+b)+q;
  return mk("func",`If f(x) = ${poly([m,b])} and g(x) = ${poly([p,q])}, what is f(g(${fmt(a)}))?`,fmt(ans),[fmt(other),fmt((m*a+b)*g),fmt(m*a+b+g),fmt(g)],
    `Work from the inside out. g(${fmt(a)}) = ${fmt(g)}. Then f(${fmt(g)}) = ${fmt(m)}·${paren(g)} ${b<0?MN+" "+(-b):"+ "+b} = ${fmt(ans)}. (Doing it in the other order, g(f(${fmt(a)})), gives ${fmt(other)}.)`);
});

function normalize(o){
  const d=DEF(); if(!o||typeof o!=="object") return d;
  for(const k of ["stats","days","cards"]) if(o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k])) d[k]=o[k];
  if(Array.isArray(o.missed)) d.missed=o.missed.filter(m=>m&&TOPICS[m.t]&&Array.isArray(m.c));

function dkey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function dayStreak(){ let n=0; const d=new Date(); if(!S.days[dkey(d)]) d.setDate(d.getDate()-1); while(S.days[dkey(d)]){ n++; d.setDate(d.getDate()-1); } return n; }

function rec(q,ok,fromReview,quiet){
  const st=S.stats[q.t]||(S.stats[q.t]={n:0,c:0}); st.n++; if(ok) st.c++;
  const d=today(); S.days[d]=(S.days[d]||0)+1;
  S.streak.cur= ok? S.streak.cur+1 : 0; S.streak.best=Math.max(S.streak.best,S.streak.cur);
  if(!ok) addMissed(q); else if(fromReview) removeMissed(q.id);

function prep(q){ const idx=shuffle([0,1,2,3].slice(0,q.c.length)); return Object.assign({},q,{c:idx.map(i=>q.c[i]),a:idx.indexOf(q.a)}); }
function wpick(keys,ws){ let s=ws.reduce((a,b)=>a+b,0), r=Math.random()*s; for(let i=0;i<keys.length;i++){ r-=ws[i]; if(r<=0) return keys[i]; } return keys[keys.length-1]; }
function smartTopic(){ const ks=Object.keys(TOPICS); return wpick(ks,ks.map(k=>{ const s=S.stats[k]; let w= !s||s.n<4? 2 : 1+4*(1-s.c/s.n); return TOPICS[k].s==="E"? w*1.4 : w; })); }
function topicFor(mode){
  if(mode.kind==="topic") return mode.topic;
  if(mode.kind==="E") return pick(ETOP);
  if(mode.kind==="M") return pick(MTOP);
  if(mode.kind==="smart") return smartTopic();
  return Math.random()<(S.settings.mixE/100)? pick(ETOP) : pick(MTOP);
}
function drawQuestion(mode,seen){
  const t=topicFor(mode);
  const bank=BANK.filter(q=>q.t===t), avail=bank.filter(q=>!seen.has(q.id)), gens=GEN[t]||[];
  let q;
  if(avail.length && (!gens.length || Math.random()<.5)) q=pick(avail);
  else if(gens.length){ try{ q=pick(gens)(); }catch(e){ q=null; } if(!q) q=pick(bank); }
  else { bank.forEach(b=>seen.delete(b.id)); q=pick(bank); }
  seen.add(q.id);
  return prep(q);
}

const PRAISE=["Correct!","Nice work!","Exactly right!","Nailed it!","Great job!","You got it!"];
function startPractice(kind,topic){
  clearAuto();
  sess={mode:{kind,topic},seen:new Set(),n:0,c:0,q:null,picked:null,answered:false,queue:null,praise:""};
  if(kind==="review"){ sess.queue=shuffle(S.missed.slice()); if(!sess.queue.length){ sess=null; go("review"); return; } }
  nextQ(); view= kind==="review"?"review":"practice"; renderNav(); render(); window.scrollTo(0,0);
}
function nextQ(){
  if(sess.mode.kind==="review"){ const q=sess.queue.shift(); sess.q=q? prep(Object.assign({},q,{c:q.c.slice()})) : null; }
  else sess.q=drawQuestion(sess.mode,sess.seen);
  sess.picked=null; sess.answered=false;
}
function modeLabel(m){ return m.kind==="topic"?TOPICS[m.topic].n : {E:"All English",M:"All Math",X:"Mixed",smart:"Smart Mix",review:"Review"}[m.kind]; }
function pAnswer(i){
  if(!sess||sess.answered) return; sess.picked=i; sess.answered=true; const ok=i===sess.q.a;
  sess.praise=pick(PRAISE); sess.n++; if(ok) sess.c++; rec(sess.q,ok,sess.mode.kind==="review"); beep(ok); renderNav(); render();
  const fb=document.querySelector(".fb"); if(fb&&fb.getBoundingClientRect().bottom>innerHeight) fb.scrollIntoView({behavior:S.settings.motion?"smooth":"auto",block:"nearest"});
  const last=sess.mode.kind==="review"&&!sess.queue.length;
  if(ok && S.settings.autoNext && !last){ clearAuto(); const s=sess; autoTimer=setTimeout(()=>{ autoTimer=null; if(sess===s&&sess.answered) pNext(); },S.settings.autoNext); }
}
function pNext(){ if(!sess) return; clearAuto(); nextQ(); render(); window.scrollTo({top:0,behavior:S.settings.motion?"smooth":"auto"}); }
function pSkip(){ if(!sess||sess.answered) return; nextQ(); render(); }
function endPractice(){ clearAuto(); const r=sess&&sess.mode.kind==="review"; sess=null; if(r) go("review"); else render(); window.scrollTo(0,0); }
function practiceScreen(){
  const q=sess.q, ok=sess.picked===q.a, rv=sess.mode.kind==="review", st=S.settings;

    ${sess.answered?`<div class="fb ${ok?"ok":"no"}"><div class="res">${ic(ok?"check":"x",18)} ${ok?sess.praise:"Not quite. The answer is "+"ABCD"[q.a]+"."}</div><div>${q.e}</div></div>

let testCfg={n:20,mix:"X"};
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function estSecs(n,mix){ const ne= mix==="E"?n : mix==="M"?0 : Math.round(n*S.settings.mixE/100); return Math.round((ne*71+(n-ne)*95)*(Number(S.settings.timeMult)||1)); }
function startTest(){
  const seen=new Set(), qs=[], n=testCfg.n;
  if(testCfg.mix==="X"){ const ne=Math.round(n*S.settings.mixE/100); for(let i=0;i<ne;i++) qs.push(drawQuestion({kind:"E"},seen)); for(let i=ne;i<n;i++) qs.push(drawQuestion({kind:"M"},seen)); }
  else for(let i=0;i<n;i++) qs.push(drawQuestion({kind:testCfg.mix},seen));
  const secs=Math.round(qs.reduce((s,q)=>s+(q.s==="E"?71:95),0)*(Number(S.settings.timeMult)||1));
  T={qs,ans:qs.map(()=>null),flag:qs.map(()=>false),idx:0,secs,end:Date.now()+secs*1000,start:Date.now(),done:false,mix:testCfg.mix};
  stopTimer(); timerId=setInterval(tick,500); render(); window.scrollTo(0,0);
}
function fmtTime(s){ s=Math.max(0,Math.ceil(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=String(s%60).padStart(2,"0"); return h?`${h}:${String(m).padStart(2,"0")}:${x}`:`${m}:${x}`; }
function tick(){ if(!T||T.done){ stopTimer(); return; } const left=(T.end-Date.now())/1000; const el=$("timerv");
  if(el&&S.settings.showTimer){ el.textContent=fmtTime(left); $("timer").classList.toggle("low",left<60); } if(left<=0) submitTest(true); }
function tAnswer(i){ if(!T||T.done) return; T.ans[T.idx]=i; render(); }
function tGo(i){ if(!T) return; T.idx=Math.max(0,Math.min(T.qs.length-1,i)); render(); }
function tFlag(){ if(!T||T.done) return; T.flag[T.idx]=!T.flag[T.idx]; render(); }
function submitTest(auto){
  if(!T||T.done) return;
  if(!auto){ const un=T.ans.filter(a=>a===null).length; if(un && !confirm(`You have ${un} unanswered question${un>1?"s":""}. Submit anyway?`)) return; }
  stopTimer(); T.done=true; T.used=Math.min(T.secs,Math.round((Date.now()-T.start)/1000));
  const before=S.days[today()]||0;
  T.qs.forEach((q,i)=>rec(q,T.ans[i]===q.a,false,true));
  const c=T.qs.filter((q,i)=>T.ans[i]===q.a).length;
  S.tests.push({d:today(),c,n:T.qs.length,mix:T.mix}); if(S.tests.length>50) S.tests.shift(); save();
  if(auto) toast("Time’s up! Your test was submitted.");
  if(before<goal() && (S.days[today()]||0)>=goal()) toast(`Daily goal reached: ${goal()} questions today!`,"good");
  renderNav(); render(); window.scrollTo(0,0);
}
const MIXN={X:"Mixed",E:"English",M:"Math"};
function rTest(){
  if(!T){
    const last=S.tests.slice(-6).reverse(), mt=Number(S.settings.timeMult)||1;
    app.innerHTML=`<div class="grid2" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)">
      <section class="panel"><h3>Set up your test</h3>
        <p class="muted mini" style="margin-top:-6px">About 71 seconds per Reading &amp; Writing question and 95 per Math question, the real SAT pacing. You can skip around, flag questions, and change answers until you submit.</p>
        <div class="h-sec" style="margin-top:18px">Length</div>
        <div class="opts">${[10,20,30,44].map(n=>`<button class="opt ${testCfg.n===n?"on":""}" onclick="testCfg.n=${n};rTest()"><b>${n}</b><span>questions · ${fmtTime(estSecs(n,testCfg.mix))}</span></button>`).join("")}</div>
        <div class="h-sec">Content</div>
        <div class="seg">${[["X",`Mixed (${S.settings.mixE}% English)`],["E","English only"],["M","Math only"]].map(([k,l])=>`<button class="${testCfg.mix===k?"on":""}" onclick="testCfg.mix='${k}';rTest()">${l}</button>`).join("")}</div>
        <div class="row between" style="margin-top:24px">
          <span class="muted mini">${ic("test",16)}</span>
          <span style="flex:1" class="mini">Time limit <b>${fmtTime(estSecs(testCfg.n,testCfg.mix))}</b>${mt!==1?` · includes ${mt}× extra time`:""} · <a href="#" onclick="go('settings');return false">timing options</a></span>
          <button class="btn pri lg" onclick="startTest()">Start test ${ic("arrow",18)}</button>
        </div>
      </section>
      <section class="panel"><h3>Recent tests</h3>
        ${last.length?last.map(t=>{ const p=Math.round(100*t.c/t.n); return `<div class="hist"><span><b>${t.c}/${t.n}</b> <span class="muted">· ${MIXN[t.mix]||"Mixed"} · ${t.d.slice(5)}</span></span><span style="width:90px"><div class="bar thin"><i class="${barCls(p)}" style="width:${p}%"></i></div></span><b style="width:42px;text-align:right">${p}%</b></div>`; }).join("")
          :`<p class="muted mini">No tests yet. Your scores will appear here.</p>`}
      </section></div>`;
    return;
  }
  if(!T.done){
    const q=T.qs[T.idx], left=(T.end-Date.now())/1000, answered=T.ans.filter(a=>a!==null).length, n=T.qs.length, st=S.settings;
    app.innerHTML=`<div class="qwrap">
      <div class="testbar"><div class="tb-l"><b>Question ${T.idx+1}</b> <span class="muted">of ${n} · ${answered} answered</span><div class="bar thin"><i style="width:${Math.round(100*answered/n)}%"></i></div></div>
        <div id="timer" class="timer ${st.showTimer&&left<60?"low":""}">${ic("test",20)}<span id="timerv">${st.showTimer?fmtTime(left):`<span class="muted mini">hidden</span>`}</span></div>
        <button class="btn pri sm" onclick="submitTest()">Submit</button></div>
      <div class="qnav">${T.qs.map((x,i)=>`<button class="${T.ans[i]!==null?"ans":""} ${i===T.idx?"cur":""} ${T.flag[i]?"fl":""}" onclick="tGo(${i})" aria-label="Question ${i+1}${T.flag[i]?", flagged":""}">${i+1}</button>`).join("")}</div>
      <article class="qcard"><div class="tags">${secTag(q)}<button class="btn ghost sm flagbtn ${T.flag[T.idx]?"on":""}" style="margin-left:auto" onclick="tFlag()">${ic("flag",14)} ${T.flag[T.idx]?"Flagged":"Flag for review"}</button></div>
      ${qBody(q)}${choicesHTML(q,T.ans[T.idx],false,"tAnswer")}
      <div class="actions"><button class="btn" onclick="tGo(${T.idx-1})" ${T.idx===0?"disabled":""}>${ic("back",16)} Previous</button>
      ${st.hints?`<span class="hint"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>F</kbd> flag</span>`:""}
      ${T.idx<n-1?`<button class="btn pri" onclick="tGo(${T.idx+1})">Next ${ic("arrow",16)}</button>`:`<button class="btn pri" onclick="submitTest()">Submit test</button>`}</div></article></div>`;
    return;
  }
  const c=T.qs.filter((q,i)=>T.ans[i]===q.a).length, n=T.qs.length, pct=Math.round(100*c/n);
  const part=s=>{ const idx=T.qs.map((q,i)=>i).filter(i=>T.qs[i].s===s); const k=idx.filter(i=>T.ans[i]===T.qs[i].a).length; return idx.length?`${k}/${idx.length}`:"—"; };
  const msg= pct>=90?"Outstanding!":pct>=75?"Strong work!":pct>=60?"Solid. Keep building.":"Every miss is something to learn. Review them below.";
  app.innerHTML=`<section class="panel"><div class="resgrid">
      ${ring(c/n,140,13,pct+"%",`${c} of ${n}`,pct>=80?"var(--good)":pct>=60?"var(--accent)":pct>=40?"var(--warn)":"var(--bad)")}
      <div style="flex:1;min-width:220px"><h2 style="font-size:1.5rem">${msg}</h2>
        <div class="row" style="gap:28px;margin-top:12px"><div class="stat"><b>${part("E")}</b><span>English</span></div><div class="stat"><b>${part("M")}</b><span>Math</span></div><div class="stat"><b>${fmtTime(T.used)}</b><span>of ${fmtTime(T.secs)} used</span></div></div>
        <div class="row" style="margin-top:18px"><button class="btn pri" onclick="T=null;startTest()">New test</button><button class="btn" onclick="T=null;rTest()">Change settings</button>${S.missed.length?`<button class="btn" onclick="T=null;go('review')">Review missed (${S.missed.length})</button>`:""}</div></div>
    </div></section>
    <section class="panel"><h3>Question by question</h3>
    ${T.qs.map((q,i)=>{ const a=T.ans[i], ok=a===q.a; return `<details class="rv"><summary><span class="dot ${a===null?"skip":ok?"":"no"}"></span>${i+1}. ${TOPICS[q.t].n} <span class="muted mini">· ${a===null?"skipped":ok?"correct":"incorrect"}${T.flag[i]?" · flagged":""}</span></summary>
      <div class="body">${qBody(q)}${choicesHTML(q,a,true,"void")}<div class="fb">${q.e}</div></div></details>`; }).join("")}</section>`;
}

  const by={}; S.missed.forEach(m=>{ by[m.t]=(by[m.t]||0)+1; }); const mx=Math.max(1,...Object.values(by));
  app.innerHTML= S.missed.length? `<div class="grid2">

/* =====================================================================
   FLASHCARDS
   ===================================================================== */
const FC={deck:"vocab",filter:"all",order:[],i:0};
function fcBuild(shuf){ const d=DECKS[FC.deck], m=S.cards[FC.deck]||{};
  const list=d.filter(c=> FC.filter==="all" || (FC.filter==="learn"&&m[c.id]==="learn") || (FC.filter==="notknown"&&m[c.id]!=="know"));
  FC.order=(shuf?shuffle(list):list).map(c=>c.id); FC.i=0; }
function fcSet(deck){ FC.deck=deck; FC.filter="all"; fcBuild(false); rCards(); }
function fcFilter(f){ FC.filter=f; fcBuild(false); rCards(); }
function fcFlip(){ const el=$("card3d"); if(el) el.classList.toggle("flipped"); }
function fcMove(d){ if(!FC.order.length) return; FC.i=(FC.i+d+FC.order.length)%FC.order.length; rCards(); }
function fcMark(v){ if(!FC.order.length) return; const id=FC.order[FC.i]; (S.cards[FC.deck]=S.cards[FC.deck]||{})[id]=v; save(); fcMove(1); }
function fcReset(){ if(confirm(`Reset “know it / still learning” marks for ${DECK_NAMES[FC.deck]}?`)){ S.cards[FC.deck]={}; save(); fcBuild(false); rCards(); } }
function rCards(){
  if(!FC.order.length && FC.filter==="all") fcBuild(false);
  const d=DECKS[FC.deck], m=S.cards[FC.deck]||{};
  const card=FC.order.length? d.find(c=>c.id===FC.order[FC.i]) : null; const st=card?m[card.id]:null;
  const stp=st?`<span class="pillst ${st}">${st==="know"?"Know it":"Still learning"}</span>`:"";
  app.innerHTML=`<div class="fcwrap">
    <div class="decks">${Object.keys(DECKS).map(k=>{ const mm=S.cards[k]||{}, kn=DECKS[k].filter(c=>mm[c.id]==="know").length;
      return `<button class="deck ${FC.deck===k?"on":""}" onclick="fcSet('${k}')"><b>${DECK_NAMES[k]}</b><small>${kn}/${DECKS[k].length} known</small><div class="bar thin"><i class="g" style="width:${Math.round(100*kn/DECKS[k].length)}%"></i></div></button>`; }).join("")}</div>
    <div class="row between"><div class="seg">${[["all","All"],["notknown","Not known yet"],["learn","Still learning"]].map(([k,l])=>`<button class="${FC.filter===k?"on":""}" onclick="fcFilter('${k}')">${l}</button>`).join("")}</div>
      <span class="row" style="gap:6px"><button class="btn sm ghost" onclick="fcBuild(true);rCards()">${ic("shuffle",15)} Shuffle</button><button class="btn sm ghost" onclick="fcReset()">Reset</button></span></div>
    ${card?`<div class="card3d" id="card3d" tabindex="0" onclick="fcFlip()" role="button" aria-label="Flip card">
      <div class="inner"><div class="face front"><span class="lbl">${DECK_NAMES[FC.deck]} · ${FC.i+1}/${FC.order.length}</span><span class="st">${stp}</span>${card.front}<div class="fliphint">${S.settings.hints?"Tap or press Space to flip":"Tap to flip"}</div></div>
      <div class="face back"><span class="lbl">Answer</span><span class="st">${stp}</span>${card.back}</div></div></div>
      <div class="fcctl"><button class="btn" onclick="fcMove(-1)" aria-label="Previous card">${ic("back",16)}</button><button class="btn bad" onclick="fcMark('learn')">Still learning${S.settings.hints?" <kbd>L</kbd>":""}</button><button class="btn good" onclick="fcMark('know')">Know it${S.settings.hints?" <kbd>K</kbd>":""}</button><button class="btn" onclick="fcMove(1)" aria-label="Next card">${ic("arrow",16)}</button></div>`
    :`<section class="panel" style="text-align:center;margin-top:16px"><p class="muted">${FC.filter==="learn"?"No cards marked “still learning” yet. Mark cards as you study to build a focused pile.":"You know every card in this deck. Nice work!"}</p><button class="btn" onclick="fcFilter('all')">Show all cards</button></section>`}
  </div>`;
}

  </section>

  <section class="panel wide"><h3>Account &amp; data</h3>
    ${setRow("Stay signed in","Skip the profile screen when you open Prep Lab on this device.",`<button class="sw ${remembered?"on":""}" role="switch" aria-checked="${remembered}" aria-label="Stay signed in" onclick="setRemember(${!remembered})"><i></i></button>`)}
    ${setRow("Back up progress","Download your progress as a file, or restore it from one.",`<div class="row"><button class="btn sm" onclick="exportData()">${ic("download",15)} Download</button><label class="btn sm" style="cursor:pointer">${ic("upload",15)} Restore<input type="file" accept=".json,application/json" hidden onchange="importData(this)"></label></div>`,true)}
    ${setRow("Switch profile","Sign out to let someone else use Prep Lab on this device.",`<button class="btn sm" onclick="signOut()">${ic("users",15)} Switch / sign out</button>`,true)}
    ${setRow("Reset progress","Erase answers, streaks, missed questions, and flashcard marks. Keeps your profile and settings.",`<button class="btn sm bad" onclick="resetProgress()">Reset progress</button>`,true)}
    ${setRow("Delete profile","Permanently remove this profile from this device.",`<button class="btn sm bad" onclick="deleteProfile()">${ic("trash",15)} Delete</button>`,true)}
    <p class="muted mini" style="margin-top:10px">Everything is stored only in this browser. Clearing your browser data will erase it, so download a backup now and then.</p>
  </section></div>`;
}
function resetProgress(){
  if(!confirm("Erase ALL progress, missed questions, and flashcard marks for this profile? This cannot be undone.")) return;
  const keep={profile:S.profile,settings:S.settings}; S=DEF(); S.profile=keep.profile; S.settings=keep.settings; save(); sess=null; T=null; renderNav(); rSettings(); toast("Progress reset");
}
function exportData(){
  try{
    const blob=new Blob([JSON.stringify({app:"prepLab",v:2,exported:new Date().toISOString(),data:S})],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="prep-lab-"+(String(S.profile.name).replace(/[^a-z0-9]+/gi,"-").toLowerCase()||"profile")+"-"+today()+".json";
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
    toast("Backup downloaded","good");
  }catch(e){ toast("Couldn’t create the backup file","bad"); }
}
function importData(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ const o=parse(rd.result), d=o&&o.data?o.data:o;
    if(!d||typeof d!=="object"||!d.stats){ toast("That file isn’t a Prep Lab backup","bad"); return; }
    if(!confirm("Replace this profile’s progress with the backup?")) return;
    const prof=S.profile; S=normalize(d); S.profile=prof; save(); applySettings(); renderNav(); rSettings(); toast("Backup restored","good"); };
  rd.onerror=()=>toast("Couldn’t read that file","bad");
  rd.readAsText(f); inp.value="";
}

/* =====================================================================
   KEYBOARD + INIT
   ===================================================================== */
document.addEventListener("keydown",e=>{
  if(!UID || e.metaKey||e.ctrlKey||e.altKey) return;
  const tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea"||tag==="select") return;
  const k=e.key.toLowerCase(); const idx="1234".indexOf(k)>=0?"1234".indexOf(k):"abcd".indexOf(k);
  if((view==="practice"||view==="review") && sess && sess.q){
    if(!sess.answered && idx>=0 && idx<sess.q.c.length){ e.preventDefault(); pAnswer(idx); }
    else if(!sess.answered && k==="s" && sess.mode.kind!=="review"){ e.preventDefault(); pSkip(); }
    else if(sess.answered && k==="enter"){ e.preventDefault(); if(sess.mode.kind==="review"&&!sess.queue.length) endPractice(); else pNext(); }
  } else if(view==="test" && T && !T.done){
    if(idx>=0 && idx<T.qs[T.idx].c.length){ e.preventDefault(); tAnswer(idx); }
    else if(k==="arrowright"){ tGo(T.idx+1); } else if(k==="arrowleft"){ tGo(T.idx-1); }
    else if(k==="f"){ tFlag(); }
  } else if(view==="cards"){
    if(k===" "||(k==="enter"&&e.target.tagName!=="BUTTON")){ e.preventDefault(); fcFlip(); }
    else if(k==="arrowright") fcMove(1); else if(k==="arrowleft") fcMove(-1);
    else if(k==="k") fcMark("know"); else if(k==="l") fcMark("learn");
  }
});
(function init(){
  const id=P.current||ssGet(SKEY);
  if(id && P.list.some(p=>p.id===id)){ UID=id; S=loadUser(id); if(!S.profile.name){ const p=P.list.find(x=>x.id===id); S.profile.name=p.name; } enterApp(); }
  else { applySettings(); showAuth(P.list.length?"pick":"signup"); }
})();
</script>
