/* data: mean / median of a list */
dzReg("data",()=>{
  const ctx=pick([["minutes 9 students spent on homework",9,10,60],["points scored in 8 basketball games",8,40,95],["daily high temperatures (°F) over 7 days",7,45,90],["pages read by 9 book-club members",9,20,80]]);
  const L=Array.from({length:ctx[1]},()=>ri(ctx[2],ctx[3])), ask=pick(["mean","median"]);
  if(ask==="mean"){ const r=L.reduce((a,b)=>a+b,0)%L.length; if(r) L[L.length-1]+=L.length-r; }
  const sum=L.reduce((a,b)=>a+b,0), mean=sum/L.length, srt=L.slice().sort((a,b)=>a-b), mid=L.length>>1, med=L.length%2?srt[mid]:(srt[mid-1]+srt[mid])/2;
  const ans=ask==="mean"?mean:med, other=ask==="mean"?med:mean;
  const steps=dzSteps([`Type the list with square brackets: ${dzc(`L=[${L.join(",")}]`)}`,`On a new line type ${dzc(ask+"(L)")}`,`Desmos shows <b>${dec(ans)}</b>.`,`Other handy list commands: ${dzc("median(L)")}, ${dzc("mean(L)")}, ${dzc("stdev(L)")}, ${dzc("max(L)-min(L)")} (the range).`]);
  const opts=[fmt(other),fmt(ans+1),fmt(srt[srt.length-1]-srt[0])].filter(s=>s!==fmt(ans));
  return dzFin(mk("stat",`The list shows the ${ctx[0]}. What is the ${ask} of the data?`,fmt(ans),opts,
    ask==="mean"?`<b>By hand:</b> add them (${sum}) and divide by ${L.length}: ${fmt(mean)}.`:`<b>By hand:</b> sort them (${srt.join(", ")}) and take the middle${L.length%2?" value":" two and average them"}: ${fmt(med)}.`,
    `<div class="eqs">${L.join(", ")}</div>`),steps);
});
/* data: system of inequalities */
dzReg("data",()=>{
  for(let tries=0;tries<60;tries++){
    const a1=nz(-3,3), b1=ri(-4,5); let a2; do{ a2=nz(-3,3); }while(a2===a1); const b2=ri(-6,2);
    const good=[], bad=[];
    for(let i=0;i<40;i++){ const x=ri(-6,6), y=ri(-8,8), u=a1*x+b1, l=a2*x+b2; if(y===u||y===l) continue;
      if(y<u&&y>l) good.push([x,y]); else bad.push([x,y]); }
    if(!good.length||bad.length<3) continue;
    const P=p=>`(${fmt(p[0])}, ${fmt(p[1])})`, g=pick(good), bs=shuffle(bad).filter((p,i,a)=>a.findIndex(z=>z[0]===p[0]&&z[1]===p[1])===i).slice(0,3);
    if(bs.length<3) continue;
    const steps=dzSteps([`Type ${dzc("y<"+aPoly([a1,b1]))} and ${dzc("y>"+aPoly([a2,b2]))}. Desmos shades each one.`,`The darker area where both shadings overlap holds every solution.`,
      `Type each answer choice as a point, for example ${dzc(`(${g[0]},${g[1]})`)}.`,`Only <b>${P(g)}</b> lands inside the overlap.`]);
    return dzFin(mk("lin",`Which point (x, y) is a solution to the system of inequalities above?`,P(g),bs.map(P),
      `<b>By hand:</b> test each point in both inequalities. For ${P(g)}: ${fmt(g[1])} < ${fmt(a1*g[0]+b1)} ✓ and ${fmt(g[1])} > ${fmt(a2*g[0]+b2)} ✓. Each other point breaks at least one inequality.`,
      `<div class="eqs">y &lt; ${poly([a1,b1])}<br>y &gt; ${poly([a2,b2])}</div>`),steps);
  }
  return DZG[0].f();
});
/* functions: composition */

  const f=x=>a*x*x+b, g=x=>c*x+d, ans=ord==="fg"?f(g(n)):g(f(n)), alt=ord==="fg"?g(f(n)):f(g(n)), call=ord==="fg"?`f(g(${n}))`:`g(f(${n}))`;
  const steps=dzSteps([`Type ${dzc("f(x)="+aPoly([a,0,b]))}`,`Type ${dzc("g(x)="+aPoly([c,d]))}`,`Type ${dzc(call)}`,`Desmos shows <b>${fmt(ans)}</b>.`]);
  return dzFin(mk("func",`The functions f and g are defined above. What is the value of ${call.replace(/-/g,MN)}?`,fmt(ans),[fmt(alt),fmt(f(n)+g(n)),fmt(-ans)],

function calcEnsure(){
  if(CALC.made) return; CALC.made=true;
  const d=document.createElement("div"); d.id="calc"; d.className="calc"; d.hidden=true; d.setAttribute("role","dialog"); d.setAttribute("aria-label","Desmos graphing calculator");
  d.innerHTML=`<div class="calchd"><span class="ti math">${ic("desmos",16)}</span><div class="ct"><b>Desmos</b><small>College Board version, same as on test day</small></div>
    <button class="iconbtn sm" onclick="calcReset()" title="Start a blank graph" aria-label="Start a blank graph">${ic("review",17)}</button>
    <button class="iconbtn sm onlysm" onclick="calcFull()" title="Bigger" aria-label="Make the calculator bigger">${ic("expand",17)}</button>
    <a class="iconbtn sm" href="${DESMOS_URL}" target="_blank" rel="noopener" title="Open in a new tab" aria-label="Open Desmos in a new tab">${ic("ext",17)}</a>
    <button class="iconbtn sm" onclick="calcClose(true)" title="Close" aria-label="Close the calculator">${ic("x",17)}</button></div>
    <div class="calcbody"><p class="calcmsg muted mini">Loading Desmos… it needs an internet connection. If it doesn’t appear, <a href="${DESMOS_URL}" target="_blank" rel="noopener">open it in a new tab</a>.</p><iframe id="calcframe" title="Desmos graphing calculator" src="${DESMOS_URL}" allow="clipboard-read; clipboard-write"></iframe></div>`;
  document.body.appendChild(d);
}
function calcOpen(){ calcEnsure(); CALC.open=true; CALC.closedByUser=false; $("calc").hidden=false; document.body.classList.add("calc-on"); calcSync(); if(view==="desmos") rDesmos(); }
function calcClose(user){ CALC.open=false; if(user) CALC.closedByUser=true; const c=$("calc"); if(c){ c.hidden=true; c.classList.remove("full"); } CALC.full=false; document.body.classList.remove("calc-on"); calcSync(); if(user&&view==="desmos") rDesmos(); }
function calcReset(){ const f=$("calcframe"); if(f&&confirm("Clear the calculator and start a blank graph?")) f.src=DESMOS_URL; }
function calcFull(){ CALC.full=!CALC.full; const c=$("calc"); if(c) c.classList.toggle("full",CALC.full); }
function calcWanted(){
  if(!UID) return false;
  if(view==="desmos") return true;
  if(view==="practice"&&sess&&sess.q) return sess.q.s==="M";
  if(view==="review"&&sess&&sess.q) return sess.q.s==="M";
  if(view==="test"&&T&&!T.done) return T.qs[T.idx].s==="M";
  if(view==="full"&&FT&&FT.phase==="q") return FT.mods[FT.cur].s==="M";
  return false;
}
function calcSync(){
  let fab=$("calcfab");
  if(!fab){ fab=document.createElement("button"); fab.id="calcfab"; fab.className="calcfab"; fab.hidden=true; fab.onclick=()=>calcOpen(); fab.innerHTML=`${ic("desmos",19)}<span>Desmos</span>`; fab.setAttribute("aria-label","Open the Desmos calculator"); document.body.appendChild(fab); }
  const want=calcWanted();
  if(!want&&CALC.open) calcClose(false);
  fab.hidden=!want||CALC.open;
}

  ["Tables and regression","Click + and choose table. Enter points in x₁ and y₁. Then type y₁ ~ mx₁ + b (the ~ key is next to 1 on most keyboards, and _ makes a subscript) to get the best-fit line. Use ax₁² + bx₁ + c for a parabola.",["y_1~mx_1+b","y_1~ax_1^2+bx_1+c"],"data"],
  ["Functions","Define a function once, then evaluate it anywhere: f(4), f(g(2)), or f(x+1).",["f(x)=x^2-3","g(x)=2x+1","f(g(2))"],"fg"],
  ["Lists and statistics","Put data in square brackets and name it. Then use mean, median, stdev, max, and min.",["L=[12,15,15,18,22,40]","mean(L)","median(L)"],"data"],
  ["Inequalities","Type an inequality to shade it. The overlap of two shadings is the solution set. Type the answer choices as points to see which one lands inside.",["y<2x+1","y>-x-4","(1,0)"],"data"],
  ["Circles","Type the circle’s equation as written, even the messy expanded form. Read the center and radius off the grid, then check by typing the neat (x − h)² + (y − k)² = r² form on top.",["x^2+y^2-6x+4y-12=0","(x-3)^2+(y+2)^2=25"],"fg"],
  ["Zoom and settings","Pinch or scroll to zoom. The + and − buttons zoom in and out, the house resets the view, and the wrench (Graph Settings) lets you type an exact x- and y-range when a crossing point is off screen.",[],null],
  ["When NOT to use Desmos","Quick arithmetic, rearranging a formula, or questions that ask for an expression (like “which is equivalent to…”) are often faster by hand. Use Desmos when you need a number from a graph, a crossing point, or a count of solutions.",[],null]

function rDesmos(){
  if(innerWidth>=1100&&!CALC.open&&!CALC.closedByUser) calcOpen();
  if(DZ.mode==="practice"&&!DZ.q) dzNext();
  const z=S.dz||{n:0,c:0,h:0}, tabs=[["practice","Practice"],["guide","Skills guide"],["calc","Just the calculator"]];
  const head=`<div class="dzhead"><div class="seg">${tabs.map(([k,l])=>`<button class="${DZ.mode===k?"on":""}" onclick="dzMode('${k}')">${l}</button>`).join("")}</div>
    ${CALC.open?"":`<button class="btn sm" onclick="calcOpen()">${ic("desmos",16)} Open Desmos</button>`}</div>`;
  if(DZ.mode==="guide"){
    app.innerHTML=head+`<section class="panel dzintro"><p>The digital SAT has Desmos built in for <b>every</b> Math question. Students who know these moves solve many questions in seconds. Open the calculator, copy an example, and paste it in (or type it, which is better practice).</p></section>
    <div class="lessons">${DZ_LESSONS.map(([t,b,ex,g],i)=>`<section class="panel lesson"><div class="ln">${i+1}</div><div><h3>${t}</h3><p>${b}</p>
      ${ex.length?`<div class="exs">${ex.map(s=>`<span class="ex">${dzc(s)}<button class="btn ghost sm" onclick="dzCopy(this,'${s.replace(/'/g,"\\'")}')" aria-label="Copy ${esc(s)}">${ic("copy",14)}</button></span>`).join("")}</div>`:""}
      ${g?`<button class="btn sm" style="margin-top:10px" onclick="DZ.mode='practice';dzGroup('${g}')">Practice this ${ic("arrow",14)}</button>`:""}</div></section>`).join("")}</div>`;
    return;
  }
  if(DZ.mode==="calc"){
    app.innerHTML=head+`<section class="panel dzintro"><h3>Free play</h3><p>${CALC.open?"The calculator is open. Try anything!":"Open the calculator to try anything."} This is the same College Board version of Desmos you’ll see on test day, so the buttons and menus will look familiar.</p>
      <p class="muted mini">Nothing you type here is saved. The calculator keeps your work while you move around Prep Lab, until you reload the page.</p>
      ${CALC.open?"":`<button class="btn pri" onclick="calcOpen()">${ic("desmos",16)} Open Desmos</button>`}</section>`;
    return;
  }
  const q=DZ.q, ok=DZ.picked===q.a;
  app.innerHTML=head+`<div class="dzfilters">${DZ_GROUPS.map(([k,l])=>`<button class="chipbtn ${DZ.grp===k?"on":""}" onclick="dzGroup('${k}')">${l}</button>`).join("")}</div>
  <div class="qwrap"><article class="qcard">
    <div class="tags">${secTag(q)}<span class="tag dz">${ic("desmos",13)} Desmos</span><span class="qnum">${z.n?`${z.c}/${z.n} correct`:""}</span></div>
    ${qBody(q)}${choicesHTML(q,DZ.picked,DZ.answered,"dzAns")}
    ${DZ.answered?`<div class="fb ${ok?"ok":"no"}"><div class="res">${ic(ok?"check":"x",18)} ${ok?pick(PRAISE):"Not quite. The answer is "+"ABCD"[q.a]+"."}</div><div>${q.e}</div></div>
      <div class="actions"><span class="muted mini">${ok?"":"Saved to your Review list."}</span><button class="btn pri" onclick="dzGo()">Next question ${ic("arrow",16)}</button></div>`
    : `${DZ.hint?`<div class="dzhint"><b>${ic("desmos",15)} What to type</b>${q.dz}</div>`:""}
      <div class="actions"><span class="hint">${S.settings.hints?`<kbd>1</kbd>–<kbd>4</kbd> answer · <kbd>H</kbd> hint`:""}</span><span class="row">${DZ.hint?"":`<button class="btn sm" onclick="dzHint()">${ic("bolt",14)} Show Desmos steps</button>`}<button class="btn ghost sm" onclick="dzGo()">Skip ${ic("skip",14)}</button></span></div>`}
  </article></div>
  <p class="muted mini dzfoot">Try each one in Desmos first. If you get stuck, tap “Show Desmos steps” for exactly what to type. Every question also shows how to do it by hand.</p>`;
}

/* =====================================================================
   KEYBOARD + INIT
   ===================================================================== */
document.addEventListener("keydown",e=>{
  if(!UID || e.metaKey||e.ctrlKey||e.altKey) return;
  const tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea"||tag==="select") return;
  const k=e.key.toLowerCase(); const idx="1234".indexOf(k)>=0?"1234".indexOf(k):"abcd".indexOf(k);
  if((view==="practice"||view==="review") && sess && sess.q){
    if(!sess.answered && idx>=0 && idx<sess.q.c.length){ e.preventDefault(); pAnswer(idx); }
    else if(!sess.answered && k==="s" && sess.mode.kind!=="review"){ e.preventDefault(); pSkip(); }
    else if(sess.answered && k==="enter"){ e.preventDefault(); if(sess.mode.kind==="review"&&!sess.queue.length) endPractice(); else pNext(); }
  } else if(view==="test" && T && !T.done){
    if(idx>=0 && idx<T.qs[T.idx].c.length){ e.preventDefault(); tAnswer(idx); }
    else if(k==="arrowright"){ tGo(T.idx+1); } else if(k==="arrowleft"){ tGo(T.idx-1); }
    else if(k==="f"){ tFlag(); }
  } else if(view==="full" && FT && FT.phase==="q"){
    const m=FT.mods[FT.cur];
    if(idx>=0 && idx<m.qs[m.idx].c.length){ e.preventDefault(); ftAns(idx); }
    else if(k==="arrowright"){ ftGo(m.idx+1); } else if(k==="arrowleft"){ ftGo(m.idx-1); }
    else if(k==="f"){ ftFlag(); }
  } else if(view==="desmos" && DZ.mode==="practice" && DZ.q){
    if(!DZ.answered && idx>=0 && idx<DZ.q.c.length){ e.preventDefault(); dzAns(idx); }
    else if(!DZ.answered && k==="h"){ e.preventDefault(); dzHint(); }
    else if(DZ.answered && k==="enter"){ e.preventDefault(); dzGo(); }
  } else if(view==="cards" && !FC.edit){
    if(k===" "||(k==="enter"&&e.target.tagName!=="BUTTON")){ e.preventDefault(); fcFlip(); }
    else if(k==="arrowright") fcMove(1); else if(k==="arrowleft") fcMove(-1);
    else if(k==="k") fcMark("know"); else if(k==="l") fcMark("learn");
  }
});
(function init(){
  const id=P.current||ssGet(SKEY);
  if(id && P.list.some(p=>p.id===id)){ UID=id; S=loadUser(id); if(!S.profile.name){ const p=P.list.find(x=>x.id===id); S.profile.name=p.name; } enterApp(); }
  else { applySettings(); showAuth(P.list.length?"pick":"signup"); }
})();
</script>
