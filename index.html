add("lin","How many solutions does 3(2x − 1) = 6x + 5 have?",["Zero","Exactly one","Exactly two","Infinitely many"],
 "Distribute: 6x − 3 = 6x + 5. Subtract 6x: −3 = 5, which is never true. Same slope with different constants means no solution.");
add("sys","At a bake sale, cookies cost $2 each and brownies cost $3 each. Maya sold 40 items for a total of $95. How many brownies did she sell?",["15","25","20","35"],
 "Let c + b = 40 and 2c + 3b = 95. Substitute c = 40 − b: 2(40 − b) + 3b = 95 → 80 + b = 95 → b = 15.");
add("sys","The system y = 2x + 1 and y = −x + 10 has solution (x, y). What is y?",["7","3","10","4"],
 "Set them equal: 2x + 1 = −x + 10 → 3x = 9 → x = 3. Then y = 2(3) + 1 = 7.");
add("sys","For what value of k does the system 3x + 2y = 7 and 6x + ky = 10 have no solution?",["4","2","−4","6"],
 "No solution means parallel lines: the coefficients are proportional but the constants aren’t. 6/3 = 2, so k = 2·2 = 4. The constants 10/7 ≠ 2, so the lines are parallel but different.");
add("sys","If x + y = 12 and x − y = 4, what is the value of xy?",["32","48","12","16"],
 "Add the equations: 2x = 16 → x = 8, so y = 4. Then xy = 32.");
add("sys","How many solutions does the system y = x² and y = 2x + 3 have?",["2","0","1","Infinitely many"],
 "Set equal: x² = 2x + 3 → x² − 2x − 3 = 0 → (x − 3)(x + 1) = 0. Two x-values, so two intersection points.");
add("quad","What are the solutions of x² − 5x − 14 = 0?",["x = 7 and x = −2","x = −7 and x = 2","x = 7 and x = 2","x = −7 and x = −2"],
 "Find two numbers that multiply to −14 and add to −5: −7 and 2. So (x − 7)(x + 2) = 0 → x = 7 or x = −2.");
add("quad","What is the minimum value of f(x) = (x − 3)² + 5?",["5","3","−3","−5"],
 "In vertex form a(x − h)² + k with a > 0, the minimum value is k. Here the vertex is (3, 5), so the minimum is 5.");
add("quad","How many real solutions does 2x² + 3x + 5 = 0 have?",["Zero","One","Two","Infinitely many"],
 "Discriminant: b² − 4ac = 9 − 40 = −31. A negative discriminant means no real solutions.");
add("quad","What is the vertex of the parabola y = x² − 6x + 11?",["(3, 2)","(−3, 2)","(3, 11)","(6, 11)"],
 "x = −b/(2a) = 6/2 = 3. Then y = 9 − 18 + 11 = 2. Vertex: (3, 2).");
add("quad","A ball’s height, in feet, t seconds after it is kicked is h(t) = −16t² + 64t. After how many seconds does it hit the ground?",["4","2","8","16"],
 "Set h = 0: −16t(t − 4) = 0 → t = 0 (the kick) or t = 4. It lands at t = 4. (t = 2 is when it reaches its highest point.)");
add("quad","If x² + kx + 25 is a perfect square trinomial and k > 0, what is k?",["10","5","25","50"],
 "(x + 5)² = x² + 10x + 25, so k = 2·5 = 10.");
add("quad","What is the sum of the solutions of 3x² − 12x + 7 = 0?",["4","−4","7/3","12"],
 "For ax² + bx + c = 0, the sum of the roots is −b/a = 12/3 = 4.");
add("func","If f(x) = 2x² − 3x, what is f(−2)?",["14","2","−2","−14"],
 "f(−2) = 2(4) − 3(−2) = 8 + 6 = 14. Square first, and watch the negative signs.");
add("func","If f(x) = x + 4 and g(x) = 3x, what is f(g(2))?",["10","18","6","12"],
 "Work from the inside out: g(2) = 6, then f(6) = 10. (18 is g(f(2)), the other order.)");
add("func","The graph of y = f(x) is shifted 3 units right and 2 units up. Which equation describes the new graph?",["y = f(x − 3) + 2","y = f(x + 3) + 2","y = f(x − 2) + 3","y = f(x + 3) − 2"],
 "A shift right by h replaces x with (x − h). A shift up by k adds k outside. So y = f(x − 3) + 2.");
add("func","What is the average rate of change of f(x) = x² from x = 1 to x = 4?",["5","15","3","8"],
 "(f(4) − f(1))/(4 − 1) = (16 − 1)/3 = 15/3 = 5.");
add("func","If f(x) = 3x − 5, what is the value of f⁻¹(7)?",["4","16","2","12"],
 "f⁻¹(7) is the input that gives an output of 7: 3x − 5 = 7 → x = 4. (16 is f(7).)");
add("func","The function f is defined by f(x) = |x − 4|. For how many values of x does f(x) = 3?",["2","1","0","3"],
 "|x − 4| = 3 means x − 4 = 3 or x − 4 = −3, so x = 7 or x = 1. That is two values.");
add("expo","A town of 20,000 people grows by 3% each year. Which expression gives the population after t years?",["20,000(1.03)ᵗ","20,000(0.03)ᵗ","20,000(1.3)ᵗ","20,000 + 0.03t"],
 "Growth of r% per year multiplies by (1 + r) each year: 1 + 0.03 = 1.03. So P = 20,000(1.03)ᵗ.");
add("expo","A car worth $30,000 loses 15% of its value each year. What is it worth after 2 years?",["$21,675","$21,000","$25,500","$22,500"],
 "Each year it keeps 85%: 30,000 × 0.85² = 30,000 × 0.7225 = $21,675. ($21,000 wrongly subtracts 15% of the original twice.)");
add("expo","What is the value of 8^(2/3)?",["4","2","16","12"],
 "8^(2/3) = (∛8)² = 2² = 4.");
add("expo","Which expression is equivalent to (x³y²)⁴ ÷ (x²y)³?",["x⁶y⁵","x⁹y⁵","xy⁵","x⁶y⁶"],
 "(x³y²)⁴ = x¹²y⁸ and (x²y)³ = x⁶y³. Dividing subtracts exponents: x¹²⁻⁶y⁸⁻³ = x⁶y⁵.");
add("expo","A bacteria population doubles every 5 hours. If it starts at 300, how many bacteria are there after 20 hours?",["4,800","2,400","1,200","12,000"],
 "20 hours is 4 doubling periods: 300 × 2⁴ = 300 × 16 = 4,800.");
add("expo","If 3^(x + 1) = 81, what is x?",["3","4","27","2"],
 "81 = 3⁴, so x + 1 = 4 and x = 3.");
add("poly","What is the remainder when p(x) = x³ − 2x² + 4x − 5 is divided by x − 2?",["3","−5","11","0"],
 "Remainder theorem: the remainder is p(2) = 8 − 8 + 8 − 5 = 3.");
add("poly","Which expression is equivalent to (2x − 3)(x² + x − 4)?",["2x³ − x² − 11x + 12","2x³ + 5x² − 5x + 12","2x³ − x² − 5x − 12","2x³ + x² − 11x + 12"],
 "2x(x² + x − 4) = 2x³ + 2x² − 8x and −3(x² + x − 4) = −3x² − 3x + 12. Combine: 2x³ − x² − 11x + 12.");
add("poly","If (x + 4) is a factor of x² + kx − 12, what is k?",["1","−1","4","−4"],
 "If (x + 4) is a factor, then x = −4 is a zero: 16 − 4k − 12 = 0 → 4 = 4k → k = 1. Check: (x + 4)(x − 3) = x² + x − 12. ✓");
add("poly","What are the zeros of f(x) = x(x − 5)(2x + 3)?",["0, 5, and −3/2","0, −5, and 3/2","5 and −3/2 only","0, 5, and −3"],
 "Set each factor to 0: x = 0, x − 5 = 0 → x = 5, and 2x + 3 = 0 → x = −3/2.");
add("poly","Which expression is equivalent to 9x² − 49?",["(3x + 7)(3x − 7)","(3x − 7)²","(9x + 7)(x − 7)","(3x + 49)(3x − 1)"],
 "This is a difference of squares: (3x)² − 7² = (3x + 7)(3x − 7).");
add("poly","For x ≠ −2 and x ≠ −3, which expression is equivalent to (x² − 9)/(x² + 5x + 6)?",["(x − 3)/(x + 2)","(x + 3)/(x + 2)","(x − 3)/(x − 2)","−9/(5x + 6)"],
 "Factor: (x − 3)(x + 3) / ((x + 2)(x + 3)). Cancel (x + 3): (x − 3)/(x + 2). You can only cancel factors, never individual terms.");
add("pct","A jacket costs $80. It is discounted 25%, and then 8% sales tax is added to the sale price. What is the final price?",["$64.80","$66.40","$60.00","$86.40"],
 "Sale price: 80 × 0.75 = $60. With tax: 60 × 1.08 = $64.80.");
add("pct","The ratio of boys to girls in a club is 3 : 5. If the club has 40 members, how many are girls?",["25","15","24","8"],
 "There are 3 + 5 = 8 parts, so each part is 40/8 = 5 members. Girls: 5 × 5 = 25.");
add("pct","A price increased from $50 to $65. By what percent did it increase?",["30%","15%","23%","65%"],
 "Percent change = (65 − 50)/50 = 15/50 = 0.30 = 30%. Always divide by the ORIGINAL value.");
add("pct","If 40% of a number is 18, what is 75% of the number?",["33.75","30","13.5","24"],
 "0.4n = 18 → n = 45. Then 0.75 × 45 = 33.75.");
add("pct","A map uses a scale of 1 inch : 12 miles. Two towns are 4.5 inches apart on the map. How many miles apart are they?",["54","48","16.5","60"],
 "4.5 × 12 = 54 miles.");
add("pct","A recipe uses 3 cups of flour for every 2 cups of sugar. How many cups of flour are needed with 5 cups of sugar?",["7.5","6","10","8"],
 "Set up the proportion 3/2 = f/5 → f = 15/2 = 7.5 cups.");
add("stat","The mean of five numbers is 12. When a sixth number is added, the mean becomes 13. What is the sixth number?",["18","13","1","15"],
 "The original sum is 5 × 12 = 60 and the new sum is 6 × 13 = 78. The new number is 78 − 60 = 18.");
add("stat","What is the median of the data set 4, 7, 7, 9, 12, 15?",["8","7","9","10.5"],
 "There are six values, so the median is the mean of the 3rd and 4th: (7 + 9)/2 = 8. (9 is the mean of the set.)");
add("stat","In the data set 3, 5, 8, 10, 40, the value 40 is replaced with 100. Which statistic does NOT change?",["The median","The mean","The range","The standard deviation"],
 "The middle value is still 8, so the median doesn’t change. The mean, range, and spread all grow because the largest value grew.");
add("stat","Two classes took the same test. Class A’s scores had a standard deviation of 4 points, and Class B’s had a standard deviation of 11 points. Which statement must be true?",
 ["Class B’s scores were more spread out than Class A’s.","Class B had a higher average score.","Class A’s scores were more spread out than Class B’s.","Class A had more students than Class B."],
 "Standard deviation measures spread, not center. A larger standard deviation means the scores are more spread out. It says nothing about averages or class size.");
add("stat","A researcher randomly selects 500 adults in a city and finds that 62% of them support building a new park. Which conclusion is most appropriate?",
 ["About 62% of all adults in the city likely support the park, with some margin of error.","Exactly 62% of all adults in the country support the park.","Exactly 310 adults in the city support the park.","The park will definitely be built."],
 "A random sample can be generalized to the population it was drawn from (the city, not the country), but only approximately, with a margin of error.");
add("prob","A bag has 4 red, 6 blue, and 5 green marbles. One marble is chosen at random. What is the probability that it is NOT blue?",["3/5","2/5","1/3","4/15"],
 "There are 15 marbles and 9 are not blue: 9/15 = 3/5. (Or: 1 − 6/15 = 9/15.)");
add("prob","A fair coin is flipped three times. What is the probability of getting exactly two heads?",["3/8","1/4","1/2","1/8"],
 "There are 2³ = 8 equally likely outcomes. Exactly two heads: HHT, HTH, THH, which is 3 outcomes. 3/8.");
add("prob","Two fair six-sided dice are rolled. What is the probability that the sum is 7?",["1/6","1/12","7/36","1/36"],
 "Pairs that sum to 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1), which is 6 of 36. 6/36 = 1/6.");
add("prob","Of 200 students surveyed, 120 play a sport. Of those 120, 45 also play an instrument. Of the students who do not play a sport, 35 play an instrument. If a student who plays an instrument is chosen at random, what is the probability that the student plays a sport?",["9/16","3/8","7/16","9/40"],
 "“Given that the student plays an instrument” means the total is only the instrument players: 45 + 35 = 80. Of those, 45 play a sport: 45/80 = 9/16.");
add("prob","A spinner has 8 equal sections numbered 1 through 8. What is the probability of spinning a number greater than 5 on two spins in a row?",["9/64","3/8","3/4","1/64"],
 "P(>5) = 3/8 (6, 7, or 8). The spins are independent, so multiply: (3/8)(3/8) = 9/64.");
add("geo","What are the center and radius of the circle (x − 2)² + (y + 5)² = 49?",["Center (2, −5), radius 7","Center (−2, 5), radius 7","Center (2, −5), radius 49","Center (−2, 5), radius 49"],
 "In (x − h)² + (y − k)² = r², the center is (h, k) and the radius is r. Here y + 5 = y − (−5), so the center is (2, −5), and r = √49 = 7.");
add("geo","The equation x² + y² − 6x + 4y = 12 represents a circle. What is its radius?",["5","12","√12","25"],
 "Complete the square: (x² − 6x + 9) + (y² + 4y + 4) = 12 + 9 + 4 → (x − 3)² + (y + 2)² = 25. Radius = 5.");
add("geo","Triangle ABC is similar to triangle DEF, with AB corresponding to DE and BC corresponding to EF. If AB = 6, DE = 15, and BC = 8, what is EF?",["20","17","3.2","12"],
 "The scale factor is 15/6 = 2.5, so EF = 8 × 2.5 = 20.");
add("geo","A cylinder has a radius of 3 and a height of 10. What is its volume?",["90π","30π","60π","9π"],
 "V = πr²h = π(9)(10) = 90π.");
add("geo","In a circle with radius 9, what is the length of an arc intercepted by a central angle of 120°?",["6π","3π","27π","12π"],
 "Arc length = (120/360) × 2π(9) = (1/3)(18π) = 6π.");
add("geo","Two angles are supplementary, and one is 4 times the other. What is the measure of the larger angle?",["144°","36°","72°","135°"],
 "x + 4x = 180 → x = 36. The larger angle is 4 × 36 = 144°.");
add("geo","What is the measure of each interior angle of a regular octagon?",["135°","120°","140°","1,080°"],
 "Sum of interior angles = (8 − 2) × 180 = 1,080°. Each of the 8 equal angles is 1,080/8 = 135°.");
add("trig","In right triangle ABC, angle C is the right angle, AC = 5, and BC = 12. What is sin A?",["12/13","5/13","5/12","12/5"],
 "Hypotenuse AB = √(25 + 144) = 13. Sine = opposite/hypotenuse. The side opposite angle A is BC = 12, so sin A = 12/13.");
add("trig","If sin x° = 0.6, what is the value of cos(90 − x)°?",["0.6","0.8","0.4","1.6"],
 "Cofunction identity: cos(90° − x) = sin x. So it equals 0.6.");
add("trig","How many degrees are in 3π/4 radians?",["135°","45°","270°","67.5°"],
 "Multiply by 180/π: (3π/4)(180/π) = 3 × 45 = 135°.");
add("trig","In a 30°-60°-90° triangle, the shortest side has length 7. What is the length of the hypotenuse?",["14","7√3","7√2","21"],
 "The sides are in the ratio x : x√3 : 2x, with the shortest side x opposite 30°. The hypotenuse is 2x = 14.");
add("trig","A 20-foot ladder leans against a wall, making a 60° angle with the ground. How high up the wall does the ladder reach?",["10√3 feet","10 feet","20√3 feet","10√2 feet"],
 "The height is opposite the 60° angle: 20 × sin 60° = 20(√3/2) = 10√3 feet.");
add("trig","If tan θ = 3/4 and θ is acute, what is cos θ?",["4/5","3/5","3/4","5/4"],
 "Opposite = 3 and adjacent = 4, so the hypotenuse is 5 (a 3-4-5 triangle). cos θ = adjacent/hypotenuse = 4/5.");
add("word","A train travels 240 miles in 4 hours and then 150 miles in 2 hours. What is its average speed for the whole trip?",["65 mph","62.5 mph","67.5 mph","75 mph"],
 "Average speed = total distance ÷ total time = 390/6 = 65 mph. Averaging the two speeds (60 and 75) gives 67.5, which is wrong because the trip spends more time at 60.");
add("word","Pipe A can fill a tank in 6 hours, and pipe B can fill it in 3 hours. Working together, how long do they take to fill the tank?",["2 hours","4.5 hours","9 hours","1.5 hours"],
 "Rates add: 1/6 + 1/3 = 1/6 + 2/6 = 1/2 tank per hour, so the job takes 2 hours.");
add("word","A phone plan costs $25 per month plus $0.10 per text. Kai’s bill one month was $38.50. How many texts did Kai send?",["135","385","13","150"],
 "25 + 0.10t = 38.50 → 0.10t = 13.50 → t = 135.");
add("word","Maria is 3 times as old as her brother. In 10 years, she will be twice as old as he will be. How old is Maria now?",["30","10","20","40"],
 "Let b be the brother’s age, so Maria is 3b. Then 3b + 10 = 2(b + 10) → 3b + 10 = 2b + 20 → b = 10. Maria is 30.");
add("word","A rectangle’s length is 4 more than its width, and its perimeter is 56. What is its area?",["192","160","208","224"],
 "2(w + w + 4) = 56 → 2w + 4 = 28 → w = 12, so the length is 16. Area = 12 × 16 = 192.");
add("word","A car travels at 72 kilometers per hour. What is its speed in meters per second?",["20","72","1,200","2"],
 "72 km/h = 72,000 m per 3,600 s = 20 m/s. (1,200 is meters per MINUTE.)");

/* ---- Challenge set: harder, test-style questions ---- */
gq("punc","In 1903, the Wright brothers achieved the first powered, controlled airplane ___ a flight that lasted just twelve seconds.",
 ["flight:","flight;","flight, and","flight. A"],
 "What follows the blank is a phrase that explains the first flight, not a full sentence. A colon (or a dash) can introduce an explanation after a complete clause. A semicolon or period would leave a fragment, and “and” creates a faulty compound.");
gq("punc","The ___ which had been closed for renovations since spring, reopened to the public in October.",
 ["gallery,","gallery","gallery;","gallery—"],
 "“Which had been closed… since spring” is nonessential, and it already ends with a comma. It needs a matching comma before it. A dash would not match the closing comma.");
gq("punc","Researchers have identified three factors that influence bird ___ the availability of food, changes in day length, and shifts in temperature.",
 ["migration:","migration;","migration, being","migration, these are"],
 "A complete clause comes before the blank, and a list of the three factors follows. A colon introduces it. “These are” after a comma creates a comma splice.");
gq("punc","Octavia Butler’s novel <i>Kindred</i> blends science fiction with historical ___ protagonist travels back in time to a plantation in antebellum Maryland.",
 ["fiction; its","fiction, its","fiction its","fiction, and, its"],
 "Both halves are independent clauses, so a semicolon joins them correctly. A comma alone is a comma splice, and “and,” with commas on both sides, is incorrect.");
gq("punc","The ___ discovered in 2015 in South Africa’s Rising Star cave system, has been named <i>Homo naledi</i>.",
 ["species,","species","species;","species—"],
 "“Discovered in 2015 in South Africa’s Rising Star cave system” is a nonessential phrase closed by a comma, so it must also open with one.");
gq("sva","The number of students enrolled in computer science courses ___ tripled over the past decade.",
 ["has","have","are","were"],
 "“The number” is singular, so it takes the singular “has.” Compare: “A number of students HAVE,” where the phrase means “many” and is plural.");
gq("sva","According to recent estimates, there ___ more than eight million species of animals on Earth.",
 ["are","is","was","has been"],
 "In a “there is/there are” sentence, the subject comes after the verb: “more than eight million species” is plural, so “are.”");
gq("sva","The professor, as well as her two research assistants, ___ presenting at the conference next week.",
 ["is","are","were","have been"],
 "“As well as her two research assistants” is an interrupting phrase, not part of the subject. The subject is “The professor,” which is singular, so the verb is “is.”");
gq("sva","Not one of the hundreds of applicants ___ the necessary qualifications.",
 ["has","have","are having","were having"],
 "The subject is “one” (singular). “Of the hundreds of applicants” is a prepositional phrase, so ignore it. Singular → “has.”");
gq("pron","When Maya called her sister last night, ___ was in the middle of a violin lesson.",
 ["her sister","she","her","they"],
 "“She” is ambiguous here: it could mean Maya or her sister. Only naming “her sister” makes the meaning clear. On the SAT, an ambiguous pronoun is an error.");
gq("pron","The orchestra’s musicians tuned ___ instruments before the conductor arrived.",
 ["their","its","his or her","it’s"],
 "The pronoun refers to “musicians” (plural), not to “orchestra,” so use the plural “their.”");
add("mod",STD,["the historian finally identified the scribe who had written them.","the scribe who had written them was finally identified by the historian.","the identity of the scribe was finally revealed.","finally the scribe’s identity became known to the historian."],
 "Who studied the manuscripts for years? The historian, so “the historian” must come right after the opening phrase.",
 "Having studied the ancient manuscripts for years, "+BL);
add("para",STD,["timed each of her rebuttals.","she timed each of her rebuttals.","timing each of her rebuttals.","her rebuttals were timed."],
 "The list is “researched…, practiced…, and ___.” The last item must also be a past-tense verb with the same subject: “timed.”",
 "To prepare for the debate, Lena researched both sides of the issue, practiced her opening statement, and "+BL);
gq("tense","Archaeologists believe that the ancient city ___ abandoned sometime around 900 CE, though the exact cause remains unknown.",
 ["was","is","will be","has been"],
 "“Around 900 CE” is a specific, finished time in the past, so use the simple past “was.” The present perfect (“has been”) doesn’t work with a specific past date.");
add("trans",TRN,["Surprisingly","Predictably","Similarly","As expected"],
 "The policy was EXPECTED to be unpopular, but most employees approved of it. That result goes against expectations, so “Surprisingly” fits.",
 "Company leaders expected the new four-day schedule to be unpopular with employees. "+BL+", a survey conducted three months later found that 78 percent of employees approved of it.");
add("trans",TRN,["by contrast","for example","similarly","as a result"],
 "Copernicus’s view (the Sun at the center) is the opposite of the earlier belief (Earth at the center), so “by contrast” fits.",
 "Many early astronomers believed that Earth sat motionless at the center of the universe. Copernicus, "+BL+", argued that Earth and the other planets orbit the Sun.");
add("trans",TRN,["Additionally","Consequently","Nevertheless","In other words"],
 "Elasticity is a second, separate impressive property of spider silk, added to its strength. “Additionally” signals that addition. “In other words” would mean the two sentences say the same thing.",
 "Spider silk is extraordinarily strong; by weight, some types are tougher than steel. "+BL+", it is remarkably elastic, able to stretch considerably before it breaks.");
add("wic",WIC,["persuasive","tedious","ambiguous","perfunctory"],
 "Critics “conceded she had made a compelling case,” so the speech must have been convincing, or “persuasive.”",
 "The senator’s speech was so "+BL+" that even her longtime critics conceded she had made a compelling case.");
add("wic",WIC,["corroborated","undermined","obscured","dismissed"],
 "The theory moved from skepticism to wide acceptance, so the evidence must have SUPPORTED it. “Corroborated” means confirmed or supported.",
 "Although the theory was initially met with skepticism, a growing body of evidence has "+BL+" it, and it is now widely accepted.");
add("wic",WIC,["nuanced","flattering","superficial","hostile"],
 "Showing both brilliance AND serious flaws is a balanced, subtle portrait. That is “nuanced.” “Flattering” and “hostile” are one-sided.",
 "The biography presents a "+BL+" portrait of the inventor, acknowledging his brilliance while also examining his serious flaws.");
add("wic",WIC,["barren","lush","crowded","vibrant"],
 "“Despite” signals a contrast with “teems with life,” so the desert must LOOK lifeless: “barren.”",
 "Despite its "+BL+" appearance, the desert ecosystem teems with life, much of which emerges only at night.");
const P10="Eliza had always measured her town by its sounds: the noon whistle from the mill, the church bells on Sunday, the freight train that rattled the dishes every evening at six. When the mill closed, the whistle stopped first. Within a year the train no longer came, and the town, Eliza thought, had grown so quiet that she could hear it holding its breath.";
add("read","Which choice best describes the effect of the final sentence of the text?",
 ["It suggests that the town is tense and uncertain about its future.","It shows that Eliza prefers quiet towns to noisy ones.","It indicates that the mill will soon reopen.","It explains why the freight train stopped running."],
 "“Holding its breath” personifies the town as waiting anxiously, which suggests tension and uncertainty after the losses. Nothing says Eliza likes quiet or that the mill will reopen.",P10);
add("read","Based on the text, why did the town become quieter?",
 ["The mill’s closing led to the loss of familiar sounds, including the whistle and, later, the train.","Eliza began to lose her hearing.","A new law banned loud noises in the town.","Residents asked the railroad to stop its evening train."],
 "The text links the changes in order: the mill closed, the whistle stopped, and within a year the train no longer came. The other choices aren’t supported.",P10);
add("read","Which choice most logically completes the text?",
 ["parents may choose empty pools to reduce the risk that their offspring will be eaten.","tadpoles grow faster when they share pools with other tadpoles.","parents cannot tell the difference between empty and occupied pools.","tree hollows are the only places where tadpoles can survive."],
 "Parents pick empty pools more often than chance, and tadpoles of these species eat one another. The logical conclusion is that parents avoid occupied pools to protect their young. The third choice contradicts the observation.",
 "Some species of tropical frogs carry their tadpoles on their backs from where the eggs hatch to small pools of water in tree hollows. Researchers observed that parents choose pools without other tadpoles far more often than chance would predict. Because tadpoles of these species are known to eat one another, the researchers concluded that "+BL);
add("synth","The student wants to emphasize how long the Great Wall took to build. "+SYN,
 ["Construction of the Great Wall of China spanned more than two thousand years, from the 7th century BCE to the 17th century CE.",
  "A 2012 survey found that the Great Wall, including all of its branches, is about 21,000 kilometers long.",
  "The best-preserved sections of the Great Wall were built during the Ming dynasty.",

reg("geo",()=>{

  const eq=`x² + y²${t(D,"x")}${t(E,"y")} = ${fmt(-F)}`;
  return mk("geo",`The equation ${eq} defines a circle in the xy-plane. What is the radius of the circle?`,fmt(r),[fmt(r*r),fmt(Math.abs(F)),fmt(r+1),fmt(2*r)],

reg("synth",()=>{

  let L1=ri(30,140)*10, L2=ri(30,140)*10; while(Math.abs(L1-L2)<100) L2=ri(30,140)*10;
  const same=Math.random()<.5, m1=pick(BR_MAT), m2=same?m1:pick(BR_MAT.filter(x=>x!==m1));
  const r1=pick(["the Elk River","the Clearwater River","Lake Tama","the Sable River"]), r2=pick(["the Dunmore River","Blue Heron Bay","the Pine River","the Ashby Channel"]);
  const notes=NOTES([`The ${n1} Bridge crosses ${r1}.`,`It opened in ${y1} and is ${nf(L1)} meters long.`,`It is a ${m1} bridge.`,`The ${n2} Bridge crosses ${r2}.`,`It opened in ${y2} and is ${nf(L2)} meters long.`,`It is a ${m2} bridge.`]);
  const longer=L1>L2?n1:n2, shorter=L1>L2?n2:n1, diff=Math.abs(L1-L2);
  const sLen=`The ${longer} Bridge is ${nf(diff)} meters longer than the ${shorter} Bridge.`;
  const sAge=`The ${n1} Bridge opened in ${y1}, ${y2-y1} years before the ${n2} Bridge.`;
  const sMat= same? `Both the ${n1} Bridge and the ${n2} Bridge are ${m1} bridges.` : `The ${n1} Bridge is a ${m1} bridge, while the ${n2} Bridge is a ${m2} bridge.`;
  const sOne=`The ${n2} Bridge crosses ${r2} and is ${nf(L2)} meters long.`;
  const g=same? pick(["len","age","sim"]) : pick(["len","age","mat"]);
  const G={len:["emphasize the difference in length between the two bridges",sLen,[sAge,sMat,sOne],"The goal is a difference in LENGTH, so the answer must compare both lengths."],
    age:["emphasize which bridge is older",sAge,[sLen,sMat,sOne],"The goal is which bridge is OLDER, so the answer must compare the two opening years."],
    sim:["emphasize a similarity between the two bridges",sMat,[sLen,sAge,sOne],"The goal is a SIMILARITY, so the answer must name something both bridges share."],
    mat:["contrast the materials of the two bridges",sMat,[sLen,sAge,sOne],"The goal is to contrast MATERIALS, so the answer must name both bridges’ materials."]}[g];
  return mk("synth",`The student wants to ${G[0]}. ${SYN}`,G[1],G[2],`${G[3]} The other choices are accurate but don’t accomplish that goal.`,notes);

reg("synth",()=>{
  const a=pick(NOV_AUTH), [t1,t2]=shuffle(NOV_TITLES).slice(0,2), y1=ri(1950,2005), y2=y1+ri(3,15);
  const set1=pick(["a fishing village in Maine","postwar London","a mining town in Chile","1920s Shanghai","a farm in Iowa"]), set2=pick(["a modern-day Lagos apartment","a lighthouse in Norway","a New Orleans jazz club","a desert research station"]);
  const notes=NOTES([`${a} is a novelist.`,`${a}’s first novel, <i>${t1}</i>, was published in ${y1}.`,`It is set in ${set1}.`,`${a}’s second novel, <i>${t2}</i>, was published in ${y2}.`,`It is set in ${set2}.`,`<i>${t2}</i> won a national book award.`]);
  const g=pick(["intro","contrast","award"]);
  const sIntro=`${a}’s debut novel, <i>${t1}</i>, was published in ${y1} and is set in ${set1}.`;
  const sCon=`While ${a}’s first novel is set in ${set1}, the second is set in ${set2}.`;
  const sAward=`${a}’s second novel, <i>${t2}</i> (${y2}), won a national book award.`;
  const sGap=`${a} published two novels ${y2-y1} years apart.`;
  const G={intro:["introduce the author’s first novel to a new audience",sIntro,[sCon,sAward,sGap],"The goal is to introduce the FIRST novel, so the answer should name it and give key details about it."],
    contrast:["contrast the settings of the two novels",sCon,[sIntro,sAward,sGap],"The goal is to contrast SETTINGS, so the answer must mention both settings."],
    award:["highlight the author’s most celebrated achievement",sAward,[sIntro,sCon,sGap],"The notes say the second novel won a national award, which is the most celebrated achievement mentioned."]}[g];
  return mk("synth",`The student wants to ${G[0]}. ${SYN}`,G[1],G[2],`${G[3]} The other choices are true but don’t accomplish the goal.`,notes);
});

const EV_DOM=[
 ["A librarian","checkouts","Library checkouts by genre",["Mystery","Science fiction","Biography","Poetry","Graphic novel"],"{c} checkouts"],
 ["A city planner","weekday riders","Average weekday riders by transit line",["Red Line","Blue Line","Green Line","Orange Line","Harbor Ferry"],"weekday ridership on the {C}"],
 ["An ecologist","birds counted","Birds counted at the wetland",["Herons","Egrets","Ospreys","Kingfishers","Sandpipers"],"the number of {c} counted at the wetland"],
 ["A museum director","visitors","Annual visitors by gallery",["Ancient Art","Modern Art","Natural History","Science Hall","Photography"],"annual visitors to the {C} gallery"],
 ["An energy analyst","gigawatt-hours","Electricity produced (gigawatt-hours)",["Solar","Wind","Hydropower","Natural gas","Coal"],"electricity produced from {c}"]];
reg("evid",()=>{
  const [who,unit,title,cats,claim]=pick(EV_DOM), cs=shuffle(cats).slice(0,4), y1=ri(2014,2019), y2=y1+ri(3,5);
  const rows=cs.map(()=>{ const a=ri(20,90)*10; return [a, Math.max(10,a+ri(-40,40)*10)]; });
  const up=Math.random()<.5, ti=0, k=1;
  { const a=rows[0][0]; rows[0]=[a, up? a+ri(8,40)*10 : Math.max(10,a-ri(8,Math.floor(a/10)-1)*10)]; }
  { const a=rows[1][0]; rows[1]=[a, up? Math.max(10,a-ri(5,Math.floor(a/10)-1)*10) : a+ri(5,30)*10]; }
  const t=cs[ti], o=cs[k], lc=s=>claim.replace("{c}",s.toLowerCase()).replace("{C}",s);
  const verb=up?"increased":"decreased";
  const table=`<table><tr><th>${title}</th><th>${y1}</th><th>${y2}</th></tr>${cs.map((c,i)=>`<tr><td>${c}</td><td>${nf(rows[i][0])}</td><td>${nf(rows[i][1])}</td></tr>`).join("")}</table>`;
  return mk("evid","Which choice most effectively uses data from the table to support the claim?",
    `${t}: ${nf(rows[ti][0])} ${unit} in ${y1} and ${nf(rows[ti][1])} in ${y2}.`,
    [`${o}: ${nf(rows[k][0])} ${unit} in ${y1} and ${nf(rows[k][1])} in ${y2}.`,`${t}: ${nf(rows[ti][1])} ${unit} in ${y2}.`,`${cs[2]}: ${nf(rows[2][0])} ${unit} in ${y1} and ${nf(rows[2][1])} in ${y2}.`],
    `The claim is about how ${lc(t)} CHANGED between ${y1} and ${y2}, so the evidence needs ${t}’s numbers for BOTH years. Giving only one year can’t show a change, and other categories are irrelevant.`,
    `${who} claims that ${lc(t)} ${verb} from ${y1} to ${y2}.${table}`);
});

  const d=DEF(); if(!o||typeof o!=="object") return d;

function addMissed(q){ S.missed=S.missed.filter(m=>m.id!==q.id); S.missed.push({id:q.id,t:q.t,s:q.s,q:q.q,c:q.c,a:q.a,e:q.e,p:q.p}); if(S.missed.length>200) S.missed.shift(); }

function prep(q){ const idx=shuffle([0,1,2,3].slice(0,q.c.length)); return Object.assign({},q,{c:idx.map(i=>q.c[i]),a:idx.indexOf(q.a)}); }
function wpick(keys,ws){ let s=ws.reduce((a,b)=>a+b,0), r=Math.random()*s; for(let i=0;i<keys.length;i++){ r-=ws[i]; if(r<=0) return keys[i]; } return keys[keys.length-1]; }
function smartTopic(){ const ks=Object.keys(TOPICS); return wpick(ks,ks.map(k=>{ const s=S.stats[k]; let w= !s||s.n<4? 2 : 1+4*(1-s.c/s.n); return TOPICS[k].s==="E"? w*1.4 : w; })); }
function topicFor(mode){
  if(mode.kind==="topic") return mode.topic;
  if(mode.kind==="E") return pick(ETOP);
  if(mode.kind==="M") return pick(MTOP);
  if(mode.kind==="smart") return smartTopic();
  return Math.random()<(S.settings.mixE/100)? pick(ETOP) : pick(MTOP);
}
/* No-repeat memory: hand-written questions you've already seen are skipped (across
   sessions) until you've seen every one in that topic, and generated questions are
   checked against the last 800 you were shown, so an exact repeat is very unlikely. */
function qsig(q){ const s=q.t+"|"+q.q+"|"+(q.p||"")+"|"+q.c[0]; let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
function rememberQ(q){
  if(q.gen){ const a=S.recentSig||(S.recentSig=[]); a.push(qsig(q)); if(a.length>800) a.splice(0,a.length-800); }
  else { const h=S.seenQ||(S.seenQ=[]); const i=h.indexOf(q.id); if(i>=0) h.splice(i,1); h.push(q.id); if(h.length>2000) h.shift(); }
}
function drawQuestion(mode,seen){
  const t=topicFor(mode);
  const bank=BANK.filter(q=>q.t===t), gens=GEN[t]||[], hist=S.seenQ||[], histSet=new Set(hist);
  const fresh=bank.filter(q=>!seen.has(q.id)&&!histSet.has(q.id));
  let q=null;
  if(fresh.length && (!gens.length || Math.random()<.45)) q=pick(fresh);
  else if(gens.length){
    const recent=new Set(S.recentSig||[]);
    for(let i=0;i<15&&!q;i++){ let c=null; try{ c=pick(gens)(); }catch(e){ c=null; }
      if(c && (i===14 || (!recent.has(qsig(c)) && !seen.has(qsig(c))))) q=c; }
  }
  if(!q){ const pool=bank.filter(b=>!seen.has(b.id)), src=pool.length?pool:bank;
    q=src.slice().sort((a,b)=>hist.indexOf(a.id)-hist.indexOf(b.id))[0]; }
  rememberQ(q); seen.add(q.gen?qsig(q):q.id);
  return prep(q);
}

function confetti(preview){
  if(!S.settings.motion){ if(preview) toast("Turn on Animations to see the confetti"); return; }
  try{
    const old=document.querySelector(".confetti"); if(old) old.remove();
    const cv=document.createElement("canvas"); cv.className="confetti"; cv.setAttribute("aria-hidden","true"); document.body.appendChild(cv);
    const W=innerWidth, H=innerHeight, dpr=Math.min(2,window.devicePixelRatio||1); cv.width=W*dpr; cv.height=H*dpr;
    const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
    const acc=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#4263eb";
    const cols=[acc,"#f59f00","#12b886","#e64980","#7048e8","#fd7e14","#15aabf","#fab005"], ps=[];
    const N=Math.min(220,Math.round(W/5)+80);
    for(let i=0;i<N;i++){ const side=i%3, x= side===0?-10 : side===1? W+10 : W*(.3+Math.random()*.4);
      const vx= side===0? 5+Math.random()*9 : side===1? -(5+Math.random()*9) : (Math.random()-.5)*8;
      ps.push({x, y: side===2? H+10 : H*(.55+Math.random()*.3), vx, vy:-(10+Math.random()*(H/55)), w:6+Math.random()*6, h:9+Math.random()*8,
        r:Math.random()*6.28, vr:(Math.random()-.5)*.3, c:cols[i%cols.length], round:Math.random()<.25, sw:Math.random()*6.28, d:Math.random()*120}); }
    const t0=performance.now(), LIFE=4600;
    function frame(t){
      const el=t-t0; ctx.clearRect(0,0,W,H); let alive=0;
      for(const p of ps){
        if(el<p.d) { alive++; continue; }
        p.vy+=.3; p.vx*=.986; if(p.vy>3.4) p.vy=3.4; p.sw+=.08;
        p.x+=p.vx+Math.sin(p.sw)*.9; p.y+=p.vy; p.r+=p.vr;
        if(p.y<H+30) alive++;
        ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,(LIFE-el)/900)); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
        if(p.round){ ctx.beginPath(); ctx.arc(0,0,p.w/2.4,0,6.283); ctx.fill(); }
        else { const s=Math.abs(Math.cos(p.sw*1.7)); ctx.fillRect(-p.w/2,-p.h*s/2,p.w,p.h*s+1); }
        ctx.restore();
      }
      if(alive&&el<LIFE) requestAnimationFrame(frame); else cv.remove();
    }
    requestAnimationFrame(frame);
  }catch(e){}
}

    app.innerHTML=`<div class="grid2" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)">
      <section class="panel"><h3>Set up your test</h3>
        <p class="muted mini" style="margin-top:-6px">About 71 seconds per Reading &amp; Writing question and 95 per Math question, the real SAT pacing. You can skip around, flag questions, and change answers until you submit.</p>
        <div class="h-sec" style="margin-top:18px">Length</div>
        <div class="opts">${[10,20,30,44].map(n=>`<button class="opt ${testCfg.n===n?"on":""}" onclick="testCfg.n=${n};rTest()"><b>${n}</b><span>questions · ${fmtTime(estSecs(n,testCfg.mix))}</span></button>`).join("")}</div>
        <div class="h-sec">Content</div>
        <div class="seg">${[["X",`Mixed (${S.settings.mixE}% English)`],["E","English only"],["M","Math only"]].map(([k,l])=>`<button class="${testCfg.mix===k?"on":""}" onclick="testCfg.mix='${k}';rTest()">${l}</button>`).join("")}</div>
        <div class="row between" style="margin-top:24px">
          <span class="muted mini">${ic("test",16)}</span>
          <span style="flex:1" class="mini">Time limit <b>${fmtTime(estSecs(testCfg.n,testCfg.mix))}</b>${mt!==1?` · includes ${mt}× extra time`:""} · <a href="#" onclick="go('settings');return false">timing options</a></span>
          <button class="btn pri lg" onclick="startTest()">Start test ${ic("arrow",18)}</button>
        </div>
      </section>
      <section class="panel"><h3>Recent tests</h3>
        ${last.length?last.map(t=>{ const p=Math.round(100*t.c/t.n); return `<div class="hist"><span><b>${t.c}/${t.n}</b> <span class="muted">· ${MIXN[t.mix]||"Mixed"} · ${t.d.slice(5)}</span></span><span style="width:90px"><div class="bar thin"><i class="${barCls(p)}" style="width:${p}%"></i></div></span><b style="width:42px;text-align:right">${p}%</b></div>`; }).join("")
          :`<p class="muted mini">No tests yet. Your scores will appear here.</p>`}
      </section></div>`;
    return;
  }
  if(!T.done){
    const q=T.qs[T.idx], left=(T.end-Date.now())/1000, answered=T.ans.filter(a=>a!==null).length, n=T.qs.length, st=S.settings;
    app.innerHTML=`<div class="qwrap">
      <div class="testbar"><div class="tb-l"><b>Question ${T.idx+1}</b> <span class="muted">of ${n} · ${answered} answered</span><div class="bar thin"><i style="width:${Math.round(100*answered/n)}%"></i></div></div>
        <div id="timer" class="timer ${st.showTimer&&left<60?"low":""}">${ic("test",20)}<span id="timerv">${st.showTimer?fmtTime(left):`<span class="muted mini">hidden</span>`}</span></div>
        <button class="btn pri sm" onclick="submitTest()">Submit</button></div>
      <div class="qnav">${T.qs.map((x,i)=>`<button class="${T.ans[i]!==null?"ans":""} ${i===T.idx?"cur":""} ${T.flag[i]?"fl":""}" onclick="tGo(${i})" aria-label="Question ${i+1}${T.flag[i]?", flagged":""}">${i+1}</button>`).join("")}</div>
      <article class="qcard"><div class="tags">${secTag(q)}<button class="btn ghost sm flagbtn ${T.flag[T.idx]?"on":""}" style="margin-left:auto" onclick="tFlag()">${ic("flag",14)} ${T.flag[T.idx]?"Flagged":"Flag for review"}</button></div>
      ${qBody(q)}${choicesHTML(q,T.ans[T.idx],false,"tAnswer")}
      <div class="actions"><button class="btn" onclick="tGo(${T.idx-1})" ${T.idx===0?"disabled":""}>${ic("back",16)} Previous</button>
      ${st.hints?`<span class="hint"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>F</kbd> flag</span>`:""}
      ${T.idx<n-1?`<button class="btn pri" onclick="tGo(${T.idx+1})">Next ${ic("arrow",16)}</button>`:`<button class="btn pri" onclick="submitTest()">Submit test</button>`}</div></article></div>`;
    return;
  }
  const c=T.qs.filter((q,i)=>T.ans[i]===q.a).length, n=T.qs.length, pct=Math.round(100*c/n);
  const part=s=>{ const idx=T.qs.map((q,i)=>i).filter(i=>T.qs[i].s===s); const k=idx.filter(i=>T.ans[i]===T.qs[i].a).length; return idx.length?`${k}/${idx.length}`:"—"; };
  const msg= pct>=90?"Outstanding!":pct>=75?"Strong work!":pct>=60?"Solid. Keep building.":"Every miss is something to learn. Review them below.";
  app.innerHTML=`<section class="panel"><div class="resgrid">
      ${ring(c/n,140,13,pct+"%",`${c} of ${n}`,pct>=80?"var(--good)":pct>=60?"var(--accent)":pct>=40?"var(--warn)":"var(--bad)")}
      <div style="flex:1;min-width:220px"><h2 style="font-size:1.5rem">${msg}</h2>
        <div class="row" style="gap:28px;margin-top:12px"><div class="stat"><b>${part("E")}</b><span>English</span></div><div class="stat"><b>${part("M")}</b><span>Math</span></div><div class="stat"><b>${fmtTime(T.used)}</b><span>of ${fmtTime(T.secs)} used</span></div></div>
        <div class="row" style="margin-top:18px"><button class="btn pri" onclick="T=null;startTest()">New test</button><button class="btn" onclick="T=null;rTest()">Change settings</button>${S.missed.length?`<button class="btn" onclick="T=null;go('review')">Review missed (${S.missed.length})</button>`:""}</div></div>
    </div></section>
    <section class="panel"><h3>Question by question</h3>
    ${T.qs.map((q,i)=>{ const a=T.ans[i], ok=a===q.a; return `<details class="rv"><summary><span class="dot ${a===null?"skip":ok?"":"no"}"></span>${i+1}. ${TOPICS[q.t].n} <span class="muted mini">· ${a===null?"skipped":ok?"correct":"incorrect"}${T.flag[i]?" · flagged":""}</span></summary>
      <div class="body">${qBody(q)}${choicesHTML(q,a,true,"void")}<div class="fb">${q.e}</div></div></details>`; }).join("")}</section>`;
}

function rReview(){
  if(sess && sess.mode.kind==="review"){ if(!sess.q){ sess=null; } else { app.innerHTML=practiceScreen(); return; } }
  const by={}; S.missed.forEach(m=>{ by[m.t]=(by[m.t]||0)+1; }); const mx=Math.max(1,...Object.values(by));
  app.innerHTML= S.missed.length? `<div class="grid2">
    <section class="panel"><div class="row" style="gap:16px;align-items:center">${ring(1,96,10,String(S.missed.length),"to review","var(--bad)")}
      <div style="flex:1;min-width:180px"><h3 style="margin-bottom:4px">Ready when you are</h3><p class="muted mini">Answer a question correctly and it leaves the list. Miss it again and it stays for another round.</p></div></div>
      <div class="row" style="margin-top:18px"><button class="btn pri lg" onclick="startPractice('review')">${ic("review",18)} Start review</button>
      <button class="btn ghost" onclick="if(confirm('Clear all ${S.missed.length} missed questions?')){S.missed=[];save();renderNav();rReview();}">Clear list</button></div></section>
    <section class="panel"><h3>Missed by topic</h3><table class="prog">${Object.keys(by).sort((a,b)=>by[b]-by[a]).map(k=>`<tr><td>${TOPICS[k].n}</td><td style="width:35%"><div class="bar thin"><i class="r" style="width:${Math.round(100*by[k]/mx)}%"></i></div></td><td class="n"><b>${by[k]}</b></td></tr>`).join("")}</table></section></div>`
  : `<section class="panel" style="text-align:center;padding:48px 24px"><div style="display:grid;place-items:center;margin-bottom:12px"><span class="ti good" style="width:56px;height:56px;border-radius:16px">${ic("check",28)}</span></div>
      <h3 style="font-size:1.2rem">Nothing to review</h3><p class="muted">Questions you miss in Practice or a Timed Test will show up here.</p>
      <div class="row" style="justify-content:center;margin-top:16px"><button class="btn pri" onclick="startPractice('smart')">${ic("bolt",18)} Practice now</button></div></section>`;
}

/* =====================================================================
   FLASHCARDS
   ===================================================================== */
const FC={deck:"vocab",filter:"all",order:[],i:0,edit:false,editCard:null};
function customSet(key){ return typeof key==="string"&&key.startsWith("c:")? (S.custom.find(s=>"c:"+s.id===key)||null) : null; }
function deckList(){ return Object.keys(DECKS).map(k=>({key:k,name:DECK_NAMES[k],custom:false})).concat(S.custom.map(s=>({key:"c:"+s.id,name:s.name,custom:true}))); }
function deckName(key){ return DECK_NAMES[key]||(customSet(key)||{}).name||"Flashcards"; }
function deckCards(key){
  if(DECKS[key]) return DECKS[key];
  const s=customSet(key); if(!s) return [];
  return s.cards.map(c=>({id:c.id,front:`<div class="word cw">${esc(c.f)}</div>`,back:`<div class="def">${esc(c.b)}</div>${c.x?`<div class="ex">${esc(c.x)}</div>`:""}`}));
}
function fcValid(){ if(!DECKS[FC.deck]&&!customSet(FC.deck)){ FC.deck="vocab"; FC.edit=false; FC.editCard=null; FC.order=[]; } }
function fcBuild(shuf){ const d=deckCards(FC.deck), m=S.cards[FC.deck]||{};
  const list=d.filter(c=> FC.filter==="all" || (FC.filter==="learn"&&m[c.id]==="learn") || (FC.filter==="notknown"&&m[c.id]!=="know"));
  FC.order=(shuf?shuffle(list):list).map(c=>c.id); FC.i=0; }
function fcSet(deck){ FC.deck=deck; FC.filter="all"; FC.edit=false; FC.editCard=null; fcValid(); fcBuild(false); rCards(); }
function fcFilter(f){ FC.filter=f; fcBuild(false); rCards(); }
function fcFlip(){ const el=$("card3d"); if(el) el.classList.toggle("flipped"); }
function fcMove(d){ if(!FC.order.length) return; FC.i=(FC.i+d+FC.order.length)%FC.order.length; rCards(); }
function fcMark(v){ if(!FC.order.length) return; const id=FC.order[FC.i]; (S.cards[FC.deck]=S.cards[FC.deck]||{})[id]=v; save(); fcMove(1); }
function fcReset(){ if(confirm(`Reset “know it / still learning” marks for ${deckName(FC.deck)}?`)){ S.cards[FC.deck]={}; save(); fcBuild(false); rCards(); } }

/* ---- your own sets ---- */
function fcNewSet(){
  if(S.custom.length>=50){ toast("You can have up to 50 sets","bad"); return; }
  let n=1; while(S.custom.some(s=>s.name==="My set "+n)) n++;
  const s={id:rid().slice(0,12),name:"My set "+n,cards:[]}; S.custom.push(s); save();
  FC.deck="c:"+s.id; FC.filter="all"; FC.edit=true; FC.editCard=null; FC.order=[]; rCards(); window.scrollTo(0,0);
  setTimeout(()=>{ const el=$("set-name"); if(el){ el.focus(); el.select(); } },30);
}
function fcEditOpen(){ FC.edit=true; FC.editCard=null; rCards(); window.scrollTo(0,0); }
function fcEditClose(){ FC.edit=false; FC.editCard=null; FC.filter="all"; fcBuild(false); rCards(); window.scrollTo(0,0); }
function fcRename(v){ const s=customSet(FC.deck); if(!s) return; v=String(v||"").trim().replace(/\s+/g," ").slice(0,40);
  if(!v){ toast("Give your set a name","bad"); rCards(); return; } s.name=v; save(); rCards(); }
function fcSaveCard(e){
  if(e) e.preventDefault(); const s=customSet(FC.deck); if(!s) return;
  const f=$("cf-f").value.trim().slice(0,200), b=$("cf-b").value.trim().slice(0,400), x=$("cf-x").value.trim().slice(0,200);
  if(!f||!b){ $("cf-err").textContent="Fill in both the front and the back."; return; }
  const ed=FC.editCard&&s.cards.find(c=>c.id===FC.editCard);
  if(ed){ ed.f=f; ed.b=b; ed.x=x; toast("Card updated","good"); }
  else { if(s.cards.length>=500){ $("cf-err").textContent="A set can hold up to 500 cards."; return; } s.cards.push({id:rid().slice(0,12),f,b,x}); toast("Card added","good"); }
  FC.editCard=null; save(); rCards(); const el=$("cf-f"); if(el) el.focus();
}
function fcEditCard(id){ FC.editCard=id; rCards(); const el=$("cf-f"); if(el){ el.scrollIntoView({block:"center",behavior:S.settings.motion?"smooth":"auto"}); el.focus(); } }
function fcDelCard(id){
  const s=customSet(FC.deck); if(!s) return; const c=s.cards.find(x=>x.id===id);
  if(!c||!confirm(`Delete the card “${c.f.slice(0,60)}”?`)) return;
  s.cards=s.cards.filter(x=>x.id!==id); if(S.cards[FC.deck]) delete S.cards[FC.deck][id]; if(FC.editCard===id) FC.editCard=null; save(); rCards();
}
function fcBulk(){
  const s=customSet(FC.deck); if(!s) return;
  const lines=$("cf-bulk").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean); let added=0, skipped=0;
  for(const l of lines){
    const m=l.match(/^(.+?)(?:\t+|\s+[-–—=]+\s+|\s*:\s+)(.+)$/);
    if(!m||s.cards.length>=500){ skipped++; continue; }
    s.cards.push({id:rid().slice(0,12),f:m[1].trim().slice(0,200),b:m[2].trim().slice(0,400),x:""}); added++;
  }
  save(); rCards();
  if(added) toast(`Added ${added} card${added===1?"":"s"}${skipped?` · skipped ${skipped} line${skipped===1?"":"s"}`:""}`,"good");
  else toast("No cards found. Put a dash, colon, or tab between each term and definition.","bad");
}
function fcDeleteSet(){
  const s=customSet(FC.deck); if(!s) return;
  if(!confirm(`Delete the set “${s.name}” and its ${s.cards.length} card${s.cards.length===1?"":"s"}? This cannot be undone.`)) return;
  S.custom=S.custom.filter(x=>x!==s); delete S.cards["c:"+s.id]; save();
  FC.deck="vocab"; FC.edit=false; FC.editCard=null; FC.filter="all"; fcBuild(false); rCards(); toast("Set deleted");
}
function fcEditor(){
  const s=customSet(FC.deck), ed=FC.editCard?s.cards.find(c=>c.id===FC.editCard):null, n=s.cards.length;
  return `<div class="fcwrap">
  <div class="pbar"><button class="btn ghost sm" onclick="fcEditClose()">${ic("back",16)} ${n?"Study this set":"Back to flashcards"}</button><span class="pill">${n} card${n===1?"":"s"}</span></div>
  <section class="panel"><label class="fl">Set name<input class="inp" id="set-name" value="${esc(s.name)}" maxlength="40" onchange="fcRename(this.value)"></label></section>
  <section class="panel"><h3>${ed?"Edit card":"Add a card"}</h3>
    <form onsubmit="fcSaveCard(event)" novalidate style="display:grid;gap:12px">
      <div class="two"><label class="fl"><span>Front <em>term or question</em></span><textarea class="inp" id="cf-f" rows="3" maxlength="200">${ed?esc(ed.f):""}</textarea></label>
      <label class="fl"><span>Back <em>definition or answer</em></span><textarea class="inp" id="cf-b" rows="3" maxlength="400">${ed?esc(ed.b):""}</textarea></label></div>
      <label class="fl"><span>Example or hint <em>optional</em></span><input class="inp" id="cf-x" maxlength="200" value="${ed?esc(ed.x):""}"></label>
      <p class="err" id="cf-err" role="alert"></p>
      <div class="row"><button class="btn pri" type="submit">${ic(ed?"check":"plus",16)} ${ed?"Save changes":"Add card"}</button>${ed?`<button class="btn ghost" type="button" onclick="FC.editCard=null;rCards()">Cancel</button>`:""}</div>
    </form></section>
  <section class="panel"><details class="paste"><summary>${ic("upload",16)} <b>Paste a list</b> <span class="muted mini">· add many cards at once</span></summary>
    <p class="muted mini" style="margin:10px 0 8px">One card per line. Put a dash, a colon, or a tab between the term and its definition.</p>
    <textarea class="inp" id="cf-bulk" rows="6" placeholder="ubiquitous - found everywhere&#10;photosynthesis: how plants turn light into food&#10;mitochondria — the powerhouse of the cell"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn" onclick="fcBulk()">${ic("plus",16)} Add these cards</button></div></details></section>
  <section class="panel"><h3>Cards in this set</h3>
    ${n?`<div class="clist">${s.cards.map((c,i)=>`<div class="citem ${FC.editCard===c.id?"on":""}"><span class="cn">${i+1}</span><div class="ct"><b>${esc(c.f)}</b><span>${esc(c.b)}</span></div><button class="btn ghost sm" onclick="fcEditCard('${c.id}')">Edit</button><button class="btn ghost sm" onclick="fcDelCard('${c.id}')" aria-label="Delete card">${ic("trash",15)}</button></div>`).join("")}</div>`
      :`<p class="muted mini">No cards yet. Add your first one above, or paste a whole list.</p>`}
  </section>
  <div class="row between"><span class="muted mini">Your sets are saved with your profile and included in backups.</span><button class="btn bad sm" onclick="fcDeleteSet()">${ic("trash",15)} Delete this set</button></div></div>`;
}
function rCards(){
  fcValid();
  const cs=customSet(FC.deck);
  if(FC.edit&&cs){ app.innerHTML=fcEditor(); return; }
  FC.edit=false;
  if(!FC.order.length && FC.filter==="all") fcBuild(false);
  const d=deckCards(FC.deck), m=S.cards[FC.deck]||{};
  const card=FC.order.length? d.find(c=>c.id===FC.order[FC.i]) : null; const st=card?m[card.id]:null;
  const stp=st?`<span class="pillst ${st}">${st==="know"?"Know it":"Still learning"}</span>`:"";
  app.innerHTML=`<div class="fcwrap">
    <div class="decks">${deckList().map(dk=>{ const k=dk.key, cards=deckCards(k), mm=S.cards[k]||{}, kn=cards.filter(c=>mm[c.id]==="know").length;
      return `<button class="deck ${FC.deck===k?"on":""}" onclick="fcSet('${k}')"><b>${esc(dk.name)}</b><small>${dk.custom?`Your set · `:""}${kn}/${cards.length} known</small><div class="bar thin"><i class="g" style="width:${cards.length?Math.round(100*kn/cards.length):0}%"></i></div></button>`; }).join("")}
      <button class="deck new" onclick="fcNewSet()">${ic("plus",18)}<b>New set</b><small>Make your own cards</small></button></div>
    <div class="row between"><div class="seg">${[["all","All"],["notknown","Not known yet"],["learn","Still learning"]].map(([k,l])=>`<button class="${FC.filter===k?"on":""}" onclick="fcFilter('${k}')">${l}</button>`).join("")}</div>
      <span class="row" style="gap:6px">${cs?`<button class="btn sm" onclick="fcEditOpen()">${ic("practice",15)} Edit set</button>`:""}<button class="btn sm ghost" onclick="fcBuild(true);rCards()">${ic("shuffle",15)} Shuffle</button><button class="btn sm ghost" onclick="fcReset()">Reset</button></span></div>
    ${card?`<div class="card3d" id="card3d" tabindex="0" onclick="fcFlip()" role="button" aria-label="Flip card">
      <div class="inner"><div class="face front"><span class="lbl">${esc(deckName(FC.deck))} · ${FC.i+1}/${FC.order.length}</span><span class="st">${stp}</span>${card.front}<div class="fliphint">${S.settings.hints?"Tap or press Space to flip":"Tap to flip"}</div></div>
      <div class="face back"><span class="lbl">Answer</span><span class="st">${stp}</span>${card.back}</div></div></div>
      <div class="fcctl"><button class="btn" onclick="fcMove(-1)" aria-label="Previous card">${ic("back",16)}</button><button class="btn bad" onclick="fcMark('learn')">Still learning${S.settings.hints?" <kbd>L</kbd>":""}</button><button class="btn good" onclick="fcMark('know')">Know it${S.settings.hints?" <kbd>K</kbd>":""}</button><button class="btn" onclick="fcMove(1)" aria-label="Next card">${ic("arrow",16)}</button></div>`
    : cs&&!cs.cards.length? `<section class="panel" style="text-align:center;margin-top:16px"><h3>“${esc(cs.name)}” is empty</h3><p class="muted">Add some cards to start studying this set.</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn pri" onclick="fcEditOpen()">${ic("plus",16)} Add cards</button></div></section>`
    :`<section class="panel" style="text-align:center;margin-top:16px"><p class="muted">${FC.filter==="learn"?"No cards marked “still learning” yet. Mark cards as you study to build a focused pile.":"You know every card in this deck. Nice work!"}</p><button class="btn" onclick="fcFilter('all')">Show all cards</button></section>`}
  </div>`;
}

function rProgress(){
  const t=totals(), te=totals("E"), tm=totals("M");
  const days=[]; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push([d,S.days[dkey(d)]||0,i===0]); }
  const mx=Math.max(goal(),5,...days.map(x=>x[1]));
  const row=k=>{ const s=S.stats[k], a=acc(k); return `<tr><td>${TOPICS[k].n}</td><td style="width:34%"><div class="bar thin"><i class="${barCls(a)}" style="width:${a||0}%"></i></div></td><td class="n"><b>${s&&s.n?a+"%":"—"}</b></td><td class="n muted">${s?s.c+"/"+s.n:"0/0"}</td><td class="n"><button class="btn sm ghost" onclick="startPractice('topic','${k}')" aria-label="Practice ${TOPICS[k].n}">${ic("arrow",15)}</button></td></tr>`; };
  const lastT=S.tests[S.tests.length-1];
  app.innerHTML=`<div class="tiles">
    ${tile("check","Total answered",t.n,`${t.p}% accuracy`)}
    ${tile("flame","Day streak",dayStreak(),"consecutive days","hot")}
    ${tile("trophy","Answer streak",S.streak.cur,`Best ever: ${S.streak.best}`,"good")}
    ${tile("test","Tests taken",S.tests.length,lastT?`Last: ${Math.round(100*lastT.c/lastT.n)}%`:"None yet","eng")}
  </div>
  <section class="panel"><div class="ph"><h3>Last 14 days</h3><span class="muted mini">Daily goal: ${goal()}</span></div>
    <div class="chart">${days.map(([d,n,isT])=>`<div class="c ${isT?"today":""}" title="${dkey(d)}: ${n} question${n===1?"":"s"}"><i style="height:${Math.round(100*n/mx)}%;${n>=goal()?"background:var(--good)":""}"></i><span>${d.getDate()}</span></div>`).join("")}</div></section>
  <div class="grid2">
    <section class="panel"><div class="ph"><h3>English</h3><b>${te.n?te.p+"%":"—"}</b></div><table class="prog">${ETOP.map(row).join("")}</table></section>
    <section class="panel"><div class="ph"><h3>Math</h3><b>${tm.n?tm.p+"%":"—"}</b></div><table class="prog">${MTOP.map(row).join("")}</table></section>
  </div>
  <section class="panel" style="margin-top:var(--gap)"><h3>Flashcards</h3>${deckList().map(dk=>{ const k=dk.key, cs=deckCards(k), mm=S.cards[k]||{}, kn=cs.filter(c=>mm[c.id]==="know").length, p=cs.length?Math.round(100*kn/cs.length):0;
    return `<div class="sline" style="grid-template-columns:130px 1fr 70px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(dk.name)}</span><div class="bar"><i class="g" style="width:${p}%"></i></div><span class="n">${kn}/${cs.length}</span></div>`; }).join("")}</section>`;
}

const TBASE={punc:.45,sva:.35,pron:.4,mod:.55,para:.45,tense:.35,trans:.45,wic:.55,synth:.55,read:.6,conc:.4,evid:.65,
  lin:.3,sys:.45,quad:.6,func:.55,expo:.6,poly:.7,pct:.4,stat:.5,prob:.5,geo:.55,trig:.7,word:.5};
function plain(s){ return String(s||"").replace(/<[^>]*>/g," ").replace(/\s+/g," "); }
function qDiff(q){
  if(q._d!=null) return q._d;
  const L=plain(q.p).length+(q.s==="E"&&/^Which choice/.test(q.q)?0:plain(q.q).length)+q.c.reduce((n,c)=>n+plain(c).length,0);
  const nums=q.s==="M"? Math.min(.15,(plain(q.q).match(/\d+/g)||[]).length*.012) : 0;
  return q._d=Math.max(.15,Math.min(1,(TBASE[q.t]||.5)+Math.min(.3,Math.max(0,L-120)/1400)+nums));
}
let RCTX={secs:0,src:0};   // src: 0 practice, 1 timed test, 2 full test

function median(a){ if(!a.length) return 0; const s=a.slice().sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

/* ---- a small item-response model: ability (theta) from right/wrong answers at known difficulty ---- */
const IRT_A=1.7;
function bOf(d){ return (d-.55)*5; }
function pCorr(th,b){ return .25+.75/(1+Math.exp(-IRT_A*(th-b))); }
function estTheta(items,pvar){
  const pv=1/(pvar||1.44); let th=0;
  for(let it=0;it<40;it++){ let g=-th*pv, h=-pv;
    for(const [b,ok,w] of items){ const s=1/(1+Math.exp(-IRT_A*(th-b))), P=.25+.75*s, dP=.75*IRT_A*s*(1-s);
      g+=w*(ok-P)*dP/(P*(1-P)); h-=w*dP*dP/(P*(1-P)); }
    const step=g/h; th=clamp(th-step,-4,4); if(Math.abs(step)<1e-4) break; }
  let info=pv; for(const [b,,w] of items){ const s=1/(1+Math.exp(-IRT_A*(th-b))), P=.25+.75*s, dP=.75*IRT_A*s*(1-s); info+=w*dP*dP/(P*(1-P)); }
  return {th,se:1/Math.sqrt(info)};
}
function satSecRaw(th){ return clamp(540+125*th,200,800); }
const r10=x=>Math.round(x/10)*10;
function r5(x){ return Math.round(x/5)*5; }

/* =====================================================================

   ===================================================================== */
const BP={ // share of each test section that each topic represents
  satE:{wic:.2,read:.21,evid:.13,punc:.08,sva:.04,pron:.03,mod:.04,para:.03,tense:.04,trans:.1,synth:.07,conc:.03},
  satM:{lin:.2,sys:.15,quad:.1,func:.1,expo:.07,poly:.08,pct:.05,stat:.04,prob:.03,word:.03,geo:.09,trig:.06},
  actE:{punc:.17,sva:.06,pron:.05,mod:.06,para:.05,tense:.05,trans:.14,synth:.12,conc:.14,wic:.08,read:.08},
  actM:{pct:.09,lin:.1,sys:.06,quad:.1,poly:.06,func:.1,expo:.06,geo:.16,trig:.07,stat:.08,prob:.07,word:.05},
  actR:{read:.45,evid:.25,wic:.2,synth:.1},
  actS:{evid:.45,stat:.35,read:.1,expo:.1}
};
// how much tighter each ACT section's clock is than the SAT's, after allowing for shorter ACT items
const TIGHT={E:1.27,M:1.28,R:1.17,S:1.3};
const CC_ACT=[36,35,34,33,32,31,30,29,28,27,26,25,24,23,22,21,20,19,18,17,16,15,14,13,12,11,10,9];
const CC_SAT=[1590,1540,1500,1460,1430,1400,1370,1340,1310,1280,1240,1210,1180,1140,1110,1080,1040,1010,970,930,890,850,800,760,710,670,630,590];
function actFromSat(s){
  if(s>=1590) return 36; if(s<=590) return Math.max(1,9-(590-s)/23.75);
  for(let i=0;i<CC_SAT.length-1;i++) if(s>=CC_SAT[i+1]) return CC_ACT[i+1]+(s-CC_SAT[i+1])/(CC_SAT[i]-CC_SAT[i+1]);
  return 9;
}
function satFromAct(a){
  if(a>=36) return 1590; if(a<=9) return Math.max(400,590-(9-a)*23.75);
  const i=CC_ACT.findIndex(x=>x<=a); if(CC_ACT[i]===a) return CC_SAT[i];
  return CC_SAT[i]+(a-CC_ACT[i])*(CC_SAT[i-1]-CC_SAT[i]);
}
const SAT_PCT=[[400,1],[600,1],[700,3],[800,10],[900,23],[1000,40],[1100,58],[1200,74],[1300,87],[1400,94],[1500,98],[1600,99]];
const ACT_PCT=[[1,1],[12,1],[14,9],[16,24],[18,38],[20,51],[22,63],[24,74],[26,82],[28,88],[30,93],[32,97],[34,99],[36,99]];
function pctile(tab,x){ for(let i=1;i<tab.length;i++) if(x<=tab[i][0]){ const [a,pa]=tab[i-1],[b,pb]=tab[i]; return Math.round(pa+(pb-pa)*(x-a)/(b-a)); } return 99; }
function ordinal(n){ const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function smoothAcc(ts){ let n=0,c=0; for(const t of ts){ const s=S.stats[t]; if(s){ n+=s.n; c+=s.c; } } return {n,c,p:(c+3*.6)/(n+3)}; }

function gatherItems(){
  const now=dayNum(), H=S.hist||[], sec={E:[],M:[]}, top={}, hn={}, hc={};
  for(const r of H){ const t=TKEYS[r[1]]; if(!t) continue;
    const w=Math.pow(.5,Math.max(0,now-r[0])/30)*(r[5]===2?1.5:r[5]===1?1.2:1), it=[bOf(r[4]/100),r[2],w];
    sec[TOPICS[t].s].push(it); (top[t]=top[t]||[]).push(it); hn[t]=(hn[t]||0)+1; hc[t]=(hc[t]||0)+r[2]; }
  // answers from before history was kept: count them at the topic's typical difficulty
  for(const t in S.stats){ const st=S.stats[t], nl=Math.max(0,st.n-(hn[t]||0)); if(!nl) continue;
    const cl=clamp(st.c-(hc[t]||0),0,nl), b=bOf(TBASE[t]+.08), a=[[b,1,.6*cl],[b,0,.6*(nl-cl)]].filter(x=>x[2]>0);
    sec[TOPICS[t].s].push(...a); (top[t]=top[t]||[]).push(...a); }
  return {sec,top};
}
function paceInfo(){
  const L={E:[],M:[]}, out={};
  for(const f of (S.full||[]).slice(-4)) for(const m of (f.mods||[])) if(m.secs>0&&m.n&&L[m.s]) L[m.s].push(m.used/m.secs*m.n/Math.max(1,m.ans));
  for(const t of S.tests.slice(-8)) if(t.secs>0&&t.used!=null){ const r=t.used/t.secs*t.n/Math.max(1,t.n-(t.un||0)); if(t.mix!=="M") L.E.push(r); if(t.mix!=="E") L.M.push(r); }
  for(const s of ["E","M"]){
    const xs=(S.hist||[]).filter(h=>h[5]===0&&h[3]>=3&&TKEYS[h[1]]&&TOPICS[TKEYS[h[1]]].s===s).slice(-150).map(h=>h[3]), psec=xs.length>=10?median(xs):null;
    if(L[s].length) out[s]={r:median(L[s]),src:"timed",n:L[s].length,psec};
    else if(xs.length>=15) out[s]={r:psec*.8/(s==="E"?71:95),src:"practice",n:xs.length,psec};
    else out[s]={r:.8,src:"none",n:0,psec};
  }
  return out;
}
function paceAdj(th,r){
  if(!r||r<=.92) return th;
  const comp=.92/r, np=pCorr(th,0)*comp+.25*(1-comp), s=clamp((np-.25)/.75,.01,.99);
  return Math.min(th,Math.log(s/(1-s))/IRT_A);
}
function predict(){
  const G=gatherItems(), tE=totals("E"), tM=totals("M"), n=tE.n+tM.n;
  const th={E:estTheta(G.sec.E),M:estTheta(G.sec.M)}, res={};
  for(const t of TKEYS){ const it=G.top[t]; if(!it||!it.length){ res[t]={r:0,w:0}; continue; }
    const T0=th[TOPICS[t].s].th; let num=0,den=0; for(const [b,ok,w] of it){ num+=w*(ok-pCorr(T0,b)); den+=w; }
    res[t]={r:num/(den+6),w:den}; }
  const pace=paceInfo();
  const sect=(bp,r)=>{ let base=0,adj=0,unc=0,se=0;
    for(const t in bp){ const w=bp[t], s=TOPICS[t].s; base+=w*th[s].th; se+=w*th[s].se; adj+=w*res[t].r*3.2; if(res[t].w<3) unc+=w; }
    return {th:paceAdj(base+adj,r),se:Math.sqrt(se*se+(.5*unc)**2+.04)}; };
  const sE=sect(BP.satE,pace.E.r), sM=sect(BP.satM,pace.M.r);
  const rw=r10(satSecRaw(sE.th)), m=r10(satSecRaw(sM.th)), total=rw+m, satRaw=satSecRaw(sE.th)+satSecRaw(sM.th);
  const sd=125*Math.sqrt(sE.se*sE.se+sM.se*sM.se)*.8;
  const aE=sect(BP.actE,pace.E.r*TIGHT.E), aM=sect(BP.actM,pace.M.r*TIGHT.M), aR=sect(BP.actR,pace.E.r*TIGHT.R), aS=sect(BP.actS,(pace.E.r+pace.M.r)/2*TIGHT.S);
  const ac=(x,k)=>actFromSat(2*satSecRaw(x.th+(k||0)*x.se*.6));
  const actRaw=(ac(aE)+ac(aM)+ac(aR))/3, comp=clamp(Math.round(actRaw),1,36);
  const actLo=clamp(Math.round((ac(aE,-1)+ac(aM,-1)+ac(aR,-1))/3),1,36), actHi=clamp(Math.round((ac(aE,1)+ac(aM,1)+ac(aR,1))/3),1,36);
  const cov=TKEYS.filter(t=>S.stats[t]&&S.stats[t].n>=5).length, nt=S.tests.length, nf=(S.full||[]).length;
  const conf=Math.round(Math.min(1,n/400)*45+cov/TKEYS.length*25+Math.min(1,nt/3)*15+Math.min(1,nf)*15);
  return {n,cov,nt,nf,conf,th,res,pace,
    sat:{total,rw,m,raw:satRaw,lo:clamp(r10(total-sd),400,1600),hi:clamp(r10(total+sd),400,1600)},
    act:{comp,raw:actRaw,lo:Math.min(actLo,comp),hi:Math.max(actHi,comp),e:clamp(Math.round(ac(aE)),1,36),m:clamp(Math.round(ac(aM)),1,36),r:clamp(Math.round(ac(aR)),1,36),s:clamp(Math.round(ac(aS)),1,36)}};
}
function gains(pr){
  return TKEYS.map(t=>{ const a=smoothAcc([t]), w=(BP.satE[t]||0)+(BP.satM[t]||0), g=125*3.2*w*clamp(.92-a.p,0,.25);
    return {t,g,a,w}; }).filter(x=>x.g>=4).sort((x,y)=>y.g-x.g).slice(0,4);
}
function projection(pr){
  const cd=countdown(); if(cd===null||cd<=0) return null;
  let wk=0; for(let i=0;i<14;i++){ const d=new Date(); d.setDate(d.getDate()-i); wk+=S.days[dkey(d)]||0; } wk/=2;
  const weeks=cd/7, per=Math.min(15,wk*.08); let g=0;
  for(let i=0;i<Math.ceil(weeks);i++) g+=per*Math.pow(.94,i)*Math.min(1,weeks-i);
  g=r10(Math.min(g,200,1600-pr.sat.total));
  return {cd,wk:Math.round(wk),gain:g,sat:pr.sat.total+g,act:clamp(Math.round(pr.act.raw+actFromSat(pr.sat.raw+g)-actFromSat(pr.sat.raw)),1,36)};
}
function logPred(pr){
  const p=S.plog||(S.plog={}), d=today(), v=[pr.sat.total,pr.act.comp];
  if(p[d]&&p[d][0]===v[0]&&p[d][1]===v[1]) return;
  p[d]=v; const ks=Object.keys(p).sort(); while(ks.length>120) delete p[ks.shift()]; save();

/* =====================================================================
   FULL PRACTICE TEST  (4 modules, Module 2 of each section is harder)

const FT_LEN={full:{E:27,M:22,l:"Full length"},half:{E:14,M:11,l:"Half length"},quick:{E:7,M:6,l:"Quick"}};
const FT_PER={E:1920/27,M:2100/22};
const RW_DOM=[["wic","read"],["read","evid"],["punc","sva","pron","mod","para","tense"],["trans","synth","conc"]], RW_SH=[.28,.26,.26,.2];
const M_DOM=[["lin","sys"],["quad","func","expo","poly"],["pct","stat","prob","word"],["geo","trig"]], M_SH=[.35,.35,.15,.15];
let ftCfg={len:"full",adapt:false}, FT=null, ftTimer=null;
function secName(s){ return s==="E"?"Reading and Writing":"Math"; }
function lvName(l){ return l==="hard"?"Harder":l==="easy"?"Easier":"Standard"; }
function ftSecs(s,n){ return Math.round(n*FT_PER[s]*(Number(S.settings.timeMult)||1)); }
const TDC={};
function topicDiff(t){ if(TDC[t]) return TDC[t]; const ds=BANK.filter(q=>q.t===t).slice(0,20).map(q=>qDiff(Object.assign({},q))), g=GEN[t]||[];
  for(let i=0;i<20&&g.length;i++){ try{ ds.push(qDiff(pick(g)())); }catch(e){} } return TDC[t]=ds.length?median(ds):TBASE[t]; }
function tmplKey(q){ return (plain(q.p)+"|"+plain(q.q)).replace(/\d[\d,.]*/g,"#").slice(0,42); }
function ftTopics(s,n,level){
  const doms=s==="E"?RW_DOM:M_DOM, sh=s==="E"?RW_SH:M_SH, cnt=sh.map(x=>Math.floor(x*n));
  let rem=n-cnt.reduce((a,b)=>a+b,0); for(let i=0;rem>0;i=(i+1)%4,rem--) cnt[i]++;
  const out=[]; doms.forEach((d,i)=>{ for(let k=0;k<cnt[i];k++) out.push(wpick(d,d.map(t=>level==="hard"?Math.pow(topicDiff(t),s==="M"?6:4):level==="easy"?Math.pow(1.1-topicDiff(t),3):1))); });
  return out;
}
function ftDraw(t,seen,level){
  const all=BANK.filter(q=>q.t===t), hs=new Set(S.seenQ||[]), fresh=all.filter(q=>!seen.has(q.id)&&!hs.has(q.id)), gens=GEN[t]||[], recent=new Set(S.recentSig||[]);
  const want=level==="std"?1:7, cands=[];
  for(let i=0;i<24&&cands.length<want;i++){
    const late=i>=18;
    if(fresh.length&&(!gens.length||Math.random()<.4)){ const q=pick(fresh); if(!cands.includes(q)&&(late||!FT.stems.has(tmplKey(q)))) cands.push(q); }
    else if(gens.length){ let c=null; try{ c=pick(gens)(); }catch(e){ c=null; } if(c&&!recent.has(qsig(c))&&!seen.has(qsig(c))&&(late||!FT.stems.has(tmplKey(c)))) cands.push(c); }
  }
  if(!cands.length){ const pool=all.filter(b=>!seen.has(b.id)), src=pool.length?pool:all, h=S.seenQ||[]; cands.push(src.slice().sort((a,b)=>h.indexOf(a.id)-h.indexOf(b.id))[0]); }
  cands.sort((a,b)=>qDiff(a)-qDiff(b));
  const q= level==="hard"?cands[cands.length-1] : level==="easy"?cands[0] : cands[0];
  rememberQ(q); seen.add(q.gen?qsig(q):q.id); FT.stems.add(tmplKey(q));
  const p=prep(q); p._d=qDiff(q); return p;
}
function ftBuild(m){
  const seen=FT.seen; m.qs=ftTopics(m.s,m.n,m.level).map(t=>ftDraw(t,seen,m.level));
  if(m.s==="M") m.qs.sort((a,b)=>a._d-b._d);

}
function ftStop(){ if(ftTimer){ clearInterval(ftTimer); ftTimer=null; } }
function ftNew(){
  const L=FT_LEN[ftCfg.len];

    mods:[["E",1],["E",2],["M",1],["M",2]].map(([s,no])=>({s,no,n:L[s],level:no===1?"std":ftCfg.adapt?null:"hard",secs:ftSecs(s,L[s])}))};

}
function ftStartModule(){
  const m=FT.mods[FT.cur];

  if(!m.qs) ftBuild(m);

}
function ftTick(){
  if(!FT){ ftStop(); return; }
  const el=$("ftv");

    if(el&&S.settings.showTimer){ el.textContent=fmtTime(left); const t=$("fttimer"); if(t) t.classList.toggle("low",left<60); }
    if(left<=0) ftSubmit(true); }

  else ftStop();
}
function ftAns(i){ if(!FT||FT.phase!=="q") return; const m=FT.mods[FT.cur]; m.ans[m.idx]=i; render(); }
function ftGo(i){ if(!FT||FT.phase!=="q") return; const m=FT.mods[FT.cur]; m.idx=clamp(i,0,m.qs.length-1); render(); }
function ftFlag(){ if(!FT||FT.phase!=="q") return; const m=FT.mods[FT.cur]; m.flag[m.idx]=!m.flag[m.idx]; render(); }
function ftSubmit(auto){
  if(!FT||FT.phase!=="q") return; const m=FT.mods[FT.cur];
  if(!auto){ const un=m.ans.filter(a=>a===null).length; if(un&&!confirm(`You have ${un} unanswered question${un>1?"s":""} in this module. You can’t come back to it after you submit. Submit anyway?`)) return; }
  ftStop(); m.used=Math.min(m.secs,Math.round((Date.now()-m.start)/1000)); m.c=m.qs.filter((q,i)=>m.ans[i]===q.a).length; m.done=true;
  const before=S.days[today()]||0;

  save();

  if(before<goal()&&(S.days[today()]||0)>=goal()) goalReached(); else syncReminder(true);
  renderNav(); render(); window.scrollTo(0,0);
}
function ftSecScore(s){
  const ms=FT.mods.filter(m=>m.s===s), items=[];
  ms.forEach(m=>m.qs.forEach((q,i)=>items.push([bOf(q._d!=null?q._d:qDiff(q)),m.ans[i]===q.a?1:0,1])));
  let sc=r10(satSecRaw(estTheta(items).th)); if(ms[1].level==="easy") sc=Math.min(sc,640); return sc;
}
function ftFinish(){
  FT.phase="done"; FT.rw=ftSecScore("E"); FT.m=ftSecScore("M"); FT.total=FT.rw+FT.m;
  const f=S.full||(S.full=[]);
  f.push({d:today(),len:FT.len,adapt:FT.adapt,rw:FT.rw,m:FT.m,total:FT.total,mods:FT.mods.map(m=>({s:m.s,no:m.no,lv:m.level,n:m.qs.length,c:m.c,ans:m.ans.filter(a=>a!==null).length,used:m.used,secs:m.secs}))});

function ftModCard(s,no,level,n,cur,done){

function dzFin(q,steps){ q.dz=steps; q.dzq=true; q.e+=`<div class="dzway"><b>With Desmos:</b>${steps}</div>`; return q; }
const DZ_GROUPS=[["all","All"],["sys","Systems"],["quad","Quadratics"],["eq","Equations"],["fg","Functions &amp; circles"],["data","Data &amp; inequalities"]];

/* systems: read the intersection */
dzReg("sys",()=>{
  const x=nz(-9,9), y=nz(-9,9); let a1,b1,a2,b2;
  do{ a1=nz(-7,9); b1=nz(-7,9); a2=nz(-7,9); b2=nz(-7,9); }while(Math.abs(a1*b2-a2*b1)<5);
  const c1=a1*x+b1*y, c2=a2*x+b2*y, ask=pick(["x","y"]), ans=ask==="x"?x:y;
  const steps=dzSteps([`Type the first equation exactly as written: ${dzc(aLin(a1,b1,c1))}`,`Type the second one on a new line: ${dzc(aLin(a2,b2,c2))}`,
    `Click where the two lines cross. Desmos shows the point (${fmt(x)}, ${fmt(y)}).`,`The ${ask}-coordinate is <b>${fmt(ans)}</b>.`]);
  return dzFin(mk("sys",`What is the value of ${ask} in the solution (x, y) to the system of equations above?`,fmt(ans),[fmt(ask==="x"?y:x),fmt(-ans),fmt(x+y)],
    `<b>By hand:</b> eliminate one variable (multiply so one variable cancels, then add). The solution is x = ${fmt(x)}, y = ${fmt(y)}.`,
    `<div class="eqs">${lin2(a1,b1,c1)}<br>${lin2(a2,b2,c2)}</div>`),steps);
});
/* systems: slider for "no solution" */
dzReg("sys",()=>{
  const a1=ri(2,6), t=pick([2,3,4]), k=nz(-6,9), c1=nz(-9,12); let c2; do{ c2=nz(-20,30); }while(c2===c1*t);
  const steps=dzSteps([`Type the first equation with the letter k: ${dzc(`${a1}x+ky=${c1}`)}. Desmos asks “add slider: k”. Click <b>k</b> to add it.`,
    `Type the second equation: ${dzc(aLin(a1*t,k*t,c2))}`,`Drag the k slider (or click its number and type values) until the two lines are parallel and never cross.`,
    `That happens at k = <b>${fmt(k)}</b>.`]);
  return dzFin(mk("sys",`In the system of equations above, k is a constant. For what value of k does the system have no solution?`,fmt(k),[fmt(k*t),fmt(-k),fmt(k+t)],
    `<b>By hand:</b> no solution means the lines are parallel: the x and y coefficients are in the same ratio. ${a1*t} ÷ ${a1} = ${t}, so k × ${t} must equal ${fmt(k*t)}, giving k = ${fmt(k)}. (The constants ${fmt(c1)} × ${t} ≠ ${fmt(c2)}, so the lines are not the same line.)`,
    `<div class="eqs">${a1}x + ky = ${fmt(c1)}<br>${lin2(a1*t,k*t,c2)}</div>`),steps);
});
/* quadratics: zeros */
dzReg("quad",()=>{
  const d=pick([2,3,4]); let n; do{ n=nz(-11,11); }while(n%d===0); const r1=nz(-7,7), r2=n/d;
  const cs=[d,-(n+d*r1),n*r1], big=Math.max(r1,r2), small=Math.min(r1,r2), F=v=>v===r2?frac(n,d):fmt(v), ask=pick(["greater","lesser"]), ans=ask==="greater"?big:small, oth=ans===big?small:big;
  const steps=dzSteps([`Type the left side as a graph: ${dzc("y="+aPoly(cs))}`,`${CLICK} The solutions are the x-intercepts (where y = 0).`,
    `Desmos shows x = ${dec(small)} and x = ${dec(big)}.`,`The ${ask} solution is ${dec(ans)}${ans===r2?`, which is <b>${frac(n,d)}</b>. (Desmos shows decimals, so match ${dec(r2)} to ${frac(n,d)}.)`:`, so the answer is <b>${fmt(ans)}</b>.`}`]);
  return dzFin(mk("quad",`What is the ${ask} solution to the equation above?`,F(ans),[F(oth),F(-ans),F(-oth)],
    `<b>By hand:</b> factor: ${fac(r1)}(${d}x ${n<0?"+ "+(-n):MN+" "+n}) = 0, so x = ${fmt(r1)} or x = ${frac(n,d)}. The ${ask} one is ${F(ans)}.`,
    `<div class="eqs">${poly(cs)} = 0</div>`),steps);

/* quadratics: vertex */
dzReg("quad",()=>{
  const a=-pick([1,2,3]), h=nz(-5,6), k=nz(-12,20), cs=[a,-2*a*h,a*h*h+k], ask=pick(["max","x"]);

    `<b>By hand:</b> the vertex is at x = −b/(2a) = ${fmt(-cs[1])}/${paren(2*a)} = ${fmt(h)}, and f(${fmt(h)}) = ${fmt(k)}. Because a is negative, the parabola opens down, so this is the maximum.`,
    `<div class="eqs">f(x) = ${poly(cs)}</div>`),steps);

/* quadratics: how many intersections */
dzReg("quad",()=>{
  let b,m; do{ b=nz(-6,6); m=nz(-4,4); }while((b-m)%2!==0);
  const c=ri(-6,8), want=pick([0,1,2]), base=c-((b-m)**2)/4, kk= want===1?base : want===2? base+ri(1,8) : base-ri(1,8);
  const D=(b-m)**2-4*(c-kk);
  const steps=dzSteps([`Type ${dzc("y="+aPoly([1,b,c]))}`,`Type ${dzc("y="+aPoly([m,kk]))}`,
    `Count the points where the line meets the parabola. Zoom out (pinch, or press the − button) to be sure none are off screen.`,
    `There ${want===1?"is":"are"} <b>${want}</b> crossing point${want===1?"":"s"}${want===1?" (the line just touches the parabola)":""}.`]);
  return dzFin(mk("quad",`How many solutions does the system of equations above have?`,String(want),["0","1","2","Infinitely many"].filter(s=>s!==String(want)),
    `<b>By hand:</b> set them equal: x² ${b-m<0?MN:"+"} ${Math.abs(b-m)}x ${c-kk<0?MN:"+"} ${Math.abs(c-kk)} = 0. The discriminant is ${fmt(D)}, which is ${D>0?"positive, so there are 2 solutions":D===0?"zero, so there is 1 solution":"negative, so there are no real solutions"}.`,
    `<div class="eqs">y = ${poly([1,b,c])}<br>y = ${poly([m,kk])}</div>`),steps);
});
/* equations: count solutions of a cubic */
dzReg("eq",()=>{
  const A=pick([3,12,27]), s=Math.sqrt(A/3), M=2*A/3*s, want=pick([1,2,3]);
  const kv= want===3? ri(-(M-1),M-1) : want===2? pick([M,-M]) : (M+ri(1,10))*pick([1,-1]);
  const steps=dzSteps([`Graph the left side: ${dzc("y="+aPoly([1,0,-A,0]))}`,`Graph the right side: ${dzc("y="+kv)}`,
    `${Math.abs(kv)>8?"The line is high up, so zoom out or use the wrench (Graph Settings) to raise the y-range. ":""}Count where the two graphs meet.`,
    `They meet <b>${want}</b> time${want===1?"":"s"}, so there ${want===1?"is":"are"} ${want} real solution${want===1?"":"s"}.`]);
  return dzFin(mk("poly",`How many distinct real solutions does the equation above have?`,String(want),["0","1","2","3"].filter(x=>x!==String(want)),
    `<b>By hand (hard!):</b> y = x³ − ${A}x has a peak of ${fmt(M)} at x = ${fmt(-s)} and a valley of ${fmt(-M)} at x = ${fmt(s)}. A horizontal line y = k crosses it 3 times if ${fmt(-M)} < k < ${fmt(M)}, 2 times if k = ±${fmt(M)}, and once otherwise. Here k = ${fmt(kv)}. Desmos makes this much faster.`,
    `<div class="eqs">${poly([1,0,-A,0])} = ${fmt(kv)}</div>`),steps);
});
/* equations: exponential */
dzReg("eq",()=>{
  const c=pick([2,3,4,5]), b=pick([2,3]), n=ri(2,b===2?6:4), d=ri(0,3), val=c*b**n, ans=n+d;
  const ex=d?`x − ${d}`:"x", aex=d?`(x-${d})`:"x";
  const steps=dzSteps([`Graph the left side (use ^ for the exponent and parentheses around it): ${dzc(`y=${c}*${b}^${aex}`)}`,`Graph the right side: ${dzc(`y=${val}`)}`,
    `${val>10?"The line is above the default view, so zoom out or set the y-range with the wrench. ":""}Click the intersection.`,`Desmos shows (${ans}, ${val}), so x = <b>${ans}</b>.`]);
  return dzFin(mk("expo",`What value of x satisfies the equation above?`,String(ans),[String(n),String(ans+1),String(Math.max(0,ans-2))],
    `<b>By hand:</b> divide both sides by ${c}: ${b}<sup>${ex}</sup> = ${val/c} = ${b}<sup>${n}</sup>. So ${ex} = ${n}${d?` and x = ${ans}`:""}.`,
    `<div class="eqs">${c}(${b})<sup>${ex}</sup> = ${val}</div>`),steps);
});
/* data: table + regression */
dzReg("data",()=>{
  const m=nz(-4,5), b0=ri(-10,10), st=pick([1,2,3]), x0=ri(-3,1), xs=[0,1,2,3].map(i=>x0+st*i), ys=xs.map(x=>m*x+b0), t=ri(15,30), ans=m*t+b0;
  const steps=dzSteps([`Click <b>+</b> (top left) and choose <b>table</b>.`,`Enter the x-values in the x<sub>1</sub> column and the f(x) values in the y<sub>1</sub> column.`,

  const tbl=`<table class="dztab"><tr><th>x</th>${xs.map(x=>`<td>${fmt(x)}</td>`).join("")}</tr><tr><th>f(x)</th>${ys.map(y=>`<td>${fmt(y)}</td>`).join("")}</tr></table>`;
  return dzFin(mk("lin",`The table shows four values of the linear function f. What is the value of f(${t})?`,fmt(ans),[fmt(m*t),fmt(m*t-b0),fmt((m+1)*t+b0)],
    `<b>By hand:</b> slope = (${fmt(ys[1])} − ${paren(ys[0])}) ÷ ${st} = ${fmt(m)}. Then f(x) = ${poly([m,b0])}, so f(${t}) = ${fmt(m)}(${t}) ${b0<0?MN:"+"} ${Math.abs(b0)} = ${fmt(ans)}.`,tbl),steps);
