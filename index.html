<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prep Lab — SAT & ACT</title>
<style>
:root{
  --bg:#f5f6fb; --surface:#ffffff; --surface2:#f2f4f9; --surface3:#e7eaf2; --segon:#ffffff;
  --ink:#161b2e; --muted:#606982; --line:#e3e6ee; --line2:#d3d8e3;
  --good:#1f9d55; --good-soft:#e2f6ea; --bad:#d63c3c; --bad-soft:#fdecec; --warn:#c96a00; --warn-soft:#fff3df;
  --eng:#6f4ae0; --eng-soft:#f0ebff; --math:#0b7f93; --math-soft:#e1f6f9;
  --accent:#4263eb; --accent-ink:#ffffff; --accent-deep:#4263eb;
  --accent-soft:color-mix(in srgb,var(--accent) 12%,var(--surface));
  --shadow:0 1px 2px rgba(22,27,46,.05),0 6px 20px rgba(22,27,46,.05);
  --shadow-lg:0 12px 40px rgba(22,27,46,.13);
  --r:18px; --rs:12px; --pad:24px; --gap:18px;
  --pfont:Georgia,"Iowan Old Style","Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1220; --surface:#161b2b; --surface2:#1d2336; --surface3:#283049; --segon:#2c3550;
    --ink:#e8ebf4; --muted:#9aa3b9; --line:#272e44; --line2:#343c56;
    --good:#5fd47a; --good-soft:#15301f; --bad:#ff7b7b; --bad-soft:#3a1c22; --warn:#ffb347; --warn-soft:#3a2a12;
    --eng:#a98bff; --eng-soft:#272044; --math:#4fd1e3; --math-soft:#12303a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.2); --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1220; --surface:#161b2b; --surface2:#1d2336; --surface3:#283049; --segon:#2c3550;
  --ink:#e8ebf4; --muted:#9aa3b9; --line:#272e44; --line2:#343c56;
  --good:#5fd47a; --good-soft:#15301f; --bad:#ff7b7b; --bad-soft:#3a1c22; --warn:#ffb347; --warn-soft:#3a2a12;
  --eng:#a98bff; --eng-soft:#272044; --math:#4fd1e3; --math-soft:#12303a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.2); --shadow-lg:0 12px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent);font-weight:600}
h1,h2,h3{line-height:1.2;margin:0;letter-spacing:-.015em}
p{margin:.35rem 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
.muted{color:var(--muted)} .mini{font-size:.86rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
html.nomotion *,html.nomotion *::before,html.nomotion *::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 24px}
.brand b{display:block;font-size:1.1rem;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.7rem;font-weight:700;letter-spacing:.1em}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--eng));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.logo.sm{width:28px;height:28px;border-radius:9px;box-shadow:none}
.navlist{display:flex;flex-direction:column;gap:3px}
.navi{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;border-radius:var(--rs);color:var(--muted);font-weight:620;font-size:.95rem;text-align:left;transition:background .15s,color .15s}
.navi:hover{background:var(--surface2);color:var(--ink)}
.navi.on{background:var(--accent-soft);color:var(--accent)}
.navi>span:not(.badge){flex:1}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:.7rem;font-weight:750;display:inline-grid;place-items:center;line-height:1}
.sidefoot{margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:10px}
.goalmini{background:var(--surface2);border-radius:var(--rs);padding:12px 13px}
.goalmini .row{justify-content:space-between;font-size:.8rem;font-weight:650;margin-bottom:7px}
.me{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--rs);padding:8px 10px;text-align:left;width:100%;transition:background .15s}
.me:hover{background:var(--surface2)}
.me>span:not(.av){min-width:0;flex:1}
.me b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{display:block;color:var(--muted);font-size:.75rem}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:750;flex:none;letter-spacing:.02em}
.main{min-width:0}
.topbar{max-width:1120px;margin:0 auto;padding:28px 36px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.topbar h1{font-size:1.7rem;font-weight:800}
.topbar p{color:var(--muted);margin:.3rem 0 0}
.tr{display:flex;gap:8px;align-items:center;flex:none}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.iconbtn:hover{color:var(--ink);background:var(--surface2)}
.avbtn{display:none;padding:0;border:0;background:none;width:auto;height:auto}
.mbrand{display:none;align-items:center;gap:9px;font-weight:800;font-size:1.05rem}
.content{max-width:1120px;margin:0 auto;padding:22px 36px 64px;animation:fadein .25s ease}
.tabbar{display:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.015)}100%{transform:scale(1)}}

/* ---------- generic pieces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);box-shadow:var(--shadow);margin-bottom:var(--gap)}
.panel h3{font-size:1.02rem;font-weight:750;margin:0 0 12px}
.h-sec{font-size:.76rem;font-weight:780;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin:28px 0 12px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ph .h-sec{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:var(--rs);font-weight:650;font-size:.95rem;transition:transform .06s,background .15s,border-color .15s,filter .15s;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface2);border-color:var(--line2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface2)}
.btn.sm{padding:7px 12px;font-size:.86rem}
.btn.lg{padding:13px 22px;font-size:1rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default;transform:none;filter:none}
.bar{height:7px;background:var(--surface3);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .6s ease}
.bar i.g{background:var(--good)} .bar i.w{background:var(--warn)} .bar i.r{background:var(--bad)}
.bar.thin{height:5px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap)}
.grid2>.panel{margin-bottom:0}
kbd{font-family:inherit;font-size:.76rem;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:var(--rs);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;border-radius:calc(var(--rs) - 3px);font-weight:650;color:var(--muted);font-size:.9rem;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--segon);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.full{display:flex}
.seg.full button{flex:1}
.sw{width:46px;height:28px;border-radius:14px;border:0;background:var(--surface3);position:relative;transition:background .2s;flex:none;padding:0}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:var(--accent)} .sw.on i{transform:translateX(18px)}
.inp{font:inherit;font-weight:500;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--rs);padding:11px 13px;width:100%;transition:border-color .15s,box-shadow .15s;min-width:0}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.fl{display:flex;flex-direction:column;gap:6px;font-weight:650;font-size:.9rem;min-width:0}
.fl em{font-style:normal;color:var(--muted);font-weight:500;font-size:.8rem}
.fl small{color:var(--muted);font-weight:500;font-size:.8rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;align-items:center;font-size:.92rem;font-weight:600;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.err{color:var(--bad);font-size:.88rem;font-weight:650;margin:0}
.err:empty{display:none}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatch{width:32px;height:32px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line2);padding:0;transition:box-shadow .15s}
.swatch.on{box-shadow:0 0 0 2.5px var(--ink)}

/* ---------- dashboard ---------- */
.hero{display:flex;gap:28px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 13%,var(--surface)) 0%,var(--surface) 65%);border:1px solid var(--line);border-radius:var(--r);padding:calc(var(--pad) + 8px);box-shadow:var(--shadow);margin-bottom:var(--gap)}
.eyebrow{font-size:.78rem;font-weight:780;color:var(--accent);text-transform:uppercase;letter-spacing:.09em;margin:0 0 6px}
.hero h1{font-size:2.1rem;font-weight:820}
.hero .sub{color:var(--muted);margin-top:8px;max-width:52ch}
.hero-r{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;flex:none}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0}
.ringfg{transition:stroke-dashoffset .9s ease}
.ringlbl{position:relative;text-align:center;line-height:1.1}
.ringlbl b{font-size:1.75rem;font-weight:820}
.ringlbl b span{font-size:.95rem;color:var(--muted);font-weight:650}
.ringlbl small{display:block;color:var(--muted);font-size:.74rem;font-weight:650;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.tile{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ti.eng{background:var(--eng-soft);color:var(--eng)} .ti.math{background:var(--math-soft);color:var(--math)} .ti.hot{background:var(--warn-soft);color:var(--warn)} .ti.good{background:var(--good-soft);color:var(--good)} .ti.bad{background:var(--bad-soft);color:var(--bad)}
.tile .k{font-size:.78rem;color:var(--muted);font-weight:650}
.tile .v{font-size:1.65rem;font-weight:820;line-height:1.15}
.tile .s{font-size:.8rem;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
.qk{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s,box-shadow .15s;color:var(--ink)}
.qk:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.qk b{display:block;font-size:.98rem}
.qk .d{color:var(--muted);font-size:.86rem;display:block;margin-top:2px}
.sline{display:grid;grid-template-columns:90px 1fr 48px;gap:12px;align-items:center;margin:10px 0;font-size:.92rem;font-weight:620}
.sline .n{text-align:right;font-variant-numeric:tabular-nums}
.wk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.93rem}
.tipbox{border-left:4px solid var(--accent);background:var(--accent-soft);padding:14px 16px;border-radius:var(--rs);line-height:1.6}

/* ---------- practice ---------- */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}
.topic{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--rs);padding:13px 15px 13px 18px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,background .15s,transform .15s;position:relative;overflow:hidden;color:var(--ink)}
.topic::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--eng)}
.topic.m::before{background:var(--math)}
.topic:hover{border-color:var(--line2);background:var(--surface2);transform:translateY(-1px)}
.topic b{font-size:.95rem}
.topic .meta{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.qwrap{max-width:840px;margin:0 auto}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pmeta{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;padding:5px 11px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.pill.hot{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:calc(var(--pad) + 4px);box-shadow:var(--shadow);animation:fadeup .25s ease}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tag{font-size:.74rem;font-weight:720;padding:4px 10px;border-radius:20px;background:var(--eng-soft);color:var(--eng)}
.tag.m{background:var(--math-soft);color:var(--math)}
.tag.soft{background:var(--surface2);color:var(--muted)}
.qnum{margin-left:auto;font-size:.78rem;color:var(--muted);font-weight:650}
.passage{background:var(--surface2);border-radius:var(--rs);padding:18px 20px;margin-bottom:18px;font-family:var(--pfont);font-size:1.06rem;line-height:1.72;border-left:3px solid var(--line2)}
.passage ul{margin:.4rem 0;padding-left:1.2rem}
.passage li{margin:.2rem 0}
.passage table{border-collapse:collapse;font-family:inherit;font-size:.95rem;margin:.5rem 0}
.passage th,.passage td{border:1px solid var(--line2);padding:6px 12px;text-align:center}
.passage th{background:var(--surface)}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink);margin:0 3px}
.stem{font-weight:650;font-size:1.04rem;margin:0 0 16px}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--rs);padding:13px 15px;transition:border-color .12s,background .12s,transform .06s,opacity .2s;line-height:1.45;color:var(--ink)}
.choice:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.choice:active:not(:disabled){transform:scale(.995)}
.choice:disabled{cursor:default}
.letter{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-weight:750;font-size:.84rem;color:var(--muted);transition:all .12s}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .letter{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice.correct{border-color:var(--good);background:var(--good-soft);animation:pop .3s ease}
.choice.correct .letter{background:var(--good);border-color:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .letter{background:var(--bad);border-color:var(--bad);color:#fff}
.choice.dim{opacity:.55}
.fb{margin-top:18px;border-radius:var(--rs);padding:16px 18px;background:var(--surface2);border:1px solid var(--line);animation:fadeup .25s ease}
.fb.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.fb.no{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.fb .res{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:6px}
.fb.ok .res{color:var(--good)} .fb.no .res{color:var(--bad)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.83rem}

/* ---------- timed test ---------- */
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--rs);padding:14px;text-align:left;transition:border-color .15s,background .15s;color:var(--ink)}
.opt:hover{border-color:var(--line2)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-size:1.4rem;font-weight:820}
.opt span{color:var(--muted);font-size:.82rem;font-weight:600}
.testbar{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:12px;box-shadow:var(--shadow);position:sticky;top:12px;z-index:5}
.tb-l{flex:1;min-width:0}
.tb-l .bar{margin-top:7px;max-width:260px}
.timer{display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;font-weight:820;font-size:1.25rem}
.timer.low{color:var(--bad)}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.qnav button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:700;position:relative;color:var(--ink)}
.qnav button.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.qnav button.cur{outline:2px solid var(--accent);outline-offset:1px}
.qnav button.fl::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
.qnav button.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.qnav button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.flagbtn.on{color:var(--warn);background:var(--warn-soft)}
.resgrid{display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.stat b{display:block;font-size:1.25rem;font-weight:800}
.stat span{color:var(--muted);font-size:.84rem;font-weight:600}
details.rv{border:1px solid var(--line);border-radius:var(--rs);padding:11px 14px;margin:8px 0;background:var(--surface)}
details.rv summary{cursor:pointer;font-weight:620;list-style:none;display:flex;gap:10px;align-items:center}
details.rv summary::-webkit-details-marker{display:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--good)} .dot.no{background:var(--bad)} .dot.skip{background:var(--muted)}
.rv .body{margin-top:12px}
.hist{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:.93rem}
.hist:first-of-type{border-top:0}

/* ---------- flashcards ---------- */
.fcwrap{max-width:680px;margin:0 auto}
.decks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.deck{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--rs);padding:12px 14px;text-align:left;transition:border-color .15s,background .15s;color:var(--ink);min-width:0}
.deck:hover{border-color:var(--line2)}
.deck.on{border-color:var(--accent);background:var(--accent-soft)}
.deck b{display:block;font-size:.92rem}
.deck small{color:var(--muted);font-size:.78rem;font-weight:600}
.deck .bar{margin-top:8px}
.card3d{perspective:1400px;height:330px;margin:16px 0;cursor:pointer;outline:none}
.card3d .inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card3d.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:calc(var(--r) + 4px);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;overflow:auto}
.face.front{background:linear-gradient(160deg,var(--surface),color-mix(in srgb,var(--accent) 6%,var(--surface)))}
.face.back{transform:rotateY(180deg)}
.face .word{font-size:2.3rem;font-weight:820;letter-spacing:-.02em}
.face .pos{color:var(--muted);font-style:italic;margin-top:4px}
.face .lbl{position:absolute;top:16px;left:20px;font-size:.7rem;font-weight:780;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.face .st{position:absolute;top:13px;right:16px}
.face .def{font-size:1.15rem;font-weight:620}
.face .ex{color:var(--muted);font-style:italic;margin-top:12px;font-family:var(--pfont)}
.face .fml{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:1.08rem;background:var(--surface2);padding:10px 14px;border-radius:10px;margin-top:6px}
.face .fliphint{margin-top:20px;color:var(--muted);font-size:.8rem}
.fcctl{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.pillst{font-size:.72rem;font-weight:750;padding:3px 9px;border-radius:20px}
.pillst.know{background:var(--good-soft);color:var(--good)} .pillst.learn{background:var(--warn-soft);color:var(--warn)}

/* ---------- progress ---------- */
table.prog{width:100%;border-collapse:collapse;font-size:.93rem}
table.prog td,table.prog th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
table.prog tr:last-child td{border-bottom:0}
table.prog td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.prog .bar{margin:0;min-width:70px}
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;min-width:0}
.chart .c i{display:block;width:100%;max-width:30px;background:var(--accent);border-radius:6px 6px 3px 3px;min-height:3px;opacity:.85;transition:height .6s ease}
.chart .c.today i{opacity:1}
.chart .c span{font-size:.68rem;color:var(--muted)}
.chart .c.today span{color:var(--accent);font-weight:800}

/* ---------- settings ---------- */
.setgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.setgrid .panel{margin-bottom:0}
.setgrid .wide{grid-column:1/-1}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.panel h3+.setrow{border-top:0;padding-top:4px}
.sl{min-width:0}
.sl b{display:block;font-weight:650;font-size:.95rem}
.sl small{display:block;color:var(--muted);font-size:.83rem;margin-top:1px}
.sc{flex:none;max-width:62%;display:flex;justify-content:flex-end}
.profhead{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.profhead b{font-size:1.2rem;display:block}
.profgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

/* ---------- sign-up / profile picker ---------- */
.authwrap{min-height:100vh;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(1100px 600px at 0% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%),radial-gradient(900px 500px at 110% 110%,color-mix(in srgb,var(--eng) 14%,transparent),transparent 60%),var(--bg)}
.auth{display:grid;grid-template-columns:1fr 1.05fr;max-width:1000px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow-lg);overflow:hidden;animation:fadeup .35s ease}
.auth.one{grid-template-columns:1fr;max-width:480px}
.auth-art{background:linear-gradient(150deg,var(--accent-deep),#6f4ae0);color:#fff;padding:44px 40px;display:flex;flex-direction:column;gap:22px}
.auth-art .brand{padding:0}
.auth-art .logo{background:rgba(255,255,255,.18);box-shadow:none}
.auth-art .brand small{color:rgba(255,255,255,.75)}
.auth-art h1{font-size:2.15rem;font-weight:820;line-height:1.12}
.auth-art p{opacity:.88;margin:0}
.feat{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:14px}
.feat li{display:flex;gap:12px;align-items:flex-start;font-weight:550}
.feat .fi{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.auth-card{padding:38px 40px;display:flex;flex-direction:column;gap:16px}
.auth-card h2{font-size:1.55rem;font-weight:800}
.auth-card .center{justify-content:center}
.fine{font-size:.8rem;color:var(--muted);text-align:center;margin:0}
.plist{display:grid;gap:10px}
.pitem{display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--rs);padding:12px 14px;transition:border-color .15s,background .15s;color:var(--ink)}
.pitem:hover{border-color:var(--accent);background:var(--accent-soft)}
.pitem>span:not(.av){flex:1;min-width:0}
.pitem b{display:block}
.pitem small{color:var(--muted)}

/* ---------- toasts ---------- */
#toasts{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:650;font-size:.92rem;box-shadow:var(--shadow-lg);animation:fadeup .25s ease;transition:opacity .3s,transform .3s}
.toast.good .ic{color:#51cf66}
.toast.out{opacity:0;transform:translateY(-6px)}

/* ---------- responsive ---------- */
@media (max-width:1060px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .setgrid{grid-template-columns:1fr}
  .profgrid{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .topbar{padding:14px 16px 0;align-items:center}
  .topbar h1{font-size:1.4rem}
  .topbar p{font-size:.88rem}
  .avbtn{display:grid}
  .mbrand{display:flex}
  .content{padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
  .grid2{grid-template-columns:1fr}
  .tabbar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--muted);font-size:10.5px;font-weight:680;position:relative;border-radius:10px;min-width:0}
  .tabbar button.on{color:var(--accent)}
  .tabbar .badge{position:absolute;top:0;left:calc(50% + 5px);min-width:16px;height:16px;font-size:9.5px;padding:0 4px}
  .testbar{top:8px}
}
@media (max-width:640px){
  .hero{flex-direction:column;align-items:stretch;gap:20px;padding:22px}
  .hero h1{font-size:1.65rem}
  .hero-r{flex-direction:row;text-align:left;gap:16px}
  .hero .row .btn{flex:1}
  .tile{padding:14px;gap:10px;flex-direction:column}
  .ti{width:34px;height:34px;border-radius:10px}
  .tile .v{font-size:1.4rem}
  .qcard,.panel{padding:16px}
  .passage{padding:14px 15px;font-size:1rem}
  .card3d{height:300px}
  .face .word{font-size:1.85rem}
  .face{padding:22px}
  .setrow{flex-wrap:wrap;gap:10px}
  .setrow.stack .sc{max-width:none;width:100%;justify-content:flex-start}
  .profgrid{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .hint{display:none}
  .sline{grid-template-columns:72px 1fr 42px}
  .deck{padding:10px}
  .deck small{display:none}
  .auth{border-radius:20px}
}
@media (max-width:820px){
  .auth{grid-template-columns:1fr}
  .auth-art{padding:26px 24px;gap:12px}
  .auth-art h1{font-size:1.5rem}
  .feat{display:none}
  .auth-card{padding:24px 20px}
}
</style>
</head>
<body>
<div id="auth" class="authwrap" hidden></div>
<div class="shell" id="shell" hidden>
  <aside class="side" id="side" aria-label="Main navigation"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="app"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main navigation" hidden></nav>
<div id="toasts" aria-live="polite"></div>

<script>
"use strict";
/* =====================================================================
   TOPICS
   ===================================================================== */
const TOPICS = {
  punc:{n:"Punctuation & Boundaries",s:"E"}, sva:{n:"Subject–Verb Agreement",s:"E"}, pron:{n:"Pronouns",s:"E"},
  mod:{n:"Modifiers",s:"E"}, para:{n:"Parallel Structure",s:"E"}, tense:{n:"Verb Tense",s:"E"},
  trans:{n:"Transitions",s:"E"}, wic:{n:"Words in Context",s:"E"}, synth:{n:"Rhetorical Synthesis",s:"E"},
  read:{n:"Main Idea & Inference",s:"E"}, conc:{n:"Concision & Style",s:"E"}, evid:{n:"Command of Evidence",s:"E"},
  lin:{n:"Linear Equations",s:"M"}, sys:{n:"Systems of Equations",s:"M"}, quad:{n:"Quadratics",s:"M"},
  func:{n:"Functions",s:"M"}, expo:{n:"Exponentials",s:"M"}, poly:{n:"Polynomials",s:"M"},
  pct:{n:"Ratios & Percents",s:"M"}, stat:{n:"Statistics",s:"M"}, prob:{n:"Probability",s:"M"},
  geo:{n:"Geometry",s:"M"}, trig:{n:"Trigonometry",s:"M"}, word:{n:"Word Problems",s:"M"}
};
const ETOP = Object.keys(TOPICS).filter(k=>TOPICS[k].s==="E");
const MTOP = Object.keys(TOPICS).filter(k=>TOPICS[k].s==="M");
const BL = '<span class="blank"></span>';
const STD = "Which choice completes the text so that it conforms to the conventions of Standard English?";
const WIC = "Which choice completes the text with the most logical and precise word or phrase?";
const TRN = "Which choice completes the text with the most logical transition?";
const SYN = "Which choice most effectively uses relevant information from the notes to accomplish this goal?";

/* =====================================================================
   HAND-WRITTEN QUESTION BANK  (correct answer is always listed first;
   choices are shuffled when shown)
   ===================================================================== */
const BANK = [];
function add(t,q,c,e,p){ BANK.push({id:"b"+BANK.length,t,s:TOPICS[t].s,q,c,a:0,e,p:p||""}); }
function gq(t,sent,c,e){ add(t,STD,c,e,sent.replace("___",BL)); }

/* ---- Punctuation & boundaries ---- */
gq("punc","The Mariana Trench is the deepest known point in Earth’s ___ lowest region, the Challenger Deep, lies nearly 11,000 meters below sea level.",
 ["oceans; its","oceans, its","oceans its","oceans, and, its"],
 "Both halves are independent clauses (each could stand alone). A semicolon can join two independent clauses. A comma alone creates a comma splice, and no punctuation creates a run-on.");
gq("punc","The recipe calls for three essential ___ coriander, and turmeric.",
 ["spices: cumin,","spices; cumin,","spices, such as: cumin,","spices which cumin,"],
 "A colon can follow a complete independent clause to introduce a list. A semicolon must be followed by an independent clause, and a colon should not come directly after “such as.”");
gq("punc","Rosalind ___ produced the X-ray image that revealed the helical structure of DNA.",
 ["Franklin, a British chemist,","Franklin, a British chemist","Franklin a British chemist,","Franklin; a British chemist,"],
 "“A British chemist” is a nonessential appositive, so it needs a matching pair of commas around it—one before and one after.");
gq("punc","After the flood, volunteers rebuilt all of the ___ along the riverbank.",
 ["herons’ nests","heron’s nests","herons nests","herons’s nests"],
 "“All of the” nests belong to many herons, so the plural possessive is needed: herons + apostrophe → herons’.");
gq("punc","The novel that won this year’s ___ a family across four generations of change.",
 ["prize follows","prize, follows","prize—follows","prize; follows"],
 "The subject is “The novel that won this year’s prize” and the verb is “follows.” Never separate a subject from its verb with a single punctuation mark.");
gq("punc","The city’s oldest bridge—built in 1874 and restored twice ___ open to pedestrians today.",
 ["since—remains","since, remains","since; remains","since remains"],
 "The interrupting phrase opened with a dash, so it must close with a dash. Mixing a dash with a comma is incorrect.");
gq("punc","Jazz pianist Mary Lou Williams composed hundreds of ___ also mentored younger artists such as Thelonious Monk.",
 ["pieces, and she","pieces and, she","pieces, she","pieces, and, she"],
 "To join two independent clauses with a coordinating conjunction (FANBOYS), put a comma before the conjunction: “pieces, and she.” A comma alone is a comma splice.");
gq("punc","The experiment’s first trial ___ the second trial produced the expected results.",
 ["failed; however,","failed, however,","failed; however","failed however,"],
 "“However” here links two independent clauses, so it needs a semicolon before it and a comma after it.");
gq("punc","Many historians argue that the printing ___ European society more than any other invention of its era.",
 ["press transformed","press, transformed","press—transformed","press; transformed"],
 "“The printing press” is the subject of the clause and “transformed” is its verb; no punctuation should separate them.");
gq("punc","The team’s goal was ___ the regional championship for the first time in school history.",
 ["simple: win","simple; win","simple, win","simple: to, win"],
 "A colon can follow an independent clause to introduce an explanation. A semicolon would require an independent clause after it, and a comma here creates an awkward splice.");
gq("punc","Octavia Butler’s novel ___ published in 1979, blends science fiction with historical fiction.",
 ["Kindred,","Kindred","Kindred;","Kindred:"],
 "“Published in 1979” is a nonessential phrase. It is already closed by the comma after “1979,” so it must be opened by a comma after “Kindred.” (No comma goes between “novel” and “Kindred” because Butler wrote several novels, so the title is essential.)");
gq("punc","The museum’s new exhibit ___ which opened last month, features artifacts from ancient Mesopotamia.",
 ["hall,","hall","hall;","hall:"],
 "“Which opened last month” is a nonessential clause. It is closed by a comma after “month,” so it must be opened by a comma after “hall.”");

/* ---- Subject–verb agreement ---- */
gq("sva","The collection of rare manuscripts, some dating to the twelfth century, ___ in a climate-controlled vault.",
 ["is housed","are housed","were housed","have been housed"],
 "The subject is the singular “collection,” not “manuscripts” (which is inside a prepositional phrase). A singular subject takes the singular verb “is.”");
gq("sva","Neither the coach nor the players ___ satisfied with the referee’s decision.",
 ["were","was","is","has been"],
 "With “neither…nor,” the verb agrees with the subject closer to it. “Players” is plural, so the verb is “were.”");
gq("sva","Each of the twenty volunteers ___ responsible for cleaning a single section of the trail.",
 ["is","are","were","have been"],
 "“Each” is the subject and is always singular. “Of the twenty volunteers” is a prepositional phrase and does not change the number.");
gq("sva","Along the outer edge of the reef ___ several species of brightly colored fish.",
 ["live","lives","is living","has lived"],
 "This sentence is inverted: the subject “several species” comes after the verb. “Several species” is plural, so the verb is “live.”");
gq("sva","The agency’s report, along with two independent studies, ___ that the new policy reduced traffic deaths.",
 ["suggests","suggest","are suggesting","have suggested"],
 "Phrases like “along with,” “as well as,” and “together with” do not make a subject plural. The subject is the singular “report.”");
gq("sva","The number of students taking advanced math courses ___ risen steadily over the past decade.",
 ["has","have","are","were"],
 "“The number” is singular (while “a number of” is plural). The singular subject takes “has.”");
gq("sva","Mathematics, despite its reputation for difficulty, ___ often the favorite subject of students who enjoy puzzles.",
 ["is","are","were","have been"],
 "“Mathematics” ends in -s but is a singular noun (like “physics” and “news”), so it takes “is.”");
gq("sva","The flock of migrating geese that stops at the lake every autumn ___ the attention of birdwatchers from across the state.",
 ["attracts","attract","are attracting","have attracted"],
 "The subject is “flock,” a singular collective noun. Ignore the phrases between subject and verb.");

/* ---- Pronouns ---- */
gq("pron","After customers raised concerns, the company updated ___ privacy policy.",
 ["its","it’s","their","its’"],
 "“Company” is singular, so the possessive pronoun is “its” (no apostrophe). “It’s” means “it is,” and “its’” is never correct.");
gq("pron","When Maya and ___ finished the experiment, we recorded our results in a shared notebook.",
 ["I","me","myself","us"],
 "Drop “Maya and” to test: “When I finished” is correct, not “When me finished.” Subject pronouns (I, he, she, we, they) are used as subjects.");
gq("pron","The jury delivered ___ verdict after three days of deliberation.",
 ["its","their","it’s","they’re"],
 "A collective noun acting as one unit (“jury”) is singular and takes the singular possessive “its.”");
gq("pron","The award was presented to Dr. Chen and ___ at the end of the ceremony.",
 ["me","I","myself","mine"],
 "Drop “Dr. Chen and”: “presented to me.” After a preposition, use an object pronoun (me, him, her, us, them).");
gq("pron","The scientist ___ the committee honored has published more than forty papers on coral ecology.",
 ["whom","who","which","whose"],
 "The committee honored HIM/HER, an object, so use “whom.” (Use “who” where you would say he/she.)");
gq("pron","Before the debate, each of the candidates submitted ___ opening statement to the moderator.",
 ["his or her","their","its","they’re"],
 "“Each” is singular, and the candidates are people, so formal Standard English uses “his or her.” (“Its” is for things.)");
gq("pron","The researchers compared the new vaccine with older versions and found that ___ produced a stronger immune response.",
 ["the new vaccine","it","they","this"],
 "“It” could refer to the new vaccine or an older one, and “they” could refer to the researchers. Naming the noun removes the ambiguity.");

/* ---- Modifiers ---- */
add("mod",STD,["the visitors admired the ancient pottery","the ancient pottery impressed the visitors","admiration for the ancient pottery grew among visitors","the pottery, ancient and admired, impressed visitors"],
 "The opening phrase “Walking through the museum” must describe the noun right after the comma. Only the visitors can walk, so “the visitors” must come first.",
 "Walking through the museum, "+BL+".");
add("mod",STD,["biologist Lena Ortiz predicted that the herds would arrive early","the herds were predicted by biologist Lena Ortiz to arrive early","the prediction by biologist Lena Ortiz was that the herds would arrive early","an early arrival of the herds was predicted by biologist Lena Ortiz"],
 "The person who studied the patterns must immediately follow the comma. The herds and the prediction didn’t study anything.",
 "Having studied caribou migration patterns for over a decade, "+BL+".");
add("mod",STD,["the Musée d’Orsay now houses one of the world’s great collections of Impressionist art","visitors to the Musée d’Orsay can now see Impressionist art","Paris converted the Musée d’Orsay into an art museum","Impressionist art is now housed in the Musée d’Orsay"],
 "The thing “originally built as a railway station” is the building itself, so the Musée d’Orsay must come right after the comma.",
 "Originally built as a railway station in 1900, "+BL+".");
add("mod",STD,["Annie Dillard won the Pulitzer Prize for her book Pilgrim at Tinker Creek","the Pulitzer Prize was awarded to Annie Dillard for Pilgrim at Tinker Creek","Pilgrim at Tinker Creek earned Annie Dillard the Pulitzer Prize","the book Pilgrim at Tinker Creek won Annie Dillard a Pulitzer Prize"],
 "The modifier describes a person known for her descriptions, so the sentence must continue with “Annie Dillard.”",
 "Known for her vivid descriptions of the natural world, "+BL+".");
add("mod",STD,["the students found the final exam surprisingly easy","the final exam seemed surprisingly easy to the students","the final exam was surprisingly easy for the students","surprisingly, the final exam was easy for the students"],
 "Who prepared for weeks? The students—so “the students” must directly follow the introductory phrase.",
 "After preparing for weeks, "+BL+".");

/* ---- Parallel structure ---- */
gq("para","The renovated library offers quiet study rooms, free tutoring, and ___.",
 ["a makerspace with 3D printers","students can use 3D printers","using the 3D printers","it has a makerspace"],
 "Items in a list must share the same form. The first two items are noun phrases, so the third must be a noun phrase too.");
gq("para","Good writers revise not only for clarity but also ___.",
 ["for tone","they revise for tone","tone is considered","because of tone"],
 "“Not only X but also Y” requires X and Y to match. “For clarity” pairs with “for tone.”");
gq("para","She preferred hiking in the mountains to ___ on the beach.",
 ["lounging","lounge","have lounged","the lounging of herself"],
 "Compare like forms: “hiking” (a gerund) to “lounging” (a gerund).");
gq("para","The coach told the team to stretch before practice, to drink plenty of water, and ___.",
 ["to get enough sleep","getting enough sleep","that they should sleep enough","sleep should be enough"],
 "The list uses infinitives (“to stretch,” “to drink”), so the last item should be “to get.”");
gq("para","The documentary explains how bees pollinate crops, why colonies collapse, and ___.",
 ["what farmers can do to protect them","the protection of bees by farmers","farmers protecting them","to protect bees as farmers"],
 "Each item begins with a question word followed by a clause: how…, why…, what….");

/* ---- Verb tense ---- */
gq("tense","By the time the rescue team arrived, the stranded hikers ___ for nearly two days.",
 ["had been waiting","have been waiting","will have waited","are waiting"],
 "The waiting happened before another past event (the team arrived), so use the past perfect: “had been waiting.”");
gq("tense","In July 1969, the Apollo 11 lunar module ___ on the Moon’s Sea of Tranquility.",
 ["landed","lands","has landed","will land"],
 "The sentence describes a completed event at a specific time in the past, so use the simple past.");
gq("tense","Every summer since 2015, the festival ___ thousands of visitors to the small coastal town.",
 ["has attracted","attract","will attract","had attracted"],
 "“Since 2015” describes an action that began in the past and continues into the present, which calls for the present perfect “has attracted.”");
gq("tense","If the city council ___ the proposal next week, construction on the new park will begin in the spring.",
 ["approves","approved","would approve","had approved"],
 "In a real future conditional, the “if” clause uses the present tense and the main clause uses “will.”");
gq("tense","In her 1962 book Silent Spring, Rachel Carson ___ that pesticides were harming wildlife, and the book helped launch the modern environmental movement.",
 ["argued","argues","will argue","is arguing"],
 "The rest of the sentence is in the past (“were harming,” “helped”), so the verb should be consistent: “argued.”");

/* ---- Transitions ---- */
add("trans",TRN,["Nevertheless","Therefore","Similarly","For example"],

 "Octopuses have short lifespans, often living only one to two years. "+BL+", they display remarkable problem-solving abilities, such as unscrewing jar lids to reach food.");
add("trans",TRN,["As a result","However","Likewise","In contrast"],
 "Rising bread prices are an effect of the smaller harvest, so a cause-and-effect transition fits.",
 "A severe drought reduced the region’s wheat harvest by nearly 40 percent. "+BL+", bread prices in local markets rose sharply.");
add("trans",TRN,["For instance","Nonetheless","Consequently","Meanwhile"],
 "The Gobi is an example of a cold desert, illustrating the previous sentence’s claim.",
 "Not all deserts are hot. "+BL+", the Gobi Desert in Mongolia regularly sees winter temperatures below −30°C.");
add("trans",TRN,["By contrast","Similarly","As a result","For example"],
 "The text contrasts early gearless bicycles with modern bicycles that have many gears.",
 "Early bicycles had no gears, which made steep hills difficult to climb. "+BL+", many modern bicycles offer more than twenty gear combinations.");
add("trans",TRN,["Additionally","Instead","Nevertheless","Conversely"],
 "The second sentence adds another energy-saving feature to the first, so an addition transition fits.",
 "The architect designed the building to make maximum use of natural light. "+BL+", she installed rooftop solar panels to reduce its reliance on the electrical grid.");
add("trans",TRN,["However","Accordingly","Furthermore","Specifically"],
 "The results contradicted what researchers expected, so a contrast transition is needed.",
 "Researchers expected the new fertilizer to increase crop yields. "+BL+", yields in the test fields were nearly identical to those in the control fields.");
add("trans",TRN,["Specifically","Nevertheless","In contrast","Otherwise"],
 "The second sentence gives a precise detail about how the waggle dance communicates location.",
 "Honeybees communicate the location of food through a “waggle dance.” "+BL+", the angle of the dance indicates the direction of the food relative to the sun.");
add("trans",TRN,["Ultimately","Previously","For instance","Similarly"],
 "After describing years of setbacks, the final sentence gives the eventual outcome, so “Ultimately” fits.",
 "The engineers spent six years redesigning the telescope’s mirrors after repeated test failures. "+BL+", the telescope launched successfully and began sending back images of distant galaxies.");

add("wic",WIC,["pivotal","peripheral","derivative","obscure"],

/* ---- Rhetorical synthesis ---- */
add("synth","The student wants to emphasize why scientists study axolotls. "+SYN,
 ["Because axolotls can regenerate limbs, parts of the heart, and even portions of the brain, scientists study them to understand tissue regeneration.",
  "The axolotl, a salamander native to lakes near Mexico City, keeps its external gills throughout its life.",
  "Unlike most salamanders, axolotls retain larval features as adults.",
  "Axolotls are salamanders that live in lakes near Mexico City."],
 "The goal is a REASON scientists study axolotls. Only the correct choice connects their regenerative ability to scientific research.",
 "While researching a topic, a student has taken the following notes:<ul><li>The axolotl is a salamander native to lakes near Mexico City.</li><li>Unlike most salamanders, it keeps larval features such as external gills its whole life.</li><li>Axolotls can regenerate limbs, parts of the heart, and portions of the brain.</li><li>Scientists study axolotls to understand tissue regeneration.</li></ul>");
add("synth","The student wants to introduce Mules and Men to an audience unfamiliar with Zora Neale Hurston. "+SYN,
 ["Mules and Men (1935) is a collection of African American folklore gathered by Zora Neale Hurston, an American writer and anthropologist.",
  "Hurston published Their Eyes Were Watching God in 1937, two years after Mules and Men.",
  "Mules and Men was published in 1935.",
  "Zora Neale Hurston lived from 1891 to 1960."],
 "An unfamiliar audience needs to know what the book is AND who Hurston was. Only the correct choice does both.",
 "While researching a topic, a student has taken the following notes:<ul><li>Zora Neale Hurston (1891–1960) was an American writer and anthropologist.</li><li>Her novel Their Eyes Were Watching God was published in 1937.</li><li>She collected African American folklore in the American South.</li><li>Her folklore collection Mules and Men appeared in 1935.</li></ul>");
add("synth","The student wants to contrast the shapes of the two volcanoes. "+SYN,
 ["While Mauna Loa, a shield volcano, has gentle slopes, Mount Fuji, a stratovolcano, has steep slopes built from layers of lava and ash.",
  "Mauna Loa and Mount Fuji are both well-known volcanoes.",
  "Mount Fuji, located in Japan, is a stratovolcano.",
  "Shield volcanoes like Mauna Loa are formed by runny lava flows."],
 "A contrast must mention BOTH volcanoes and how their shapes differ. Only the correct choice does that.",
 "While researching a topic, a student has taken the following notes:<ul><li>Mauna Loa in Hawaii is a shield volcano.</li><li>Shield volcanoes have gentle slopes formed by runny lava.</li><li>Mount Fuji in Japan is a stratovolcano.</li><li>Stratovolcanoes have steep slopes built from alternating layers of lava and ash.</li></ul>");
add("synth","The student wants to emphasize the scale of the Great Barrier Reef. "+SYN,
 ["Stretching more than 2,300 kilometers and visible from space, the Great Barrier Reef is the largest coral reef system on Earth.",
  "The Great Barrier Reef, located off the coast of Queensland, Australia, faces threats from warming waters.",
  "Coral bleaching, caused by rising ocean temperatures, threatens the Great Barrier Reef.",
  "The Great Barrier Reef is located off the coast of Queensland, Australia."],
 "“Scale” means size. Only the correct choice uses the size details: 2,300 km, visible from space, largest system.",
 "While researching a topic, a student has taken the following notes:<ul><li>The Great Barrier Reef lies off the coast of Queensland, Australia.</li><li>It stretches more than 2,300 kilometers.</li><li>It is the largest coral reef system on Earth and is visible from space.</li><li>Rising ocean temperatures have caused widespread coral bleaching.</li></ul>");

const P1="When the city replaced street parking on Elm Street with protected bike lanes, local shop owners protested, fearing that customers who could no longer park nearby would simply stop coming. A year later, however, sales records told a different story: most businesses along the corridor reported higher revenues than before, and pedestrian traffic had increased by nearly a quarter.";

 ["Contrary to shop owners’ fears, the bike lanes did not hurt—and may have helped—businesses on Elm Street.",

  "A shortage of parking forced several Elm Street businesses to close.",
  "Bike lanes increase revenue for businesses in every city."],
 "The text sets up a fear (lost customers) and then reverses it with evidence (higher revenue, more foot traffic). Choice about “every city” overgeneralizes.",P1);
const P2="Grandmother kept her garden the way other people kept diaries. Each row held a year: the fig tree planted the spring my mother was born, the roses added after the war, the crooked line of tomatoes she started the summer Grandfather died and never had the heart to straighten.";

add("read","Based on the text, the “crooked line of tomatoes” most likely reflects the grandmother’s",
 ["grief and wish to preserve a memory","lack of gardening skill","preference for unusual garden designs","impatience with gardening chores"],
 "She started the row when her husband died and “never had the heart to straighten” it—she kept it unchanged out of grief and memory.",P2);

 ["It explains a cause of the change described in the first sentence.","It presents a counterargument to the researchers’ findings.","It introduces a new question for future research.","It describes the methods the researchers used."],

add("read","Based on the text, which finches were most likely to survive the drought?",
 ["Those with deeper beaks that could crack large, hard seeds","Those with shallow beaks suited to small, soft seeds","Those that migrated to the mainland","Those that ate insects instead of seeds"],
 "Only hard seeds remained, and only deep-beaked birds could open them, so those birds had a survival advantage.",P3);
const P4="Some economists argue that raising the minimum wage reduces employment, since businesses facing higher labor costs may hire fewer workers. Others counter that higher wages reduce employee turnover—saving businesses the costs of recruiting and training—and put more money into the hands of consumers who will spend it at local businesses.";

const P5="In 1848, the Seneca Falls Convention issued the Declaration of Sentiments, a document deliberately modeled on the Declaration of Independence. By echoing the language of 1776—“We hold these truths to be self-evident: that all men and women are created equal”—its authors framed their demand for women’s rights as a fulfillment of the nation’s founding principles rather than a rejection of them.";

const MN="−";
function fmt(n){ n=Math.round(n*100)/100; if(Object.is(n,-0)) n=0; return n<0? MN+Math.abs(n) : String(n); }
function paren(n){ return n<0? "("+fmt(n)+")" : fmt(n); }
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t;}return a||1;}
function frac(n,d){ if(d<0){n=-n;d=-d;} const g=gcd(n,d); n/=g; d/=g; return d===1? fmt(n) : (n<0?MN:"")+Math.abs(n)+"/"+d; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function poly(cs,v){ v=v||"x"; const deg=cs.length-1; let s="";
  cs.forEach((c,i)=>{ const p=deg-i; if(!c) return; const ab=Math.abs(c);
    const coef=(ab===1&&p>0)?"":String(ab); const vp=p===0?"":p===1?v:v+(p===2?"²":p===3?"³":"^"+p);
    const term=coef+vp; if(!s) s=(c<0?MN:"")+term; else s+=(c<0?" "+MN+" ":" + ")+term; });
  return s||"0"; }
function lin2(a,b,c){ // ax + by = c
  let s=""; const t=(k,v)=>Math.abs(k)===1?v:Math.abs(k)+v;
  if(a) s=(a<0?MN:"")+t(a,"x");
  if(b) s+= s? (b<0?" "+MN+" ":" + ")+t(b,"y") : (b<0?MN:"")+t(b,"y");
  return s+" = "+fmt(c); }
function fac(r){ return r<0? `(x + ${-r})` : `(x ${MN} ${r})`; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
let gid=0;
function mk(t,q,correct,wrongs,e,p){
  const out=[String(correct)];
  for(const w of wrongs){ const s=String(w); if(!out.includes(s)) out.push(s); if(out.length===4) break; }
  const cs=String(correct).replace(MN,"-");
  const num=Number(cs), fm=cs.match(/^(-?\d+)\/(\d+)$/), pm=cs.match(/^(-?\d+(?:\.\d+)?)π$/);
  let k=1;
  while(out.length<4 && k<40){
    const dlt=k%2? Math.ceil(k/2) : -Math.ceil(k/2); let cand=null;
    if(isFinite(num)) cand=fmt(num+dlt);
    else if(fm) cand=frac(Number(fm[1])+dlt,Number(fm[2]));
    else if(pm && Number(pm[1])+dlt>0) cand=fmt(Number(pm[1])+dlt)+"π";
    if(cand && !out.includes(cand)) out.push(cand);
    k++;
  }
  while(out.length<4) out.push("None of these");  // safety only
  return {id:"g"+(Date.now().toString(36))+(gid++), t, s:TOPICS[t].s, q, c:out, a:0, e, p:p||"", gen:true};
}

  return mk("word",`One machine can complete a job in ${a} hours, and a second machine can complete it in ${b} hours. Working together at these rates, how many hours will the job take?`,fmt(t),
    [fmt((a+b)/2),fmt(a+b),fmt(Math.abs(a-b)),fmt(Math.min(a,b)/2)],
    `Rates add: 1/${a} + 1/${b} = ${frac(a+b,a*b)} job per hour. Time = 1 ÷ ${frac(a+b,a*b)} = ${fmt(t)} hours.`);
});
reg("word",()=>{
  const n=2*ri(2,40), S=3*n+6;
  return mk("word",`The sum of three consecutive even integers is ${S}. What is the largest of the three integers?`,String(n+4),[String(n),String(n+2),String(n+6),fmt(S/3)],
    `Let them be n, n + 2, n + 4. Then 3n + 6 = ${S} → n = ${n}. The largest is n + 4 = ${n+4}.`);
});


/* =====================================================================
   EXPANSION PACK — more hand-written questions, vocabulary, cards,
   and generators
   ===================================================================== */
const NOTES=items=>"While researching a topic, a student has taken the following notes:<ul>"+items.map(i=>"<li>"+i+"</li>").join("")+"</ul>";
const CONC="Which choice completes the text most concisely while keeping its meaning?";

/* ---- Punctuation & boundaries ---- */
gq("punc","The museum’s newest exhibit features artifacts from three ancient ___ Egypt, Greece, and Rome.",
 ["civilizations:","civilizations;","civilizations, which","civilizations that"],
 "A complete independent clause comes before the blank, and a list follows. A colon is the right way to introduce that list. A semicolon would need another independent clause after it.");
gq("punc","Many desert plants store water in thick ___ others send roots deep underground to reach groundwater.",
 ["stems, while","stems,","stems while,","stems; while"],
 "“While others send roots…” is a dependent clause, so a comma before “while” attaches it correctly. A comma alone creates a comma splice. A semicolon can’t come before a dependent clause.");
gq("punc","The novelist’s first ___ published when she was only nineteen, became an instant bestseller.",
 ["book,","book","book;","book—"],
 "“Published when she was only nineteen” is extra information already closed by a comma, so it needs a matching comma before it. A dash would not match the comma after.");
gq("punc","Jupiter has at least 95 known ___ the four largest were discovered by Galileo in 1610.",
 ["moons; the","moons, the","moons the","moons, and, the"],
 "Both sides are independent clauses, so they need a semicolon (or a period). A comma alone is a comma splice, and no punctuation makes a run-on.");
gq("punc","Engineers tested the bridge’s design in a wind ___ wanted to be sure it could withstand hurricane-force gusts.",
 ["tunnel because they","tunnel, they","tunnel. Because they","tunnel; because they"],
 "“Because they wanted…” is a dependent clause that finishes the sentence. It needs no punctuation before it. Choice “. Because they” leaves a fragment, and a comma alone creates a splice.");
gq("punc","The tallest tree ever measured, a coast redwood named ___ stands more than 115 meters tall.",
 ["Hyperion,","Hyperion","Hyperion;","Hyperion:"],
 "The appositive “a coast redwood named Hyperion” opens with a comma, so it must close with one before the verb “stands.”");
gq("punc","Marie Curie won Nobel Prizes in two different ___ physics in 1903 and chemistry in 1911.",
 ["sciences:","sciences;","sciences, being","sciences and"],
 "A colon follows a complete clause to introduce an explanation or list. Here it introduces the two prizes. A semicolon needs an independent clause after it.");

/* ---- Subject–verb agreement ---- */
gq("sva","The collection of rare coins that my grandfather left me ___ kept in a safe-deposit box.",
 ["is","are","were","have been"],
 "The subject is “collection” (singular). “Of rare coins” is a prepositional phrase, so ignore it. Singular subject → “is.”");
gq("sva","Neither the players nor the coach ___ expecting the sudden thunderstorm.",
 ["was","were","are","have been"],
 "With “neither…nor,” the verb agrees with the closer subject: “the coach” (singular) → “was.”");
gq("sva","Along the edge of the canyon ___ a row of ancient juniper trees.",
 ["grows","grow","are growing","have grown"],
 "The sentence is inverted. The real subject comes after the verb: “a row” (singular). “Of ancient juniper trees” is a prepositional phrase. Singular → “grows.”");
gq("sva","Each of the students in the robotics club ___ responsible for one part of the design.",
 ["is","are","were","have been"],
 "“Each” is always singular, no matter what phrase follows it, so the verb is “is.”");
gq("sva","The results of the latest survey, which included more than 2,000 participants, ___ that most teens get less sleep than doctors recommend.",
 ["suggest","suggests","has suggested","was suggesting"],
 "The subject is “results” (plural). Skip the prepositional phrase and the nonessential clause between commas. Plural, present tense → “suggest.”");
gq("sva","Mathematics, along with physics and chemistry, ___ a required course for engineering majors.",
 ["is","are","were","have been"],
 "Phrases like “along with” and “as well as” do NOT make a compound subject. The subject is “Mathematics,” which is singular → “is.”");

/* ---- Pronouns ---- */
gq("pron","When the scientists finally published ___ findings, other labs rushed to replicate the experiment.",
 ["their","its","his or her","they’re"],
 "The pronoun refers to “the scientists” (plural), so the plural possessive “their” is correct. “They’re” means “they are.”");
gq("pron","The award will be shared by Priya and ___ since we designed the project together.",
 ["me","I","myself","mine"],
 "Remove “Priya and”: “shared by me.” After a preposition, use the object pronoun “me.” “Myself” only works when “I” is also the subject.");
gq("pron","The architect ___ designed the new library also planned the city’s riverside park.",
 ["who","whom","which","whose"],
 "The pronoun is the subject of “designed” (HE designed), so use “who.” “Which” is for things, not people.");
gq("pron","To ___ should the committee send the final report?",
 ["whom","who","whoever","which"],
 "Rephrase it: “The committee should send it to HIM.” “Him” is an object pronoun, so use “whom,” the object form.");
gq("pron","Every country in the alliance agreed to reduce ___ carbon emissions by 2035.",
 ["its","their","it’s","there"],
 "“Every country” is singular, so it takes the singular possessive “its.” “It’s” means “it is.”");
gq("pron","Between you and ___, the surprise party is next Friday.",
 ["me","I","myself","mine"],
 "“Between” is a preposition, so both pronouns after it must be object pronouns: “between you and me.”");

 "The senator was praised not only for her honesty but also "+BL);
add("para",STD,["painting the visitor center.","they painted the visitor center.","to paint the visitor center.","the visitor center was painted."],

 "Volunteers spent the weekend planting trees, clearing trails, and "+BL);
add("para",STD,["that of Chicago.","Chicago.","Chicago’s climate is.","in Chicago."],
 "Compare like with like: Seattle’s climate with Chicago’s CLIMATE (“that of Chicago”), not with the city itself.",
 "The climate of Seattle is milder than "+BL);

/* ---- Verb tense ---- */
gq("tense","By the time the firefighters arrived, the blaze ___ through three floors of the building.",
 ["had spread","spreads","has spread","will spread"],
 "The spreading finished BEFORE another past event (the firefighters arriving), so use the past perfect: “had spread.”");
gq("tense","Every summer since 2015, the town ___ a festival celebrating its founding.",
 ["has held","held","had held","will have held"],
 "“Since 2015” describes something that started in the past and continues now. That calls for the present perfect: “has held.”");
gq("tense","In 1969, Neil Armstrong ___ the first person to walk on the Moon.",
 ["became","becomes","has become","will become"],
 "A completed event at a specific past time (1969) takes the simple past: “became.”");
gq("tense","Researchers predict that by 2050, global demand for fresh water ___ by more than 20 percent.",
 ["will have increased","had increased","increased","has been increasing"],
 "“By 2050” marks a point in the future when the increase will be complete. That is the future perfect: “will have increased.”");
gq("tense","As she walked home from school yesterday, Tara ___ a lost puppy hiding under a bench.",
 ["noticed","notices","has noticed","will notice"],
 "“Walked” and “yesterday” put the sentence in the past, so the simple past “noticed” keeps the tenses consistent.");

/* ---- Transitions ---- */
add("trans",TRN,["Specifically","However","Nevertheless","In contrast"],
 "The second sentence gives a precise detail about how the dance works. “Specifically” introduces that kind of detail. Nothing here is a contrast.",
 "Honeybees communicate the location of food through a “waggle dance.” "+BL+", the angle of the dance indicates the direction of the food relative to the sun.");
add("trans",TRN,["However","Therefore","For example","Similarly"],
 "No tailpipe emissions sounds entirely clean, but the coal-generated electricity complicates that. A contrast transition fits.",
 "Electric cars produce no tailpipe emissions. "+BL+", the electricity that charges them is sometimes generated by burning coal.");
add("trans",TRN,["As a result","However","In contrast","Likewise"],
 "Being buried by ash is the CAUSE, and preservation is the EFFECT. “As a result” signals cause and effect.",
 "The ancient city of Pompeii was buried by volcanic ash in 79 CE. "+BL+", many of its buildings, paintings, and even loaves of bread were preserved for nearly two thousand years.");
add("trans",TRN,["Similarly","Consequently","However","Instead"],
 "Both sentences describe animals that migrate long distances. The second makes a parallel point, so “Similarly” fits.",
 "Some birds, like the Arctic tern, migrate thousands of miles each year. "+BL+", monarch butterflies travel up to 3,000 miles between Canada and Mexico.");
add("trans",TRN,["Today, however","Therefore","Moreover","For instance"],

add("trans",TRN,["Next","In contrast","Nevertheless","For example"],
 "The text gives steps in order (“first… ___”). A sequence word, “Next,” continues the steps.",

add("trans",TRN,["Moreover","However","Instead","Nonetheless"],
